[package]
name = "ols-structure-app"
description = "OLS CAD structure application: a structure file (.olss) in its own window, from level 1 to level 3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ols-structure"
path = "src/main.rs"

[dependencies]
ols-core.workspace = true
ols-structures.workspace = true
ols-sections.workspace = true
toml.workspace = true
ols-structure-edit.workspace = true
ols-structure-loads.workspace = true
ols-structure-link.workspace = true
ols-structure-export.workspace = true
ols-render.workspace = true
eframe.workspace = true
clap.workspace = true
toml_edit = "0.25"
# Native file dialogs (Open, Save as).
rfd = "0.17"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }

[lints]
workspace = true
