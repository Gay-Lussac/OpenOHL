[[case]]
id = "structsize-004"
title = "SIA 263 6.2.2.2: eight bolts in one line make a long joint, the bolt shear reduced by β_Lf"
calculation = "structure.long_joint"
reference = "By hand (O49 stage 1c): D1's ends have eight 16 mm bolts in one line (one hole in the section) at a pitch of 50 mm: L_j = 7 × 50 = 350 mm above 15 d = 240 mm; SIA 263 6.2.2.2, Figure 25: β_Lf = 1 − (350 − 240)/(200 × 16) = 0.965625 (0.75 ≤ β_Lf ≤ 1). Table 16 with the bolt's given capacity: 20/γ_M2 = 16 kN per plane, one plane: 8 × 16 × 0.965625 = 123.6 kN. Bearing (76) with e_1 = p_1 − d_0/2 = 41.25 mm (p_1 < e_1 + d_0/2 for the inner bolts, taken for all): 8 × 0.85 × 41.25/17.5 × 510 × 16 × 8 /1.25 = 837 kN; the net section (39) 0.9 × 510 × (1230 − 17.5 × 8)/1.25 = about 400 kN; 6.2.4.4 and the gross section above too: the bolt shear governs."
notes = "capacity: D1's tension capacity by the bundled SIA 263 plugin (kN), level 3 (its design data)."
max_seconds = 60.0
inputs.sections = '''
format = "ohl-sections"
version = 1
name = "Long joint angles (invented)"
default_material = "s355"
[[material]]
id = "s355"
name = "Steel (invented)"
elasticity = "210 GPa"
shear_modulus = "81 GPa"
density = "7850 kg/m3"
yield = "355 MPa"
ultimate = "510 MPa"
[[section]]
id = "L80x8"
shape = "equal_angle"
h = "80 mm"
t = "8 mm"
r = "9 mm"
'''
inputs.model = '''
format = "ohl-structure"
version = 31
id = "long-joint"
name = "Long joint (invented)"
kind = "lattice"
[analysis]
self_weight = false
capacity = "sia263-2013"
[[node]]
id = "N1"
point = ["0 m", "0 m", "0 m"]
support = "fixed"
[[node]]
id = "N2"
point = ["2 m", "0 m", "0 m"]
support = ["y", "z"]
[[member]]
id = "D1"
nodes = ["N1", "N2"]
section = "L80x8"
design = { class = "bracing", connected_leg = "long", end_distance = "30 mm", edge_distance = "40 mm", spacing = "50 mm", bolts = { diameter = "16 mm", hole = "17.5 mm", count = 8, holes = 1, shear_capacity = "20 kN" } }
[[load]]
node = "N2"
force = ["30 kN", "0 kN", "0 kN"]
'''
expected.capacity = { value = 123.6, abs_tol = 1e-6 }

[[case]]
id = "structsize-005"
title = "A second plate on the first plate's leg bolts: one bolt group through four plies, SIA 263 6.2.2.5 on the leg bolts"
calculation = "structure.shared_bolts"
reference = "By hand (O49 stage 1c, L33's room): G1 is held by L1's two 16 mm bolts onto it; G1b's own bolts are those bolts (their points written in D1's leg's frame from L1's), so they pass through L1's leg (8 mm), G1 (10 mm), the 8 mm packing and G1b (10 mm): shared = 1; their grip on the nut's side G1 and L1's leg, 10 + 8 = 18 mm; no clash more than without G1b. G1's holding group (its bolts onto L1) carries the same forces with and without G1b (G1 keeps D1's whole force: L33's split); with the 8 mm packing in their grip their SIA 263 shear resistance is β_p = 144/152 = 0.947368 of it (6.2.2.5), the bolt shear governing: the usage ratio 1/0.947368 = 1.055556."
notes = "shared: the joint details find G1b's own bolts to be the first plate's leg bolts (1); grip_nut_side (mm); clashes: at N2 with G1b less without; ratio: G1's holding group's usage with G1b over without (SIA 263 plugin, bolt shear governing)."
max_seconds = 180.0
