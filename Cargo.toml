[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/Gay-Lussac/OLS-CAD"
authors = ["OLS CAD contributors"]

[workspace.dependencies]
ols-core = { path = "crates/ols-core" }
ols-cables = { path = "crates/ols-cables" }
ols-sagtension = { path = "crates/ols-sagtension" }
ols-weather = { path = "crates/ols-weather" }
ols-wireloads = { path = "crates/ols-wireloads" }
ols-validation = { path = "crates/ols-validation" }
ols-plugins = { path = "crates/ols-plugins" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
