[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/Gay-Lussac/OLS-CAD"
authors = ["OLS CAD contributors"]

[workspace.dependencies]
ols-core = { path = "crates/ols-core" }
ols-cables = { path = "crates/ols-cables" }
ols-sagtension = { path = "crates/ols-sagtension" }
ols-weather = { path = "crates/ols-weather" }
ols-wireloads = { path = "crates/ols-wireloads" }
ols-wirefe = { path = "crates/ols-wirefe" }
ols-line = { path = "crates/ols-line" }
ols-structures = { path = "crates/ols-structures" }
ols-terrain = { path = "crates/ols-terrain" }
ols-clearance = { path = "crates/ols-clearance" }
ols-lidar = { path = "crates/ols-lidar" }
ols-pointcloud = { path = "crates/ols-pointcloud" }
ols-session = { path = "crates/ols-session" }
ols-drawing = { path = "crates/ols-drawing" }
ols-crs = { path = "crates/ols-crs" }
ols-io = { path = "crates/ols-io" }
ols-validation = { path = "crates/ols-validation" }
ols-plugins = { path = "crates/ols-plugins" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
criterion = "0.8"
nalgebra = "0.35"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
