[workspace]
resolver = "3"
members = ["crates/*", "apps/structure/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Gay-Lussac/OpenOHL"
authors = ["OpenOHL contributors"]

[workspace.dependencies]
ohl-core = { path = "crates/ohl-core" }
ohl-cables = { path = "crates/ohl-cables" }
ohl-sagtension = { path = "crates/ohl-sagtension" }
ohl-weather = { path = "crates/ohl-weather" }
ohl-wireloads = { path = "crates/ohl-wireloads" }
ohl-wirefe = { path = "crates/ohl-wirefe" }
ohl-line = { path = "crates/ohl-line" }
ohl-structures = { path = "crates/ohl-structures" }
ohl-structures-fe = { path = "crates/ohl-structures-fe" }
ohl-sections = { path = "crates/ohl-sections" }
ohl-terrain = { path = "crates/ohl-terrain" }
ohl-clearance = { path = "crates/ohl-clearance" }
ohl-lidar = { path = "crates/ohl-lidar" }
ohl-pointcloud = { path = "crates/ohl-pointcloud" }
ohl-background = { path = "crates/ohl-background" }
ohl-session = { path = "crates/ohl-session" }
ohl-drawing = { path = "crates/ohl-drawing" }
ohl-crs = { path = "crates/ohl-crs" }
ohl-io = { path = "crates/ohl-io" }
ohl-validation = { path = "crates/ohl-validation" }
ohl-plugins = { path = "crates/ohl-plugins" }
ohl-server = { path = "crates/ohl-server" }
ohl-loads = { path = "crates/ohl-loads" }
ohl-render = { path = "crates/ohl-render" }
ohl-thermal = { path = "crates/ohl-thermal" }
ohl-bom = { path = "crates/ohl-bom" }
ohl-spotting = { path = "crates/ohl-spotting" }
ohl-structure-loads = { path = "apps/structure/ohl-structure-loads" }
ohl-structure-link = { path = "apps/structure/ohl-structure-link" }
ohl-structure-edit = { path = "apps/structure/ohl-structure-edit" }
ohl-structure-export = { path = "apps/structure/ohl-structure-export" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
criterion = "0.8"
nalgebra = "0.35"
wgpu = "30"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "persistence"] }
egui_dock = "0.21"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Local timing runs (docs/development/performance.md, Build profiles):
# release optimisation, much faster to build (no LTO, parallel codegen);
# shipping builds stay `release`.
[profile.bench-fast]
inherits = "release"
lto = false
codegen-units = 16

# Development and test builds: line tables only (backtraces keep their
# lines; a smaller build folder, faster links; CARGO_PROFILE_DEV_DEBUG=true
# for a debugger session with variables).
[profile.dev]
debug = "line-tables-only"

# The dependencies optimised (the WebAssembly engine compiling plugins,
# rendering, SQLite run many times faster in the tests), without debug
# information; the workspace's own code as usual, with its debug
# assertions.
[profile.dev.package."*"]
opt-level = 2
debug = false
