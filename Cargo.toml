[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/Gay-Lussac/OLS-CAD"
authors = ["OLS CAD contributors"]

[workspace.dependencies]
ols-core = { path = "crates/ols-core" }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
