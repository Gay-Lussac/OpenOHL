<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d"><title id="t">A tree falling about its root ball</title><desc id="d">In the vertical plane through the tree's base B and the wire point q: the grown tree of height h' on a straight trunk, the hinge H at the root-ball radius from the trunk, the trunk's length L from the hinge, the sector it sweeps from its start angle down to its resting angle on the ground, and the distance from q to the swept trunk.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="420"/><text x="20.0" y="26.0" class="t">Fall-in: a tree pivoting about its root ball</text><path class="gnd" d="M30.0,340.0 L196.0,340.0 L740.0,397.2"/><path style="fill:var(--wire2);fill-opacity:.13;stroke:var(--wire2);stroke-width:1.2" d="M196.0,340.0 L426.2,364.2 L426.8,357.3 L427.2,350.4 L427.4,343.5 L427.4,336.6 L427.2,329.8 L426.8,322.9 L426.2,316.0 L425.4,309.1 L424.4,302.3 L423.2,295.5 L421.7,288.8 L420.1,282.1 L418.3,275.4 L416.3,268.8 L414.0,262.3 L411.6,255.8 L409.0,249.5 L406.2,243.2 L403.2,236.9 L400.1,230.8 L396.7,224.8 L393.2,218.8 L389.5,213.0 L385.7,207.3 L381.6,201.7 L377.4,196.2 L373.0,190.9 L368.5,185.7 L363.9,180.6 L359.0,175.7 L354.1,170.9 L348.9,166.3 L343.7,161.8 L338.3,157.5 L332.8,153.3 L327.2,149.3 L321.5,145.5 L315.6,141.8 L309.7,138.4 L303.6,135.1 L297.4,131.9 L291.2,129.0 L284.9,126.3 L278.5,123.7 L272.0,121.4 L265.4,119.2 L258.8,117.2 L252.2,115.5 L245.4,113.9 L238.7,112.5 L231.9,111.3 L225.1,110.4 L218.2,109.6 L211.3,109.0 L204.4,108.7 L197.5,108.5 L190.6,108.6 L183.7,108.9 L176.9,109.3 L170.0,110.0 Z"/><path style="stroke:var(--wire2);stroke-width:4" d="M170,340 L170,110.0"/><path style="stroke:var(--wire2);stroke-width:2;stroke-dasharray:6 4" d="M196.0,340 L426.2,364.2"/><circle cx="170.0" cy="340.0" r="4" style="fill:var(--ink);stroke:none"/><circle cx="196.0" cy="340.0" r="4" style="fill:var(--wire3);stroke:none"/><text x="162.0" y="358.0" class="e">B (base)</text><path class="ldr" d="M196.0,340.0 L226.0,376.0"/><text 