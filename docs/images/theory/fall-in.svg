" d="M457.8,186.5 L600.0,220.0"/><text x="604.0" y="224.0">d<tspan dy="4" style="font-size:78%">fall</tspan><tspan dx="1.5" dy="-4"> = |q − H| − L</tspan></text><text x="604.0" y="238.0" class="lab">(within the sector's angles)</text><text x="420.0" y="60.0" class="t">A danger tree when d<tspan dy="4" style="font-size:78%">fall</tspan><tspan dx="1.5" dy="-4"> − r &lt; A</tspan></text><text x="420.0" y="78.0" class="lab">(r: the conductor's radius and the polyline's bound;</text><text x="420.0" y="94.0" class="lab"> A: the clearance allowance)</text><text x="20.0" y="412.0" class="lab">x towards q, z up, from B. With k = 0 on level ground: a sphere of radius h′ about the base.</text></svg>
