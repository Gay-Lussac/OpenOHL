<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">A span at an angle to the wind</title><desc id="d">A span's chord with its unit tangent t; the wind blows towards w at the angle θ to the wire. Its part normal to the wire, w_n = w − (w·t) t, of length sin θ, gives the normal force: q·D·sin θ by the projected area (the default) or q·D·sin² θ by the cross-flow principle; the friction option adds c_t·q·D·cos² θ along the wire.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="360"/><text x="20.0" y="26.0" class="t">The span's share of a wind at an angle θ to it</text><path class="wire" d="M30.0,250.0 L400.0,250.0"/><circle cx="30.0" cy="250.0" r="4.5" style="fill:var(--wire);stroke:none"/><circle cx="400.0" cy="250.0" r="4.5" style="fill:var(--wire);stroke:none"/><text x="400.0" y="238.0" class="e lab">span chord, tangent t̂</text><path style="stroke:var(--ink);stroke-width:2.4;fill:none" d="M150.0,250.0 L275.3,162.2"/><path style="fill:var(--ink);stroke:none" d="M281.1,158.2 L270.5,160.5 L275.3,167.4 Z"/><text x="273.1" y="150.2" class="e">ŵ: where the wind blows (unit)</text><path style="stroke:var(--acc);stroke-width:2.0;fill:none" d="M150.0,252.0 L274.8,252.0"/><path style="fill:var(--acc);stroke:none" d="M281.1,252.0 L272.1,248.2 L272.1,255.8 Z"/><text x="215.5" y="272.0" class="c lab">(ŵ·t̂) t̂ = cos θ: along the wire</text><path style="stroke:var(--wire);stroke-width:2.2;fill:none" d="M281.1,250.0 L281.1,164.5"/><path style="fill:var(--wire);stroke:none" d="M281.1,158.2 L277.3,167.2 L284.8,167.2 Z"/><text x="289.1" y="204.1">ŵ<tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">: |ŵ</tspan><tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">| = sin θ</tspan></text><path class="acc" d="M192.6,220.2 L193.0,220.8 L193.5,221.5 L193.9,222.2 L194.3,222.8 L194.7,223.5 L195.1,224.2 L195.5,224.9 L195.9,225.6 L196.3,226.3 L196.6,227.0 L197.0,227.7 L197.3,228.4 L197.6,229.2 L198.0,229.9 L198.3,230.6 L198.5,231.4 L198.8,232.1 L199.1,232.9 L199.3,233.6 L199.6,234.4 L199.8,235.1 L200.0,235.9 L200.3,236.7 L200.5,237.4 L200.6,238.2 L200.8,239.0 L201.0,239.7 L201.1,240.5 L201.3,241.3 L201.4,242.1 L201.5,242.9 L201.6,243.7 L201.7,244.5 L201.8,245.2 L201.8,246.0 L201.9,246.8 L201.9,247.6 L202.0,248.4 L202.0,249.2 L202.0,250.0"/><text x="212.0" y="238.0" class="i">θ</text><text x="470.0" y="70.0">normal force per metre:</text><text x="470.0" y="92.0" class="lab">  projected area (default):  q·D·ŵ<tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">  (q·D·sin θ)</tspan></text><text x="470.0" y="114.0" class="lab">  cross-flow (option):  q·D·|ŵ<tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">|·ŵ</tspan><tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">  (q·D·sin² θ)</tspan></text><text x="470.0" y="136.0">friction (option, off by default):</text><text x="470.0" y="158.0" class="lab">  c<tspan dy="4" style="font-size:78%">t</tspan><tspan dx="1.5" dy="-4">·q·D·cos² θ along t̂, with the wind</tspan></text><text x="470.0" y="180.0">an inclined span: ŵ<tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4"> has a vertical part</tspan></text><text x="470.0" y="202.0" class="lab">  (down blowing uphill, up blowing downhill)</text><text x="20.0" y="340.0" class="lab">500 Pa on 30 mm, 300 m: across 4500 N; at 45° 3182 N (projected), 2250 N (cross-flow); along the wire 0 N (friction: c<tspan dy="4" style="font-size:78%">t</tspan><tspan dx="1.5" dy="-4">·4500 N)</tspan></text></svg>
