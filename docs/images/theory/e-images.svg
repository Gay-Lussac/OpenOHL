y="214.0" r="4" style="fill:var(--wire3);stroke:none"/><text x="478.0" y="206.0">p</text><path style="stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:5 4" d="M200.0,90.0 L458.9,208.7"/><path style="fill:var(--muted);stroke:none" d="M464.0,211.0 L455.3,210.7 L458.1,204.6 Z"/><path style="stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:5 4" d="M200.0,370.0 L459.2,219.8"/><path style="fill:var(--muted);stroke:none" d="M464.0,217.0 L458.8,223.9 L455.4,218.1 Z"/><text x="525.0" y="70.0">Potential coefficients (V·m/C):</text><text x="525.0" y="94.0">p<tspan dy="4" style="font-size:78%">ij</tspan><tspan dx="1.5" dy="-4"> = ln(D'</tspan><tspan dy="4" style="font-size:78%">ij</tspan><tspan dx="1.5" dy="-4"> / d</tspan><tspan dy="4" style="font-size:78%">ij</tspan><tspan dx="1.5" dy="-4">) / (2πε</tspan><tspan dy="4" style="font-size:78%">0</tspan><tspan dx="1.5" dy="-4">)</tspan></text><text x="525.0" y="116.0">p<tspan dy="4" style="font-size:78%">ii</tspan><tspan dx="1.5" dy="-4"> = ln(2h</tspan><tspan dy="4" style="font-size:78%">i</tspan><tspan dx="1.5" dy="-4"> / r</tspan><tspan dy="4" style="font-size:78%">i</tspan><tspan dx="1.5" dy="-4">) / (2πε</tspan><tspan dy="4" style="font-size:78%">0</tspan><tspan dx="1.5" dy="-4">)</tspan></text><text x="525.0" y="136.0" class="lab">r<tspan dy="4" style="font-size:78%">i</tspan><tspan dx="1.5" dy="-4">: the bundle's equivalent radius</tspan></text><text x="525.0" y="170.0">Voltages to earth V (rms phasors):</text><text x="525.0" y="192.0" class="lab">a phase: U / √3 at its phase angle</text><text x="525.0" y="210.0" class="lab">an earth wire, a 0 kV circuit: 0</text><text x="525.0" y="244.0">Charges per metre:</text><text x="525.0" y="268.0" class="t">q = P<tspan dy="-5" style="font-size:78%">−1</tspan><tspan dx="1.5" dy="5"> V</tspan></text><text x="525.0" y="290.0" class="lab">each frequency apart; a bundle's</text><text x="525.0" y="308.0" class="lab">charge shared by its subconductors</text><text x="20.0" y="412.0" class="lab">The field at p: every charge and every image, E = Σ q/(2πε<tspan dy="4" style="font-size:78%">0</tspan><tspan dx="1.5" dy="-4">) (r/r² − r'/r'²) in 2D; in 3D the pieces of charge in closed form.</tspan></text></svg>
