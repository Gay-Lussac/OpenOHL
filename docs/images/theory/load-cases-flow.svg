<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 660" width="910" height="660" role="img" aria-labelledby="t d"><title id="t">How load cases reach a structure</title><desc id="d">Left, OHL-Design: the weather cases feed the load case library; each structure takes its case set (its own, else its type's, else every case, or none); the wires are solved in each case and the forces at the attachment points go to the line's own check. Two arrows leave the line: the structure's library cases (with the library's factors) and, from Loads for structures, the weather cases ticked as unfactored line results. Right, OHL-Structure: line results feed the extra load cases; the library cases, the extra cases and the typed values all go into the load table, which is solved and checked.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="910" height="660"/><text x="20.0" y="26.0" class="t">How load cases reach a structure</text><text x="295.0" y="52.0" class="c t">OHL-Design — the line</text><text x="740.0" y="52.0" class="c t">OHL-Structure — one placed structure</text><path class="dash" d="M585,40 L585,600"/><rect x="20" y="66" width="270" height="62" rx="6" class="box" style="stroke:var(--muted);stroke-width:1"/><text x="155.0" y="86.0" class="c t">Weather cases (.ohlwc)</text><text x="155.0" y="104.0" class="c lab">wind, ice, temperature</text><text x="155.0" y="120.0" class="c lab">no factors</text><rect x="20" y="156" width="270" height="62" rx="6" class="box" style="stroke:var(--acc);stroke-width:1.6"/><text x="155.0" y="176.0" class="c t">Load case library (.ohllc)</text><text x="155.0" y="194.0" class="c lab">a weather case + the wires + factors</text><text x="155.0" y="210.0" class="c lab">+ broken, removed wires, ice, snow…</text><rect x="20" y="246" width="270" height="62" rx="6" class="box" style="stroke:var(--muted);stroke-width:1"/><text x="155.0" y="266.0" class="c t">① Case set of each structure</text><text x="155.0" y="284.0" class="c lab">its own ► its type's ► every case</text><text x="155.0" y="300.0" class="c lab">(or none: not checked)</text><rect x="20" y="336" width="270" height="62" rx="6" class="box" style="stroke:var(--muted);stroke-width:1"/><text x="155.0" y="356.0" class="c t">② Wires solved in each case</text><text x="155.0" y="374.0" class="c lab">the force at every attachment point</text><text x="155.0" y="390.0" class="c lab">of every structure taking the case</text><rect x="20" y="426" width="270" height="62" rx="6" class="box" style="stroke:var(--muted);stroke-width:1"/><text x="155.0" y="446.0" class="c t">③ The line's check</text><text x="155.0" y="464.0" class="c lab">Checks › Structure loads: spans,</text><text x="155.0" y="480.0" class="c lab">allowable loads, fe, pole → usage</text><rect x="310" y="156" width="260" height="62" rx="6" class="box" style="stroke:var(--wire);stroke-width:1.6"/><text x="440.0" y="176.0" class="c t">⑤ Loads for structures</text><text x="440.0" y="194.0" class="c lab">the weather cases ticked:</text><text x="440.0" y="210.0" class="c lab">unfactored, a wind case twice</text><path style="stroke:var(--muted);stroke-width:1.4;fill:none" d="M155.0,128.0 L155.0,148.4"/><path style="fill:var(--muted);stroke:none" d="M155.0,154.0 L158.4,146.0 L151.6,146.0 Z"/><path style="stroke:var(--muted);stroke-width:1.4;fill:none" d="M155.0,218.0 L155.0,238.4"/><path style="fill:var(--muted);stroke:none" d="M155.0,244.0 L158.4,236.0 L151.6,236.0 Z"/><path style="stroke:var(--muted);stroke-width:1.4;fill:none" d="M155.0,308.0 L155.0,328.4"/><path style="fill:var(--muted);stroke:none" d="M155.0,334.0 L158.4,326.0 L151.6,326.0 Z"/><path style="stroke:var(--muted);stroke-width:1.4;fill:none" d="M155.0,398.0 L155.0,418.4"/><path style="fill:var(--muted);stroke:none" d="M155.0,424.0 L158.4,416.0 L151.6,416.0 Z"/><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M290,97 L440,97 L440,150"/><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M440.0,140.0 L440.0,150.4"/><path style="fill:var(--wire);stroke:none" d="M440.0,156.0 L443.4,148.0 L436.6,148.0 Z"/><rect x="600" y="156" width="280" height="62" rx="6" class="box" style="stroke:var(--wire);stroke-width:1.6"/><text x="740.0" y="176.0" class="c t">Line results</text><text x="740.0" y="194.0" class="c lab">unfactored, to every structure:</text><text x="740.0" y="210.0" class="c lab">ingredients for extra cases</text><rect x="600" y="246" width="280" height="62" rx="6" class="box" style="stroke:var(--muted);stroke-width:1"/><text x="740.0" y="266.0" class="c t">Extra load cases (yours)</text><text x="740.0" y="284.0" class="c lab">1. line forces × your factors</text><text x="740.0" y="300.0" class="c lab">2. loads on the structure itself</text><rect x="600" y="336" width="280" height="62" rx="6" class="box" style="stroke:var(--acc);stroke-width:1.6"/><text x="740.0" y="356.0" class="c t">④ Library cases</text><text x="740.0" y="374.0" class="c lab">this structure's set, the library's</text><text x="740.0" y="390.0" class="c lab">factors (read-only here)</text><rect x="600" y="426" width="280" height="62" rx="6" class="box" style="stroke:var(--muted);stroke-width:1"/><text x="740.0" y="446.0" class="c t">Typed values</text><text x="740.0" y="464.0" class="c lab">numbers typed over the table,</text><text x="740.0" y="480.0" class="c lab">kept for this placed structure</text><rect x="600" y="530" width="280" height="62" rx="6" class="box" style="stroke:var(--wire2);stroke-width:1.6"/><text x="740.0" y="550.0" class="c t">⑥ Load table → structure check</text><text x="740.0" y="568.0" class="c lab">every case: finite elements,</text><text x="740.0" y="584.0" class="c lab">members, pole, joints</text><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M570.0,187.0 L594.4,187.0"/><path style="fill:var(--wire);stroke:none" d="M600.0,187.0 L592.0,183.6 L592.0,190.4 Z"/><path style="stroke:var(--muted);stroke-width:1.4;fill:none" d="M740.0,218.0 L740.0,240.4"/><path style="fill:var(--muted);stroke:none" d="M740.0,246.0 L743.4,238.0 L736.6,238.0 Z"/><path style="stroke:var(--acc);stroke-width:1.8;fill:none" d="M290.0,367.0 L594.4,367.0"/><path style="fill:var(--acc);stroke:none" d="M600.0,367.0 L592.0,363.6 L592.0,370.4 Z"/><text x="445.0" y="358.0" class="c sm">line-values file</text><text x="445.0" y="386.0" class="c sm">(Open in OHL-Structure…)</text><path class="thin" d="M880,277 L896,277 M880,367 L896,367 M880,457 L896,457 M896,277 L896,561"/><path style="stroke:var(--muted);stroke-width:1.4;fill:none" d="M896.0,561.0 L885.6,561.0"/><path style="fill:var(--muted);stroke:none" d="M880.0,561.0 L888.0,564.4 L888.0,557.6 Z"/><text x="20.0" y="622.0" class="lab">Factors: a library case takes the library's (② for the line, ④ in OHL-Structure: the same numbers). A line result has none (every factor 1);</text><text x="20.0" y="640.0" class="lab">an extra case gives its own. Typed values replace the computed value as typed. The two checks (③ and ⑥) are made apart.</text></svg>
