<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Cuts placed on the alignment</title><desc id="d">In plan, an alignment with an angle point and the line's wires along it: a cut at a station on a straight is perpendicular to the alignment; a cut at the angle point lies along the bisector, as a structure stands there; a profile is square to its span's axis.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="380"/><text x="20.0" y="26.0" class="t">Where a cut lies (plan)</text><path class="wire" d="M38.1,246.1 L396.7,196.3 L715.4,86.8"/><path class="wire2" d="M40.0,260.0 L400.0,210.0 L720.0,100.0"/><path class="wire" d="M41.9,273.9 L403.3,223.7 L724.6,113.2"/><path style="stroke:var(--ink);stroke-width:1.4;fill:none;stroke-dasharray:10 4 2 4" d="M40.0,260.0 L400.0,210.0 L720.0,100.0"/><text x="40.0" y="294.0" class="lab">alignment</text><circle cx="400.0" cy="210.0" r="5" style="fill:var(--bg);stroke:var(--ink);stroke-width:2"/><text x="410.0" y="262.0" class="lab">angle point</text><rect x="123.0" y="240.5" width="14" height="14" style="fill:var(--fill);stroke:var(--ink);stroke-width:1.6"/><rect x="393.0" y="203.0" width="14" height="14" style="fill:var(--fill);stroke:var(--ink);stroke-width:1.6"/><rect x="569.0" y="142.5" width="14" height="14" style="fill:var(--fill);stroke:var(--ink);stroke-width:1.6"/><path style="stroke:var(--acc);stroke-width:2.4;fill:none" d="M226.3,148.3 L249.7,316.7"/><text x="218.3" y="144.3" class="e">cut at a station:</text><text x="218.3" y="160.3" class="e lab">perpendicular to the alignment</text><path style="stroke:var(--wire3);stroke-width:2.4;fill:none" d="M377.9,117.6 L422.1,302.4"/><text x="387.9" y="109.6">cut at the angle point (within 1 cm):</text><text x="387.9" y="125.6" class="lab">along the bisector, as the structure stands</text><path style="stroke:var(--muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4" d="M633.2,55.8 L678.8,188.2"/><text x="688.8" y="206.2" class="e lab">profile: square to the span's axis</text><text x="20.0" y="330.0" class="lab">A place in a span (its middle, its lowest point, a distance) is first turned into the alignment station</text><text x="20.0" y="346.0" class="lab">of that place. The cross-section view opened at that station shows the same plane (one implementation).</text><text x="20.0" y="362.0" class="lab">Where the wires do not run square to the plane, it crosses them obliquely: the field is computed in it all the same (3D).</text></svg>
