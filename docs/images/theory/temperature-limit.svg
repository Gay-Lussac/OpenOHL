<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">The maximum operating temperature from clearance</title><desc id="d">The governing clearance falls as the conductor temperature rises. The search starts at the lowest temperature of the range, steps up by 10 degrees until a check fails, then bisects between the last pass and the first failure until they are 0.5 degrees apart; the limit is the last temperature that passed.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="400"/><text x="20.0" y="26.0" class="t">Maximum operating temperature from clearance: the search</text><path style="stroke:var(--muted);stroke-width:1.2;fill:none" d="M100.0,345.0 L714.4,345.0"/><path style="fill:var(--muted);stroke:none" d="M720.0,345.0 L712.0,341.6 L712.0,348.4 Z"/><path style="stroke:var(--muted);stroke-width:1.2;fill:none" d="M100.0,345.0 L100.0,55.6"/><path style="fill:var(--muted);stroke:none" d="M100.0,50.0 L96.6,58.0 L103.4,58.0 Z"/><text x="720.0" y="379.0" class="e lab">conductor temperature</text><text x="108.0" y="56.0" class="lab">governing clearance (falls as the sag grows)</text><text x="100.0" y="363.0" class="c lab">range start</text><text x="700.0" y="363.0" class="c lab">range end</text><path class="thin" d="M700.0,341 L700.0,349"/><path class="acc ds" d="M100,207.3 L700,207.3"/><text x="700.0" y="199.3" class="e">required clearance</text><path class="wire" d="M100.0,90.0 L112.0,93.0 L124.0,96.1 L136.0,99.3 L148.0,102.6 L160.0,105.9 L172.0,109.3 L184.0,112.8 L196.0,116.3 L208.0,119.9 L220.0,123.6 L232.0,127.4 L244.0,131.2 L256.0,135.1 L268.0,139.1 L280.0,143.1 L292.0,147.2 L304.0,151.4 L316.0,155.7 L328.0,160.0 L340.0,164.4 L352.0,168.9 L364.0,173.4 L376.0,178.0 L388.0,182.7 L400.0,187.5 L412.0,192.3 L424.0,197.2 L436.0,202.2 L448.0,207.3 L460.0,212.4 L472.0,217.6 L484.0,222.9 L496.0,228.2 L508.0,233.6 L520.0,239.1 L532.0,244.7 L544.0,250.3 L556.0,256.0 L568.0,261.8 L580.0,267.6 L592.0,273.5 L604.0,279.5 L616.0,285.6 L628.0,291.7 L640.0,297.9 L652.0,304.2 L664.0,310.5 L676.0,316.9 L688.0,323.4 L700.0,330.0"/><circle cx="100.0" cy="90.0" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="140.0" cy="100.4" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="180.0" cy="111.6" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="220.0" cy="123.6" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="260.0" cy="136.4" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="300.0" cy="150.0" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="340.0" cy="164.4" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="380.0" cy="179.6" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="420.0" cy="195.6" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="460.0" cy="212.4" r="5" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><path class="ldr" d="M103.0,94.0 L124.0,192.0"/><text x="128.0" y="196.0">1: the lowest temperature of the range</text><path class="ldr" d="M260.0,136.4 L300.0,96.4"/><text x="304.0" y="100.4">2: up in steps of 10 °C ...</text><path class="ldr" d="M464.0,216.4 L500.0,262.4"/><text x="504.0" y="266.4">... until a check fails</text><rect class="box" x="134" y="242" width="332" height="86" rx="6"/><text x="144.0" y="260.0" class="lab">3: bisection between the last pass and the first</text><text x="144.0" y="275.0" class="lab">failure, until they are 0.5 °C apart</text><path class="thin" d="M150,300 L450,300"/><circle cx="150.0" cy="300.0" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="450.0" cy="300" r="5" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><circle cx="300.0" cy="300.0" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="375.0" cy="300" r="5" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><circle cx="337.5" cy="300.0" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="356.2" cy="300.0" r="4.5" style="fill:var(--wire2);stroke:none"/><circle cx="365.6" cy="300" r="5" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><text x="150.0" y="320.0" class="c lab">pass</text><text x="450.0" y="320.0" class="c lab">fails</text><path style="stroke:var(--ink);stroke-width:1.3;fill:none" d="M326.2,284.0 L348.4,294.2"/><path style="fill:var(--ink);stroke:none" d="M352.2,296.0 L347.9,291.2 L345.7,295.8 Z"/><text x="322.2" y="293.0" class="e sm">limit: the last that passed</text><path class="thin dt" d="M420.0,201.6 L150,242"/><path class="thin dt" d="M460.0,218.4 L450,242"/><text x="20.0" y="392.0" class="lab">Conservative: the limit lies up to 0.5 °C below the exact one.</text></svg>
