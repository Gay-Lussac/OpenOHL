<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">A long volume in parts</title><desc id="d">Along a long run: the volume's lattice computed part after part, two parts sharing the plane where they meet; in the electric field, a run too large for one floor has a floor per part, each over the ground within the margin m of its part (an angle's other leg included); each point takes its part's floor.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="330"/><text x="20.0" y="26.0" class="t">A long volume: computed in parts, each with its own floor (electric)</text><rect x="60" y="120" width="170" height="100" class="band"/><text x="145.0" y="138.0" class="c sm">part 1</text><rect x="230" y="120" width="170" height="100" class="band"/><text x="315.0" y="138.0" class="c sm">part 2</text><rect x="400" y="120" width="170" height="100" class="band"/><text x="485.0" y="138.0" class="c sm">part 3</text><rect x="570" y="120" width="150" height="100" class="band"/><text x="645.0" y="138.0" class="c sm">part 4</text><path class="acc" d="M230,110 L230,230"/><path class="acc" d="M400,110 L400,230"/><path class="acc" d="M570,110 L570,230"/><text x="234.0" y="244.0" class="sm">shared plane</text><path class="wire" d="M40,170.0 L740,170.0"/><rect x="180" y="70" width="270" height="200" rx="40" class="fa"/><text x="186.0" y="84.0" class="sm">part 2's floor: the ground within m</text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M404.9,100.0 L445.1,100.0"/><path style="fill:var(--muted);stroke:none" d="M450.0,100.0 L443.0,97.1 L443.0,102.9 Z"/><path style="fill:var(--muted);stroke:none" d="M400.0,100.0 L407.0,102.9 L407.0,97.1 Z"/><text x="425.0" y="94.0" class="c">m</text><text x="20.0" y="300.0" class="lab">Memory: a part's lattice at most some 20 M points (160 MB); a part's floor a few thousand tiles (tens of MB) instead of one floor's gigabytes.</text><text x="20.0" y="318.0" class="lab">The same surfaces as one piece (tested); the floors as close to the exact field as one floor (measured).</text></svg>
