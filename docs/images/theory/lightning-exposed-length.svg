<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d"><title id="t">Length exposed</title><desc id="d">A span seen from the side with cross-sections at the middle of each step; the phase is exposed at three of them, each standing for its step: the length exposed is three steps; the deepest one is where it is worst.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="350"/><text x="20" y="26" class="t">The length exposed: each cross-section stands for its step</text><rect x="84" y="60" width="12" height="200" class="box"/><rect x="664" y="60" width="12" height="200" class="box"/><path class="gnd" d="M30,262 L730,262"/><polyline points="90,70.0 100,72.7 110,75.3 120,77.8 130,80.3 140,82.6 150,84.8 160,87.0 170,89.0 180,91.0 190,92.8 200,94.6 210,96.3 220,97.8 230,99.3 240,100.7 250,102.0 260,103.2 270,104.2 280,105.2 290,106.1 300,107.0 310,107.7 320,108.3 330,108.8 340,109.2 350,109.6 360,109.8 370,110.0 380,110.0 390,110.0 400,109.8 410,109.6 420,109.2 430,108.8 440,108.3 450,107.7 460,107.0 470,106.1 480,105.2 490,104.2 500,103.2 510,102.0 520,100.7 530,99.3 540,97.8 550,96.3 560,94.6 570,92.8 580,91.0 590,89.0 600,87.0 610,84.8 620,82.6 630,80.3 640,77.8 650,75.3 660,72.7 670,70.0" class="wire2"/><polyline points="90,110.0 100,114.7 110,119.3 120,123.7 130,128.0 140,132.1 150,136.0 160,139.7 170,143.3 180,146.7 190,150.0 200,153.0 210,155.9 220,158.7 230,161.3 240,163.7 250,165.9 260,168.0 270,169.9 280,171.7 290,173.3 300,174.7 310,175.9 320,177.0 330,177.9 340,178.7 350,179.3 360,179.7 370,179.9 380,180.0 390,179.9 400,179.7 410,179.3 420,178.7 430,177.9 440,177.0 450,175.9 460,174.7 470,173.3 480,171.7 490,169.9 500,168.0 510,165.9 520,163.7 530,161.3 540,158.7 550,155.9 560,153.0 570,150.0 580,146.7 590,143.3 600,139.7 610,136.0 620,132.1 630,128.0 640,123.7 650,119.3 660,114.7 670,110.0" class="wire"/><text x="380" y="98" class="c lab">shielding wire</text><text x="380" y="198" class="c lab">phase</text><path class="thin ds" d="M126.2,62 L126.2,25