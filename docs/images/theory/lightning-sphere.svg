<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" role="img" aria-labelledby="t d"><title id="t">Rolling sphere</title><desc id="d">A shielding wire and a phase over the ground; the circle of radius r around the wire where no centre may lie; the sphere resting on the ground and touching the wire reaches the phase, which is exposed.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="385"/><text x="20" y="26" class="t">Rolling sphere: the free region and the phase it reaches</text><path class="gnd" d="M30,330 L730,330"/><path class="thin ds" d="M30,210.0 L730,210.0"/><text x="725" y="204.0" class="e lab">centres at β·r above the ground</text><circle cx="200" cy="186.0" r="120.0" class="fi"/><circle cx="200" cy="186.0" r="120.0" class="dash"/><text x="88.0" y="292.0" class="lab">no centre within r of the wire</text><circle cx="317.6" cy="210.0" r="120.0" class="fa"/><circle cx="317.6" cy="210.0" r="120.0" class="acc"/><circle cx="317.6" cy="210.0" r="3.5" class="dot"/><path class="acc" d="M317.6,210.0 L435.2,210.0"/><path style="fill:var(--acc);stroke:none" d="M435.2,210.0 L427.8,213.1 L427.8,206.9 Z"/><text x="377.6" y="204.0" class="c">r</text><circle class="dot" cx="200" cy="186.0" r="5"/><text x="190" y="176.0" class="e">shielding wire</text><circle cx="251.6" cy="156.0" r="7" style="fill:var(--wire);stroke:none"/><path class="ldr" d="M259.6,150.0 L467.6,156.0"/><text x="471.6" y="156.0">phase within r of a free centre:</text><text x="471.6" y="173.0">exposed</text><text x="471.6" y="250.0" class="lab">a sphere resting on the ground</text><text x="471.6" y="266.0" class="lab">and touching the wire</text><text x="20" y="358" class="lab">Free centres: at least r from every shielding wire and β·r from the ground. The phase is exposed while the nearest</text><text x="20" y="375" class="lab">free centre lies within r of its surface; r_max is the largest r for which it does (stronger strokes no longer reach it).</text></svg>