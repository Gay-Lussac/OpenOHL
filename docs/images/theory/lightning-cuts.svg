<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d"><title id="t">Cross-sections along a span</title><desc id="d">A span between two structures in plan, divided into equal steps; a cross-section square to the span at the middle of each step.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="290"/><text x="20" y="26" class="t">Cross-sections square to the span (plan), at the middle of each step</text><rect x="81" y="141" width="18" height="18" class="box"/><rect x="661" y="141" width="18" height="18" class="box"/><text x="90" y="184" class="c">structure</text><text x="670" y="184" class="c">structure</text><path class="wire2" d="M90,136 L670,136"/><path class="wire" d="M90,150 L670,150"/><path class="wire3" d="M90,164 L670,164"/><path class="thin" d="M90.0,172 L90.0,180"/><path class="thin" d="M162.5,172 L162.5,180"/><path class="thin" d="M235.0,172 L235.0,180"/><path class="thin" d="M307.5,172 L307.5,180"/><path class="thin" d="M380.0,172 L380.0,180"/><path class="thin" d="M452.5,172 L452.5,180"/><path class="thin" d="M525.0,172 L525.0,180"/><path class="thin" d="M597.5,172 L597.5,180"/><path class="thin" d="M670.0,172 L670.0,180"/><path class="acc" d="M126.2,95 L126.2,205"/><path class="acc" d="M198.8,95 L198.8,205"/><path class="acc" d="M271.2,95 L271.2,205"/><path class="acc" d="M343.8,95 L343.8,205"/><path class="acc" d="M416.2,95 L416.2,205"/><path class="acc" d="M488.8,95 L488.8,205"/><path class="acc" d="M561.2,95 L561.2,205"/><path class="acc" d="M633.8,95 L633.8,205"/><text x="126.2" y="88" class="c sm">cut 1</text><text x="633.8" y="88" class="c sm">cut n</text><text x="380.0" y="228" class="c lab">n = ⌈span length / step⌉ equal steps; each cut stands for its step</text><text x="20" y="262" class="lab">The wires are taken where they cross each cut, as solved in the weather case; a wire still on its strings there</text><text x="20" y="279" class="lab">is left out of that cut (said). The first and last cuts stand for the ends up to the structures.</text></svg>