<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Wires, images and bundles</title><desc id="d">Left: a span's cross-section with two wires i and j at their offsets and heights h_i, h_j above the ground, the image j′ of wire j as far below the ground surface as j is above it, the distance d_ij between the wires and D′_ij from i to the image; dashed, the plane at the complex depth p of the complex-depth method. Right: a bundle of four subconductors on a circle of radius R, spacing s, replaced by one equivalent wire at its centre.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="900" height="470"/><text x="20.0" y="26.0" class="t">A span's cross-section (looking along the line)</text><path class="gnd" d="M40,250 L560,250"/><text x="548.0" y="244.0" class="e lab">ground</text><circle cx="180.0" cy="90.0" r="7" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><circle cx="420.0" cy="150.0" r="7" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><text x="168.0" y="80.0" class="e i">i</text><text x="432.0" y="140.0" class="i">j</text><circle cx="420" cy="350" r="7" style="fill:none;stroke:var(--wire);stroke-width:1.6;stroke-dasharray:3 3"/><text x="432.0" y="354.0" class="i">j′ (image)</text><path class="acc" d="M180,90 L420,150"/><text x="300.0" y="110.0" class="c">d<tspan dy="4" style="font-size:78%">ij</tspan></text><path class="acc ds" d="M180,90 L420,350"/><text x="284.0" y="224.0" class="e">D′<tspan dy="4" style="font-size:78%">ij</tspan></text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M140.0,245.1 L140.0,94.9"/><path style="fill:var(--muted);stroke:none" d="M140.0,90.0 L137.1,97.0 L142.9,97.0 Z"/><path style="fill:var(--muted);stroke:none" d="M140.0,250.0 L142.9,243.0 L137.1,243.0 Z"/><text x="133.0" y="174.0" class="e">h<tspan dy="4" style="font-size:78%">i</tspan></text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M470.0,245.1 L470.0,154.9"/><path style="fill:var(--muted);stroke:none" d="M470.0,150.0 L467.1,157.0 L472.9,157.0 Z"/><path style="fill:var(--muted);stroke:none" d="M470.0,250.0 L472.9,243.0 L467.1,243.0 Z"/><text x="477.0" y="204.0">h<tspan dy="4" style="font-size:78%">j</tspan></text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M470.0,254.9 L470.0,345.1"/><path style="fill:var(--muted);stroke:none" d="M470.0,350.0 L472.9,343.0 L467.1,343.0 Z"/><path style="fill:var(--muted);stroke:none" d="M470.0,250.0 L467.1,257.0 L472.9,257.0 Z"/><text x="477.0" y="304.0">h<tspan dy="4" style="font-size:78%">j</tspan></text><path class="thin ds" d="M40,410 L560,410"/><text x="548.0" y="404.0" class="e lab">complex depth p (complex-depth method)</text><text x="640.0" y="26.0" class="t">A bundle of n = 4</text><circle cx="750" cy="170" r="60" class="thin" style="stroke-dasharray:4 3"/><circle cx="792.4" cy="212.4" r="6" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><circle cx="707.6" cy="212.4" r="6" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><circle cx="707.6" cy="127.6" r="6" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><circle cx="792.4" cy="127.6" r="6" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><path class="thin" d="M707.5735931288071,113.57359312880715 L792.4264068711929,113.57359312880715"/><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M712.5,105.6 L787.5,105.6"/><path style="fill:var(--muted);stroke:none" d="M792.4,105.6 L785.4,102.6 L785.4,108.5 Z"/><path style="fill:var(--muted);stroke:none" d="M707.6,105.6 L714.6,108.5 L714.6,102.6 Z"/><text x="750.0" y="99.6" class="c">s</text><path class="inkl" d="M750,170 L792.4264068711929,212.42640687119285"/><text x="780.0" y="184.0" class="i">R</text><circle cx="750.0" cy="170.0" r="4" style="fill:var(--acc);stroke:none"/><text x="750.0" y="270.0" class="c">R = s / (2 sin(π/n))</text><text x="750.0" y="290.0" class="c lab">one equivalent wire at the centre:</text><text x="750.0" y="308.0" class="c">GMR<tspan dy="4" style="font-size:78%">eq</tspan><tspan dx="1.5" dy="-4"> = (n GMR R</tspan><tspan dy="-6" style="font-size:78%">n−1</tspan><tspan dx="1.5" dy="6">)</tspan><tspan dy="-6" style="font-size:78%">1/n</tspan></text></svg>
