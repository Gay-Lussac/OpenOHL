<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Vertical and radial</title><desc id="d">Left, across the line: a vertical rule checks the targets within the zone's half width w of the wire in plan and measures straight up to the wire; a target farther out is left out, though a radial rule measures to it. Right, along the line: over the slice of depth d the wire rising by m per metre is taken m d/2 lower.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="380"/><text x="20.0" y="26.0" class="t">Vertical and radial (left: across the line; right: along it)</text><path class="gnd" d="M30,340 L380,340"/><rect x="110" y="100" width="160" height="240" class="fa"/><path class="acc ds" d="M110,100 L110,340 M270,100 L270,340"/><circle cx="190" cy="90" r="8" class="wire" style="stroke-width:3;fill:var(--bg)"/><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M194.9,120.0 L265.1,120.0"/><path style="fill:var(--muted);stroke:none" d="M270.0,120.0 L263.0,117.1 L263.0,122.9 Z"/><path style="fill:var(--muted);stroke:none" d="M190.0,120.0 L197.0,122.9 L197.0,117.1 Z"/><text x="230.0" y="114.0" class="c">w</text><path style="stroke:var(--ink);stroke-width:2" d="M262.0,300 L262.0,90"/><path class="thin dt" d="M198,90 L268.0,90"/><circle cx="262.0" cy="300.0" r="4.5" style="fill:var(--ink);stroke:none"/><circle cx="278.0" cy="210" r="4.5" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.6"/><path style="stroke:var(--wire3);stroke-width:1.8;stroke-dasharray:6 4" d="M195.3,97.3 L278.0,210.0"/><path class="ldr" d="M262.0,300.0 L300.0,300.0"/><text x="304.0" y="304.0">0.9 m beside:</text><text x="304.0" y="316.0">checked, drawn vertical</text><path class="ldr" d="M278.0,210.0 L300.0,196.0"/><text x="304.0" y="200.0">1.1 m beside:</text><text x="304.0" y="212.0">left out of the vertical</text><text x="304.0" y="228.0" class="lab">(a radial rule: the shortest</text><text x="304.0" y="244.0" class="lab">3D distance)</text><text x="30.0" y="