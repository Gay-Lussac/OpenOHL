<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d"><title id="t">Ground filter and height classes</title><desc id="d">Left: the lowest point of each grid cell, the surface opened with a window wider than a building, and the cells standing above it by more than the threshold holding no ground. Right: the classes by height above the ground's TIN.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="420"/><text x="20.0" y="26.0" class="t">Classification: ground, then heights above it</text><path class="gnd" d="M30.0,300.0 L350.0,261.6"/><rect x="150" y="215.6" width="70" height="70" class="box"/><text x="185.0" y="207.6" class="c lab">building</text><path class="thin" d="M30,306.0 L30,322.0"/><circle cx="40.0" cy="296.8" r="3.5" style="fill:var(--wire2);stroke:none"/><path class="thin" d="M50,303.6 L50,319.6"/><circle cx="60.0" cy="294.4" r="3.5" style="fill:var(--wire2);stroke:none"/><path class="thin" d="M70,301.2 L70,317.2"/><circle cx="80.0" cy="292.0" r="3.5" style="fill:var(--wire2);stroke:none"/><path class="thin" d="M90,298.8 L90,314.8"/><circle cx="100.0" cy="289.6" r="3.5" style="fill:var(--wire2);stroke:none"/><path class="thin" d="M110,296.4 L110,312.4"/><circle cx="120.0" cy="287.2" r="3.5" style="fill:var(--wire2);stroke:none"/><path class="thin" d="M130,294.0 L130,310.0"/><circle cx="140.0" cy="284.8" r="3.5" style="fill:var(--wire2);stroke:none"/><path class="thin" d="M150,291.6 L150,307.6"/><circle cx="160" cy="215.6" r="4" style="fill:var(--bg);stroke:var(--wire);stroke-width:2"/><path class="thin" d="M170,289.2 L170,305.2"/><circle cx="180" cy="215.6" r="4" style="fill:var(--bg);stroke:var(--wire);stroke-width:2"/><path class="thin" d="M190,286.8 L190,302.8"/><circle cx="200" cy="215.6" r="4" style="fill:var(--bg);stroke:var(--wire);stroke-width:2"/><path class="thin" d="M210,284.4 L210,300.4"/><circle cx="220" cy="215.6" r="4" style="fill:var(--bg);stroke:var(--wire);stroke-width:2"/><path class="thin" d="M230,282.0 L230,298.0"/><circl