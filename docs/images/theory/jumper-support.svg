<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">Support clamps on a jumper</title><desc id="d">Left: a jumper passing through a support clamp, one straight piece of the clamp's length, held at its middle by a string from its top. Right: across the line, a clamp on two strings in wind; the leg on the lee side goes slack.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="360"/><text x="20.0" y="26.0" class="t">Support clamps: a rigid piece held at its middle</text><path class="wire" d="M60.0,110.0 C120.0,230.0 153.0,197.0 223.0,187.0"/><path class="wire" d="M257.0,183.0 C327.0,177.0 370.0,230.0 420.0,110.0"/><path style="stroke:var(--ink);stroke-width:7;stroke-linecap:butt" d="M223.0,187.0 L257.0,183.0"/><path class="str" d="M240.0,70.0 L240.0,185.0"/><circle class="ap" cx="240.0" cy="70.0" r="4.5"/><circle cx="240.0" cy="185.0" r="3" style="fill:var(--acc);stroke:none"/><circle class="wp" cx="60.0" cy="110.0" r="5"/><circle class="wp" cx="420.0" cy="110.0" r="5"/><text x="52.0" y="102.0">A</text><text x="412.0" y="102.0" class="e">B</text><path class="ldr" d="M240.0,70.0 L280.0,52.0"/><text x="284.0" y="56.0">string's top (attachment point)</text><path class="ldr" d="M246.0,184.0 L290.0,240.0"/><text x="294.0" y="244.0">p: the clamp's middle,</text><text x="294.0" y="256.0">where the string holds</text><path class="ldr" d="M227.0,187.0 L200.0,250.0"/><text x="196.0" y="254.0" class="e">clamp: one straight piece</text><text x="196.0" y="266.0" class="e lab">(clamp_length, default 0.1 m)</text><text x="20.0" y="330.0" class="lab">The wire runs straight through the clamp: it leaves in the direction it enters.</text><path class="st" d="M520,80 L680,80"/><path class="str" d="M540,80.0 L640,170.0"/><path class="acc ds" d="M660,80.0 Q678,125.0 640,170.0"/><circle class="ap" cx="540" cy="80.0" r="4.5"/><circle class="ap" cx="660" cy="80.0" r="4.5"/><circle cx="640" cy="170.0" r="8" class="wire" style="stroke-width:3"/><path style="stroke:var(--acc);stroke-width:1.6;fill:none" d="M460.0,150.0 L505.1,150.0"/><path style="fill:var(--acc);stroke:none" d="M510.0,150.0 L503.0,147.1 L503.0,152.9 Z"/><path style="stroke:var(--acc);stroke-width:1.6;fill:none" d="M460.0,168.0 L505.1,168.0"/><path style="fill:var(--acc);stroke:none" d="M510.0,168.0 L503.0,165.1 L503.0,170.9 Z"/><path style="stroke:var(--acc);stroke-width:1.6;fill:none" d="M460.0,186.0 L505.1,186.0"/><path style="fill:var(--acc);stroke:none" d="M510.0,186.0 L503.0,183.1 L503.0,188.9 Z"/><text x="460.0" y="138.0" class="lab">wind</text><path class="ldr" d="M570.0,115.0 L560.0,235.0"/><text x="564.0" y="239.0">taut (windward)</text><path class="ldr" d="M672.0,120.0 L690.0,268.0"/><text x="686.0" y="272.0" class="e">slack (lee side)</text><text x="600.0" y="300.0" class="c lab">across the line</text></svg>
