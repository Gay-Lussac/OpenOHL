<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d"><title id="t">A pole's buckling length</title><desc id="d">A tapered wood pole fixed at the ground line, free at its top, height H above the ground: it buckles as half of a pin-ended column twice as long, so its buckling length is L_K = 2H; the slenderness takes the radius of gyration i = D/4 of the diameter D at mid-height.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="430"/><text x="20.0" y="26.0" class="t">A cantilever pole: L<tspan dy="4" style="font-size:78%">K</tspan><tspan dx="1.5" dy="-4"> = 2H</tspan></text><path class="box" d="M185.0,380 L192.0,90 L208.0,90 L215.0,380 Z"/><path class="gnd" d="M80,380 L360,380"/><rect x="140" y="380" width="120" height="30" class="fi"/><text x="266.0" y="402.0" class="lab">fixed at the ground line</text><path class="acc" d="M200.0,380.0 L200.0,374.0 L200.1,368.0 L200.3,362.0 L200.5,356.0 L200.8,350.0 L201.1,344.0 L201.5,338.0 L202.0,332.0 L202.5,326.0 L203.1,320.0 L203.8,314.0 L204.5,308.0 L205.3,302.0 L206.1,296.0 L207.0,290.0 L207.9,284.0 L208.9,278.0 L210.0,272.0 L211.1,266.0 L212.2,260.0 L213.4,254.0 L214.7,248.0 L216.0,242.0 L217.3,236.0 L218.7,230.0 L220.2,224.0 L221.7,218.0 L223.2,212.0 L224.7,206.0 L226.3,200.0 L228.0,194.0 L229.6,188.0 L231.3,182.0 L233.1,176.0 L234.8,170.0 L236.6,164.0 L238.4,158.0 L240.2,152.0 L242.1,146.0 L243.9,140.0 L245.8,134.0 L247.7,128.0 L249.7,122.0 L251.6,116.0 L253.5,110.0 L255.5,104.0 L257.4,98.0 L259.4,92.0"/><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M130.0,375.1 L130.0,94.9"/><path style="fill:var(--muted);stroke:none" d="M130.0,90.0 L127.1,97.0 L132.9,97.0 Z"/><path style="fill:var(--muted);stroke:none" d="M130.0,380.0 L132.9,373.0 L127.1,373.0 Z"/><text x="123.0" y="239.0" class="e">H</text><path class="thin dt" d="M150,235.0 L250,235.0"/><text x="122.0" y="229.0" class="e lab">mid-height: D, i = D/4</text><text x="420.0" y="120.0">Fixed at the foot, free at the top:</text><text x="420.0" 