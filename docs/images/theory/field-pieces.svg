<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">The wire as straight pieces</title><desc id="d">Left: a sagging wire and the chords between the solver's points; the most a chord lies off the wire is the sagitta e = L squared over 8 R, with R = H over w the catenary's smallest radius of curvature. Right: one piece cut into three, the new points on the curve through the piece's ends and a neighbouring point; at a kink the two neighbours' curves differ and the piece is cut on its chord.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="400"/><text x="20.0" y="26.0" class="t">The wire as straight pieces (exaggerated)</text><path style="stroke:var(--wire);stroke-width:2.2;fill:none;opacity:.55" d="M40.0,110.0 L44.2,117.4 L48.5,124.6 L52.8,131.7 L57.0,138.5 L61.2,145.2 L65.5,151.6 L69.8,157.9 L74.0,164.0 L78.2,169.9 L82.5,175.6 L86.8,181.2 L91.0,186.5 L95.2,191.7 L99.5,196.6 L103.8,201.4 L108.0,206.0 L112.2,210.4 L116.5,214.6 L120.8,218.7 L125.0,222.5 L129.2,226.2 L133.5,229.6 L137.8,232.9 L142.0,236.0 L146.2,238.9 L150.5,241.6 L154.8,244.2 L159.0,246.5 L163.2,248.7 L167.5,250.6 L171.8,252.4 L176.0,254.0 L180.2,255.4 L184.5,256.6 L188.8,257.7 L193.0,258.5 L197.2,259.2 L201.5,259.6 L205.8,259.9 L210.0,260.0 L214.2,259.9 L218.5,259.6 L222.8,259.2 L227.0,258.5 L231.2,257.7 L235.5,256.6 L239.8,255.4 L244.0,254.0 L248.2,252.4 L252.5,250.6 L256.8,248.7 L261.0,246.5 L265.2,244.2 L269.5,241.6 L273.8,238.9 L278.0,236.0 L282.2,232.9 L286.5,229.6 L290.8,226.2 L295.0,222.5 L299.2,218.7 L303.5,214.6 L307.8,210.4 L312.0,206.0 L316.2,201.4 L320.5,196.6 L324.8,191.7 L329.0,186.5 L333.2,181.2 L337.5,175.6 L341.8,169.9 L346.0,164.0 L350.2,157.9 L354.5,151.6 L358.8,145.2 L363.0,138.5 L367.2,131.7 L371.5,124.6 L375.8,117.4 L380.0,110.0"/><path class="inkl" d="M40.0,110.0 L96.7,193.3 L153.3,243.3 L210.0,260.0 L266.7,243.3 L323.3,193.3 L380.0,110.0"/><circle cx="40.0" cy="110.0" r="3.2" style="fill:var(--ink);stroke:none"/><circle cx="96.7" cy="193.3" r="3.2" 