,246.9 L634.4,243.6 L639.4,239.8 L644.6,235.8 L649.8,231.4 L655.1,226.7 L660.3,221.9 L665.5,217.0 L670.6,212.0 L675.6,207.0 L680.5,202.1 L685.2,197.3 L689.6,192.6 L693.8,188.2 L697.8,184.2 L701.4,180.4 L704.6,177.1 L707.5,174.3 L710.0,172.0"/><path class="inkl" d="M440.0,172.0 L530.0,252.0 L620.0,252.0 L710.0,172.0"/><circle cx="440.0" cy="172.0" r="3.4" style="fill:var(--ink);stroke:none"/><circle cx="530.0" cy="252.0" r="3.4" style="fill:var(--ink);stroke:none"/><circle cx="620.0" cy="252.0" r="3.4" style="fill:var(--ink);stroke:none"/><circle cx="710.0" cy="172.0" r="3.4" style="fill:var(--ink);stroke:none"/><circle cx="557.0" cy="260.4" r="4" style="fill:var(--bg);stroke:var(--acc);stroke-width:2"/><circle cx="588.5" cy="261.1" r="4" style="fill:var(--bg);stroke:var(--acc);stroke-width:2"/><text x="524.0" y="274.0" class="c lab">k</text><text x="626.0" y="274.0" class="c lab">k + 1</text><text x="440.0" y="160.0" class="c lab">k − 1</text><text x="710.0" y="160.0" class="c lab">k + 2</text><circle cx="440.0" cy="306.0" r="4" style="fill:var(--bg);stroke:var(--acc);stroke-width:2"/><text x="452.0" y="310.0" class="lab">new point on the curve</text><text x="430.0" y="336.0" class="lab">At a kink (a spacer, a clamp, a span point) the two</text><text x="430.0" y="352.0" class="lab">neighbours' curves disagree by more than the solver's</text><text x="430.0" y="368.0" class="lab">bound: the piece is cut on its chord, no worse.</text></svg>
