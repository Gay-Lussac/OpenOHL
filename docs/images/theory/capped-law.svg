<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">A tension-only member: the capped law</title><desc id="d">Axial force N against the stretch: active, the member follows EA/L in tension and in compression down to its buckling load; shortened further it is bowed and carries N_cr; without a second moment it is slack in compression.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="360"/><text x="20.0" y="26.0" class="t">A tension-only member: compression up to its buckling load</text><path style="stroke:var(--muted);stroke-width:1.2;fill:none" d="M110.0,175.0 L694.4,175.0"/><path style="fill:var(--muted);stroke:none" d="M700.0,175.0 L692.0,171.6 L692.0,178.4 Z"/><path style="stroke:var(--muted);stroke-width:1.2;fill:none" d="M400.0,282.0 L400.0,55.6"/><path style="fill:var(--muted);stroke:none" d="M400.0,50.0 L396.6,58.0 L403.4,58.0 Z"/><text x="700.0" y="195.0" class="e lab">stretch δ</text><text x="408.0" y="56.0" class="lab">N (tension positive)</text><path style="stroke:var(--wire);stroke-width:2.8" d="M292.9,233 L650,39.6"/><path style="stroke:var(--wire);stroke-width:2.8" d="M120,233 L292.9,233"/><path style="stroke:var(--wire3);stroke-width:2.4;stroke-dasharray:6 4" d="M120,177 L400,177"/><path class="thin" d="M394,233 L406,233"/><text x="410.0" y="237.0">−N<tspan dy="4" style="font-size:78%">cr</tspan></text><text x="540.0" y="135.0">active: N = (EA/L) δ</text><text x="130.0" y="255.0">bowed: N = −N<tspan dy="4" style="font-size:78%">cr</tspan><tspan dx="1.5" dy="-4">, no stiffness</tspan></text><text x="130.0" y="165.0">slack (I<tspan dy="4" style="font-size:78%">min</tspan><tspan dx="1.5" dy="-4"> = 0, N</tspan><tspan dy="4" style="font-size:78%">cr</tspan><tspan dx="1.5" dy="-4"> = 0): N = 0</tspan></text><text x="20.0" y="300.0" class="lab">N<tspan dy="4" style="font-size:78%">cr</tspan><tspan dx="1.5" dy="-4"> = π² E I</tspan><tspan dy="4" style="font-size:78%">min</tspan><tspan dx="1.5" dy="-4"> / L</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4">²,  L</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4"> = lk, else k × length (k = 1: pinned ends)</tspan></text><text x="20.0" y="318.0" class="lab">A member out of the active set has no stiffness and carries its constant force; the set is found by repeated solves.</text><path style="stroke:var(--ink);stroke-width:3" d="M560,250 L690,250"/><text x="700.0" y="254.0" class="lab">active</text><path style="stroke:var(--ink);stroke-width:3;fill:none" d="M560,275 Q625,262 690,275"/><text x="700.0" y="279.0" class="lab">bowed</text><path style="stroke:var(--wire3);stroke-width:2.4;fill:none" d="M560.0,300.0 L563.6,301.9 L567.2,303.0 L570.8,302.6 L574.4,301.0 L578.1,299.0 L581.7,297.4 L585.3,297.0 L588.9,298.1 L592.5,300.0 L596.1,301.9 L599.7,303.0 L603.3,302.6 L606.9,301.0 L610.6,299.0 L614.2,297.4 L617.8,297.0 L621.4,298.1 L625.0,300.0 L628.6,301.9 L632.2,303.0 L635.8,302.6 L639.4,301.0 L643.1,299.0 L646.7,297.4 L650.3,297.0 L653.9,298.1 L657.5,300.0 L661.1,301.9 L664.7,303.0 L668.3,302.6 L671.9,301.0 L675.6,299.0 L679.2,297.4 L682.8,297.0 L686.4,298.1 L690.0,300.0"/><text x="700.0" y="304.0" class="lab">slack</text></svg>
