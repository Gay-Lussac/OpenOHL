<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d"><title id="t">A gusset plate's bolt group and a fillet weld</title><desc id="d">Left: a member bolted onto a gusset plate by two gauge lines of three bolts, the member in tension pulling away from the joint: the pitch p between bolts on a line, the span between the outer lines, the end distance e_1 from the bolts to the plate's edge in the force's direction, the edge distance e_2 across, and the block that tears out: two shear planes along the outer gauge lines from the edge to the innermost bolt and the tension plane between them. Right: a fillet weld between two plates at the angle θ, its throat a (the height of the inscribed triangle) and its contact width s = a / cos(θ/2).</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="900" height="430"/><text x="20.0" y="26.0" class="t">The bolt group in the plate</text><path class="box" d="M70.0,330.0 L70.0,120.0 L200.0,70.0 L420.0,110.0 L420.0,330.0 Z"/><text x="84.0" y="316.0" class="lab">gusset plate</text><rect x="150" y="170" width="330" height="110" style="fill:var(--wire);fill-opacity:.12;stroke:var(--wire);stroke-width:1.6"/><path style="stroke:var(--wire);stroke-width:2.2;fill:none" d="M440.0,225.0 L513.0,225.0"/><path style="fill:var(--wire);stroke:none" d="M520.0,225.0 L510.0,220.8 L510.0,229.2 Z"/><text x="526.0" y="229.0">N (tension)</text><path class="thin dt" d="M150,195 L480,195"/><circle cx="215" cy="195" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.8"/><circle cx="275" cy="195" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.8"/><circle cx="335" cy="195" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.8"/><path class="thin dt" d="M150,255 L480,255"/><circle cx="215" cy="255" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.8"/><circle cx="275" cy="255" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:1.8"/><circle cx="335" cy="255" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width