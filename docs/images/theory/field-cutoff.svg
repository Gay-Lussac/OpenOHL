<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-labelledby="t d"><title id="t">The wires modelled within a distance</title><desc id="d">In plan: a line of five spans and a cut across its middle span. With Modelled within d, only the wire pieces within d of the cut (the band) are summed; the pieces beyond are left out, and the run says how much that changes the cut, measured against the whole line at some 200 of its points.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="346"/><text x="20.0" y="26.0" class="t">A cut-off: only the wires within d of the cut or volume are summed</text><rect x="215" y="70" width="300" height="200" class="band"/><path class="wire" d="M40,158 L170,158 M40,170 L170,170 M40,182 L170,182"/><path class="wire" d="M170,158 L300,158 M170,170 L300,170 M170,182 L300,182"/><path class="wire" d="M300,158 L430,158 M300,170 L430,170 M300,182 L430,182"/><path class="wire" d="M430,158 L560,158 M430,170 L560,170 M430,182 L560,182"/><path class="wire" d="M560,158 L690,158 M560,170 L690,170 M560,182 L690,182"/><rect x="36" y="166" width="8" height="8" class="ap"/><rect x="166" y="166" width="8" height="8" class="ap"/><rect x="296" y="166" width="8" height="8" class="ap"/><rect x="426" y="166" width="8" height="8" class="ap"/><rect x="556" y="166" width="8" height="8" class="ap"/><rect x="686" y="166" width="8" height="8" class="ap"/><path class="acc" d="M365,60 L365,280"/><text x="371.0" y="58.0" class="sm">the cut</text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M219.9,290.0 L360.1,290.0"/><path style="fill:var(--muted);stroke:none" d="M365.0,290.0 L358.0,287.1 L358.0,292.9 Z"/><path style="fill:var(--muted);stroke:none" d="M215.0,290.0 L222.0,292.9 L222.0,287.1 Z"/><text x="290.0" y="284.0" class="c">d</text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M369.9,290.0 L510.1,290.0"/><path style="fill:var(--muted);stroke:none" d="M515.0,290.0 L508.0,287.1 L508.0,292.9 Z"/><path style="fill:var(--muted);stroke:none" d="M365.0,290.0 L372.0,292.9 L372.0,287.1 Z"/><text x="440.0" y="284.0" class="c">d</text><path class="thin" style="opacity:.35" d="M40,158 L215,158 M40,170 L215,170 M40,182 L215,182"/><path class="thin" style="opacity:.35" d="M515,158 L690,158 M515,170 L690,170 M515,182 L690,182"/><text x="60.0" y="110.0" class="lab">left out</text><text x="620.0" y="110.0" class="lab">left out</text><text x="365.0" y="96.0" class="c sm">summed (within d)</text><text x="20.0" y="318.0" class="lab">Measured (magnetic, a cut at the lowest point of a 2-span example): within 100 m 9 % off, within 200 m 1.6 %;</text><text x="20.0" y="334.0" class="lab">on a 28 km line, within 2 km 0.03 % off and ten times quicker.</text></svg>
