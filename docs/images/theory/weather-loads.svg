<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d"><title id="t">Ice, wind and the resultant load</title><desc id="d">Left: the conductor of diameter d with radial ice of thickness t, the wind pressure q on the iced diameter. Right: the vertical load of the conductor and the ice, the horizontal wind load, their resultant and the angle the plane swings by.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="350"/><text x="20.0" y="26.0" class="t">Weather loads on a wire: ice, wind, the resultant</text><circle cx="200" cy="175" r="64" class="fa" style="stroke:var(--acc);stroke-width:1.4"/><circle cx="200" cy="175" r="38" style="fill:var(--fill);stroke:var(--wire);stroke-width:2.5"/><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M166.9,179.0 L233.1,179.0"/><path style="fill:var(--muted);stroke:none" d="M238.0,179.0 L231.0,176.1 L231.0,181.9 Z"/><path style="fill:var(--muted);stroke:none" d="M162.0,179.0 L169.0,181.9 L169.0,176.1 Z"/><text x="200.0" y="173.0" class="c">d</text><path class="thin dt" d="M136,91 L136,171 M264,91 L264,171"/><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M140.9,99.0 L259.1,99.0"/><path style="fill:var(--muted);stroke:none" d="M264.0,99.0 L257.0,96.1 L257.0,101.9 Z"/><path style="fill:var(--muted);stroke:none" d="M136.0,99.0 L143.0,101.9 L143.0,96.1 Z"/><text x="200.0" y="93.0" class="c">d + 2t</text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M292.0,217.9 L292.0,234.1"/><path style="fill:var(--muted);stroke:none" d="M292.0,239.0 L294.9,232.0 L289.1,232.0 Z"/><path style="fill:var(--muted);stroke:none" d="M292.0,213.0 L289.1,220.0 L294.9,220.0 Z"/><text x="299.0" y="230.0">t</text><path class="thin dt" d="M200,213 L296,213 M200,239 L296,239"/><path class="ldr" d="M160.0,223.0 L170.0,287.0"/><text x="174.0" y="291.0">radial ice, density ρ<tspan dy="4" style="font-size:78%">i</tspan></text><path style="stroke:var(--acc);stroke-width:1.6;fill:none" d="M50.0,127.0 L117.1,127.0"/