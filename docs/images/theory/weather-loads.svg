r and ice)</text><text x="530.0" y="282.0" class="c">w<tspan dy="4" style="font-size:78%">h</tspan></text><text x="552.0" y="161.0">√((w<tspan dy="4" style="font-size:78%">c</tspan><tspan dx="1.5" dy="-4"> + w</tspan><tspan dy="4" style="font-size:78%">i</tspan><tspan dx="1.5" dy="-4">)² + w</tspan><tspan dy="4" style="font-size:78%">h</tspan><tspan dx="1.5" dy="-4">²)</tspan></text><path class="thin" d="M470.0,122.0 L470.7,122.0 L471.5,122.0 L472.2,122.0 L472.9,121.9 L473.7,121.9 L474.4,121.8 L475.1,121.7 L475.8,121.7 L476.6,121.6 L477.3,121.5 L478.0,121.4 L478.7,121.3 L479.5,121.1 L480.2,121.0 L480.9,120.8 L481.6,120.7 L482.3,120.5 L483.0,120.3 L483.7,120.1 L484.5,120.0 L485.2,119.7 L485.9,119.5 L486.6,119.3 L487.2,119.1 L487.9,118.8 L488.6,118.6 L489.3,118.3 L490.0,118.0 L490.7,117.7 L491.3,117.4 L492.0,117.1 L492.6,116.8 L493.3,116.5 L494.0,116.2 L494.6,115.8 L495.2,115.5 L495.9,115.1 L496.5,114.7 L497.1,114.4 L497.8,114.0"/><text x="460.0" y="110.0" class="e lab">arctan(w<tspan dy="4" style="font-size:78%">h</tspan><tspan dx="1.5" dy="-4">/w</tspan><tspan dy="4" style="font-size:78%">v</tspan><tspan dx="1.5" dy="-4">)</tspan></text><text x="530.0" y="306.0" class="c lab">the resultant's plane: swung by arctan(w<tspan dy="4" style="font-size:78%">h</tspan><tspan dx="1.5" dy="-4">/w</tspan><tspan dy="4" style="font-size:78%">v</tspan><tspan dx="1.5" dy="-4">)</tspan></text></svg>
