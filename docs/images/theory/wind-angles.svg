<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d"><title id="t">The wind's direction, relative to the line</title><desc id="d">Plan view of an angle structure: the line deviates by 20° at the structure; the angles are counted from the line's direction ahead, the bisector at the structure, clockwise: 0° from ahead, 90° from the right, 180° from behind, 270° from the left. A wind from 45° comes from ahead right and blows back and to the left. Each span takes the direction of its own route segment.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="420"/><text x="20.0" y="26.0" class="t">Where the wind comes from: θ, clockwise from ahead</text><path class="inkl" d="M250.0,390.0 L250.0,215.0"/><path class="inkl" d="M250.0,215.0 L309.9,50.6"/><text x="250.0" y="406.0" class="c lab">route (back span)</text><text x="318.2" y="40.0" class="lab">route (span ahead)</text><path style="stroke:var(--acc);stroke-width:1.8;fill:none" d="M250.0,215.0 L269.7,103.0"/><path style="fill:var(--acc);stroke:none" d="M270.8,96.8 L265.6,105.0 L273.0,106.3 Z"/><path style="stroke:var(--muted);stroke-width:1.3;fill:none;stroke-dasharray:5 4" d="M250.0,215.0 L362.7,234.9"/><path style="fill:var(--muted);stroke:none" d="M368.2,235.8 L360.9,231.1 L359.7,237.8 Z"/><text x="272.9" y="81.0" class="c lab">ahead â (bisector)</text><text x="380.1" y="241.2" class="lab">right r̂</text><circle cx="250" cy="215" r="92" class="thin dt" style="fill:none"/><path class="inkl" d="M264.9,130.3 L267.0,118.5"/><path class="inkl" d="M334.7,229.9 L346.5,232.0"/><path class="inkl" d="M235.1,299.7 L233.0,311.5"/><path class="inkl" d="M165.3,200.1 L153.5,198.0"/><text x="354.4" y="255.1" class="lab">90° from the right</text><text x="238.9" y="329.3" class="lab">180° from behind</text><text x="141.6" y="188.9" class="e lab">270° from the left</text><path class="thin" d="M287.7,99.0 L291.9,100.4 L296.0,102.0 L300.0,103.7 L304.0,105.6 L307.9,107.6 L311.7,109.8 L315.5,112.1 L319.2,114.5 L322.7,117.1 L326