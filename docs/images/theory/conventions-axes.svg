<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Coordinates, stations, offsets and angles</title><desc id="d">Left, in plan: the project axes x east and y north; a route's alignment through the structures T1, T2 and T3, ahead towards the upper left, with the station s measured along it and a point at a positive offset o to the right looking ahead; at T2 the structure's axes, x to the right of the line and y ahead, and orientation_deg, the direction of its x axis counter-clockwise from east; the wind from the left or the right looking ahead. Right: the angles around a structure as the application shows them, clockwise seen from above: ahead at ahead_deg, right at ahead + 90°, back at + 180°, left at + 270°.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="960" height="470"/><text x="20.0" y="26.0" class="t">In plan (north up)</text><path style="stroke:var(--ink);stroke-width:1.6;fill:none" d="M40.0,440.0 L104.4,440.0"/><path style="fill:var(--ink);stroke:none" d="M110.0,440.0 L102.0,436.6 L102.0,443.4 Z"/><path style="stroke:var(--ink);stroke-width:1.6;fill:none" d="M40.0,440.0 L40.0,375.6"/><path style="fill:var(--ink);stroke:none" d="M40.0,370.0 L36.6,378.0 L43.4,378.0 Z"/><text x="116.0" y="444.0">x (east)</text><text x="48.0" y="374.0">y (north)</text><path class="inkl" d="M560.0,400.0 L360.0,270.0 L130.0,200.0"/><rect x="554" y="394" width="12" height="12" class="ap"/><text x="574.0" y="424.0">T1</text><rect x="354" y="264" width="12" height="12" class="ap"/><text x="330.0" y="294.0">T2</text><rect x="124" y="194" width="12" height="12" class="ap"/><text x="118.0" y="224.0">T3</text><path class="acc" d="M551.3,413.4 L544.8,409.2 L538.3,405.0 L531.8,400.7 L525.3,396.5 L518.8,392.3 L512.3,388.1 L505.8,383.8 L499.3,379.6 L492.8,375.4 L486.3,371.2 L479.8,366.9 L473.3,362.7 L466.8,358.5 L460.3,354.3 L453.8,350.0 L447.3,345.8 L440.8,341.6 L434.3,337.4 L427.8,333.1 L421.3,328.9 L414.8,324.7 L408.3,320.5 L401.8,316.2 L395.3,312.0 L388.8,307.8 L382.