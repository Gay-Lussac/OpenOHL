<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d"><title id="t">Laps, splices and continuous members</title><desc id="d">Top, in section: a member end lapped onto another angle's leg on its outside face, on its inside face out along the leg, or nested heel into heel inside it. Bottom: the plies a bolt passes through and its shear planes: a lap, two legs, one plane; a splice, a leg between an outer and an inner cover, two planes; a continuous member runs on through the joint with no bolt.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="900" height="500"/><text x="20.0" y="26.0" class="t">How an end meets the other member (in section)</text><text x="20.0" y="46.0" class="lab">grey: the member bolted onto; orange: the end lapped onto it; black: a bolt</text><path class="box" d="M50.0,190.0 L150.0,190.0 L150.0,180.0 L60.0,180.0 L60.0,90.0 L50.0,90.0 Z"/><path style="fill:var(--wire);fill-opacity:.18;stroke:var(--wire);stroke-width:1.6" d="M66.0,200.0 L146.0,200.0 L146.0,210.0 L76.0,210.0 L76.0,280.0 L66.0,280.0 Z"/><path style="stroke:var(--ink);stroke-width:3" d="M126,170 L126,220"/><text x="110.0" y="310.0" class="c">on its outside face</text><path class="box" d="M330.0,190.0 L430.0,190.0 L430.0,180.0 L340.0,180.0 L340.0,90.0 L330.0,90.0 Z"/><path style="fill:var(--wire);fill-opacity:.18;stroke:var(--wire);stroke-width:1.6" d="M425.0,180.0 L365.0,180.0 L365.0,170.0 L415.0,170.0 L415.0,120.0 L425.0,120.0 Z"/><path style="stroke:var(--ink);stroke-width:3" d="M405,160 L405,200"/><text x="390.0" y="310.0" class="c">on its inside face</text><path class="box" d="M620.0,190.0 L720.0,190.0 L720.0,180.0 L630.0,180.0 L630.0,90.0 L620.0,90.0 Z"/><path style="fill:var(--wire);fill-opacity:.18;stroke:var(--wire);stroke-width:1.6" d="M630.0,180.0 L710.0,180.0 L710.0,170.0 L640.0,170.0 L640.0,100.0 L630.0,100.0 Z"/><path style="stroke:var(--ink);stroke-width:3" d="M690,160 L690,200"/><text x="670.0" y="310.0" class="c">nested, heel into heel</text><text x="20.0" y="350.0" class="t">The plies a bolt passes through, and its shear planes</text><rect x="40" y="378" width="140" height="18" style="fill:var(--wire);fill-opacity:.18;stroke:var(--wire);stroke-width:1.6"/><text x="190.0" y="391.0" class="lab">leg of the end</text><rect x="40" y="396" width="140" height="18" style="fill:var(--fill);stroke:var(--muted);stroke-width:1"/><text x="190.0" y="409.0" class="lab">leg bolted onto</text><path style="stroke:var(--ink);stroke-width:4" d="M110,368 L110,424"/><path style="stroke:var(--acc);stroke-width:2;stroke-dasharray:6 4" d="M28,396 L192,396"/><text x="110.0" y="456.0" class="c">lap: one shear plane</text><rect x="330" y="378" width="140" height="14" style="fill:var(--fill);stroke:var(--muted);stroke-width:1"/><text x="480.0" y="389.0" class="lab">outer cover</text><rect x="330" y="392" width="140" height="18" style="fill:var(--wire);fill-opacity:.18;stroke:var(--wire);stroke-width:1.6"/><text x="480.0" y="405.0" class="lab">leg</text><rect x="330" y="410" width="140" height="14" style="fill:var(--fill);stroke:var(--muted);stroke-width:1"/><text x="480.0" y="421.0" class="lab">inner cover</text><path style="stroke:var(--ink);stroke-width:4" d="M400,368 L400,434"/><path style="stroke:var(--acc);stroke-width:2;stroke-dasharray:6 4" d="M318,392 L482,392"/><path style="stroke:var(--acc);stroke-width:2;stroke-dasharray:6 4" d="M318,410 L482,410"/><text x="400.0" y="456.0" class="c">splice: two shear planes</text><rect x="620" y="378" width="140" height="18" style="fill:var(--wire);fill-opacity:.18;stroke:var(--wire);stroke-width:1.6"/><text x="770.0" y="391.0" class="lab">running on</text><text x="690.0" y="456.0" class="c">continuous: no bolt</text><text x="330.0" y="480.0" class="lab">dashed: a shear plane</text></svg>
