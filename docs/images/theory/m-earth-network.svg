x="590.0" y="62.0" class="c">I<tspan dy="4" style="font-size:78%">e,3</tspan><tspan dx="1.5" dy="-4">&#8203;</tspan></text><text x="40.0" y="354.0">In a span from a to b of length L: I<tspan dy="4" style="font-size:78%">e</tspan><tspan dx="1.5" dy="-4"> = (Z</tspan><tspan dy="4" style="font-size:78%">ee</tspan><tspan dx="1.5" dy="-4"> L)</tspan><tspan dy="-5" style="font-size:78%">−1</tspan><tspan dx="1.5" dy="5"> ((V</tspan><tspan dy="4" style="font-size:78%">a</tspan><tspan dx="1.5" dy="-4"> − V</tspan><tspan dy="4" style="font-size:78%">b</tspan><tspan dx="1.5" dy="-4">) 1 − Z</tspan><tspan dy="4" style="font-size:78%">ep</tspan><tspan dx="1.5" dy="-4"> I</tspan><tspan dy="4" style="font-size:78%">p</tspan><tspan dx="1.5" dy="-4"> L)   (Carson's earth return)</tspan></text><text x="40.0" y="372.0" class="lab">At every structure: Σ I<tspan dy="4" style="font-size:78%">e</tspan><tspan dx="1.5" dy="-4"> (out) + V</tspan><tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">/R</tspan><tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4"> = 0. R</tspan><tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">: the structure's, else the line's, else 10 Ω assumed.</tspan></text></svg>
