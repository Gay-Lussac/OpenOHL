</text><text x="500.0" y="80.0">B = … + k<tspan dy="4" style="font-size:78%">A</tspan><tspan dx="1.5" dy="-4"> A</tspan></text><path class="ldr" d="M605.0,253.0 L690.0,300.0"/><text x="694.0" y="304.0" class="lab">wire at rest</text><text x="500.0" y="346.0" class="lab">With wind: the wire swung, D its vertical sag.</text></svg>
