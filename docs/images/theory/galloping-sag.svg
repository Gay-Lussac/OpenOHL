<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">The sag the ellipse is sized from</title><desc id="d">Left: a span from the side, its supports at different heights, the chord between the clamps, the horizontal span length L and the sag D, the largest vertical distance of the wire below the chord. Right: across the span at mid-span, the wire at rest and its ellipse, whose axes come from D, L and the conductor diameter d.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity: