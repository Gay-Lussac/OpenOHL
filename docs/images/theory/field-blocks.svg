<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">Points in blocks</title><desc id="d">Point by point, every point reads all the line's pieces from memory; in blocks of 64 points, each wire's pieces are read once and stay in the processor's cache for the 64 points; the threads take the next block in turn, so a quicker core takes more.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="330"/><text x="20.0" y="26.0" class="t">Why points are computed in blocks (the same sums, read once)</text><text x="40.0" y="64.0">Point by point</text><rect x="40" y="80" width="120" height="18" class="box"/><text x="100.0" y="93.0" class="c sm">wire 1: pieces</text><rect x="40" y="106" width="120" height="18" class="box"/><text x="100.0" y="119.0" class="c sm">wire 2: pieces</text><rect x="40" y="132" width="120" height="18" class="box"/><text x="100.0" y="145.0" class="c sm">wire 3: pieces</text><rect x="40" y="158" width="120" height="18" class="box"/><text x="100.0" y="171.0" class="c sm">…  (7 MB in all)</text><circle cx="300.0" cy="92.0" r="4" style="fill:var(--acc);stroke:none"/><text x="310.0" y="96.0" class="sm">point 1</text><path class="thin" style="opacity:.5" d="M160,89 L294,92"/><path class="thin" style="opacity:.5" d="M160,115 L294,92"/><path class="thin" style="opacity:.5" d="M160,141 L294,92"/><path class="thin" style="opacity:.5" d="M160,167 L294,92"/><circle cx="300.0" cy="132.0" r="4" style="fill:var(--acc);stroke:none"/><text x="310.0" y="136.0" class="sm">point 2</text><path class="thin" style="opacity:.5" d="M160,89 L294,132"/><path class="thin" style="opacity:.5" d="M160,115 L294,132"/><path class="thin" style="opacity:.5" d="M160,141 L294,132"/><path class="thin" style="opacity:.5" d="M160,167 L294,132"/><circle cx="300.0" cy="172.0" r="4" style="fill:var(--acc);stroke:none"/><text x="310.0" y="176.0" class="sm">point 3</text><path class="thin" style="opacity:.5" d="M160,89 L294,172"/><path class="thin" style="opacity:.5" d="M160,115 L294,172"/><path class="thin" style="opacity:.5" d="M160,141 L294,172"/><path class="thin" style="opacity:.5" d="M160,167 L294,172"/><text x="40.0" y="216.0" class="lab">every point reads all 7 MB again:</text><text x="40.0" y="232.0" class="lab">memory, not arithmetic, sets the pace</text><text x="420.0" y="64.0">In blocks of 64 points</text><rect x="420" y="80" width="120" height="18" class="box"/><text x="480.0" y="93.0" class="c sm">wire 1: pieces</text><rect x="420" y="106" width="120" height="18" class="box"/><text x="480.0" y="119.0" class="c sm">wire 2: pieces</text><rect x="420" y="132" width="120" height="18" class="box"/><text x="480.0" y="145.0" class="c sm">wire 3: pieces</text><rect x="420" y="158" width="120" height="18" class="box"/><text x="480.0" y="171.0" class="c sm">…  (7 MB in all)</text><rect x="580" y="76" width="130" height="110" class="band"/><text x="645.0" y="70.0" class="c sm">one block</text><circle cx="596.0" cy="100.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="626.0" cy="100.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="656.0" cy="100.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="686.0" cy="100.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="596.0" cy="150.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="626.0" cy="150.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="656.0" cy="150.0" r="3.2" style="fill:var(--acc);stroke:none"/><circle cx="686.0" cy="150.0" r="3.2" style="fill:var(--acc);stroke:none"/><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M544.0,89.0 L575.2,107.2"/><path style="fill:var(--wire);stroke:none" d="M580.0,110.0 L574.8,103.1 L571.4,108.9 Z"/><text x="420.0" y="216.0" class="lab">wire 1's pieces read once, used for all 64,</text><text x="420.0" y="232.0" class="lab">then wire 2's…: they stay in the cache</text><rect x="40" y="262" width="30" height="20" class="box"/><text x="55.0" y="276.0" class="c sm">1</text><rect x="76" y="262" width="30" height="20" class="box"/><text x="91.0" y="276.0" class="c sm">2</text><rect x="112" y="262" width="30" height="20" class="box"/><text x="127.0" y="276.0" class="c sm">3</text><rect x="148" y="262" width="30" height="20" class="box"/><text x="163.0" y="276.0" class="c sm">4</text><rect x="184" y="262" width="30" height="20" class="box"/><text x="199.0" y="276.0" class="c sm">5</text><rect x="220" y="262" width="30" height="20" class="box"/><text x="235.0" y="276.0" class="c sm">6</text><rect x="256" y="262" width="30" height="20" class="box"/><text x="271.0" y="276.0" class="c sm">7</text><rect x="292" y="262" width="30" height="20" class="box"/><text x="307.0" y="276.0" class="c sm">8</text><rect x="328" y="262" width="30" height="20" class="box"/><text x="343.0" y="276.0" class="c sm">9</text><rect x="364" y="262" width="30" height="20" class="box"/><text x="379.0" y="276.0" class="c sm">10</text><text x="420.0" y="270.0" class="lab">blocks waiting: each thread takes the next</text><text x="420.0" y="286.0" class="lab">one in turn (quick cores take more)</text><text x="20.0" y="318.0" class="lab">Measured: per polyline 4.7 ns a piece and point (9.4 ns piece by piece); blocks and the queue: 85 s → 67 s for one volume.</text></svg>
