<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d"><title id="t">The wind on a member</title><desc id="d">A member at an angle to the wind: the wind's unit vector w, the member's axis x, the angle theta between them, the wind's part normal to the member w_n of length sin theta, and the force F along w_n, half at each joint.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="350"/><text x="20.0" y="26.0" class="t">The cross-flow force on one member</text><path style="stroke:var(--ink);stroke-width:7;stroke-linecap:round" d="M223.8,296.0 L356.2,84.0"/><circle cx="223.8" cy="296.0" r="6" style="fill:var(--bg);stroke:var(--ink);stroke-width:2"/><circle cx="356.2" cy="84.0" r="6" style="fill:var(--bg);stroke:var(--ink);stroke-width:2"/><path style="stroke:var(--acc);stroke-width:2.2;fill:none" d="M160.0,190.0 L283.7,190.0"/><path style="fill:var(--acc);stroke:none" d="M290.0,190.0 L281.0,186.2 L281.0,193.8 Z"/><text x="160.0" y="180.0">wind w (unit)</text><path style="stroke:var(--muted);stroke-width:1.6;fill:none" d="M276.4,181.5 L321.2,109.9"/><path style="fill:var(--muted);stroke:none" d="M324.1,105.2 L317.0,110.2 L322.7,113.8 Z"/><text x="316.1" y="109.2" class="e">member axis x</text><path class="thin ds" d="M326.5,131.6 L420.0,190"/><path class="thin ds" d="M290,190 L420,190"/><path style="stroke:var(--wire);stroke-width:2.4;fill:none" d="M290.0,190.0 L378.2,245.1"/><path style="fill:var(--wire);stroke:none" d="M383.5,248.4 L377.9,240.4 L373.9,246.9 Z"/><text x="393.5" y="266.4">w<tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4"> = w − (w · x) x,  length sin θ</tspan></text><path class="thin" d="M311.2,156.1 L312.0,156.6 L312.9,157.2 L313.7,157.8 L314.5,158.4 L315.3,159.0 L316.1,159.7 L316.8,160.3 L317.6,161.0 L318.3,161.7 L319.0,162.5 L319.7,163.2 L320.4,164.0 L321.0,164.7 L321.6,165.5 L322.3,166.3 L322.8,167.2 L323.4,168.0 L324.0,168.9 L324.5,169.7 L325.0,170.6 L325.5,171.5 L325.9,172.4 L326.4,173.3 L326.8,174.2 L327.2,175.2 L327.5,176.1 L327.9,177.1 L328.2,178.0 L328.5,179.0 L328.7,180.0 L329.0,181.0 L329.2,182.0 L329.4,183.0 L329.5,183.9 L329.7,185.0 L329.8,186.0 L329.9,187.0 L329.9,188.0 L330.0,189.0 L330.0,190.0"/><text x="336.0" y="178.0">θ</text><text x="470.0" y="90.0" class="t">F = q c η d L sin θ  w<tspan dy="4" style="font-size:78%">n</tspan></text><text x="470.0" y="112.0">|F| = q c η d L sin²θ</text><text x="470.0" y="140.0" class="lab">q: the wind pressure; c: the drag factor;</text><text x="470.0" y="156.0" class="lab">η: the shielding factor (1 unless</text><text x="470.0" y="172.0" class="lab">behind a face); d: the profile's width</text><text x="470.0" y="188.0" class="lab">across w<tspan dy="4" style="font-size:78%">n</tspan><tspan dx="1.5" dy="-4">; L: the length.</tspan></text><text x="470.0" y="214.0" class="lab">Half of F at each joint.</text><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M223.8,296.0 L248.4,311.4"/><path style="fill:var(--wire);stroke:none" d="M252.5,314.0 L248.1,307.8 L245.0,312.8 Z"/><text x="262.8" y="320.7" class="lab">F/2</text><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M356.2,84.0 L380.9,99.4"/><path style="fill:var(--wire);stroke:none" d="M385.0,102.0 L380.6,95.8 L377.5,100.8 Z"/><text x="395.3" y="108.7" class="lab">F/2</text></svg>
