<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 430" width="790" height="430" role="img" aria-labelledby="t d"><title id="t">An angle's axes and widths</title><desc id="d">An equal-leg angle in cross-section, legs b, thickness t, root radius r: the flat width w = b − t − r from the edge of the root fillet to the leg's tip (local buckling); the centroid G with the geometric axes y and z parallel to the legs; the principal axes, u the major across the axis of symmetry and v the minor along it through the heel, about which the radius of gyration r_v is the smallest.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="790" height="430"/><text x="20.0" y="26.0" class="t">A single angle in cross-section</text><path class="box" d="M150.0,360.0 L390.0,360.0 L390.0,333.0 L207.0,333.0 L207.0,333.0 L201.8,332.5 L196.7,331.2 L192.0,329.0 L187.7,326.0 L184.0,322.3 L181.0,318.0 L178.8,313.3 L177.5,308.2 L177.0,303.0 L177.0,120.0 L150.0,120.0 Z"/><circle cx="219.9" cy="290.1" r="3.5" style="fill:var(--ink);stroke:none"/><text x="209.9" y="282.1" class="e">G</text><path style="stroke:var(--muted);stroke-width:1.2;fill:none" d="M159.9,290.1 L435.1,290.1"/><path style="fill:var(--muted);stroke:none" d="M440.0,290.1 L433.0,287.1 L433.0,293.0 Z"/><text x="446.0" y="294.1">y</text><path style="stroke:var(--muted);stroke-width:1.2;fill:none" d="M219.9,350.1 L219.9,84.9"/><path style="fill:var(--muted);stroke:none" d="M219.9,80.0 L217.0,87.0 L222.9,87.0 Z"/><text x="225.9" y="76.0">z</text><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M113.9,396.1 L337.4,172.6"/><path style="fill:var(--wire);stroke:none" d="M341.9,168.1 L332.9,171.8 L338.2,177.1 Z"/><text x="347.9" y="164.1">v (minor)</text><text x="347.9" y="180.1" class="lab">the axis of symmetry</text><path style="stroke:var(--acc);stroke-width:1.8;fill:none" d="M113.9,184.0 L321.5,391.7"/><path style="fill:var(--acc);stroke:none" d="M326.0,396.1 L322.3,387.1 L317.0,392.5 Z"/><text x="332.0" y="400.1">u (major)</text><path style="stroke:var(--muted);stroke-width:1.1;fill:none