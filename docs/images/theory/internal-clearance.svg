<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Internal clearances at a structure</title><desc id="d">A structure's body and crossarm seen along the line: a suspension string swung by the wind towards the body, its live end and the conductor at the clamp, an electrified grading ring there (a torus) and grounded fittings at its top. Each electrified part's smallest distance to the nearest member of the body, against the rule's required distance; the grounded fittings are measured against the electrified parts, not against the body.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="900" height="470"/><text x="20.0" y="26.0" class="t">At a structure, in a weather case (seen along the line)</text><path class="st" d="M150,440 L170,70 M250,440 L230,70"/><path class="thin" d="M166.38,100 L236.86,160"/><path class="thin" d="M233.62,100 L163.14,160"/><path class="thin" d="M163.14,160 L240.1,220"/><path class="thin" d="M236.86,160 L159.9,220"/><path class="thin" d="M159.9,220 L243.34,280"/><path class="thin" d="M240.1,220 L156.66,280"/><path class="thin" d="M156.66,280 L246.58,340"/><path class="thin" d="M243.34,280 L153.42,340"/><path class="thin" d="M153.42,340 L249.82,400"/><path class="thin" d="M246.58,340 L150.18,400"/><path class="thin" d="M150.18,400 L253.06,460"/><path class="thin" d="M249.82,400 L146.94,460"/><path class="st" d="M228,130 L560,130 L228,170"/><text x="568.0" y="134.0">crossarm</text><path class="str" d="M500,130 L429.57926558211636,262.4421389288391"/><rect x="493" y="130" width="14" height="10" class="box"/><text x="512.0" y="152.0" class="lab">grounded fittings</text><circle cx="429.6" cy="262.4" r="6" style="fill:var(--bg);stroke:var(--wire);stroke-width:2.2"/><ellipse cx="429.6" cy="256.4" rx="26" ry="8" style="fill:none;stroke:var(--acc);stroke-width:2.4"/><text x="461.6" y="260.4">grading ring (electrified)</text><text x="461.6" y="280.4" class="lab">live end, conductor at the clamp</text><text x="461.6" y="296.4" class="lab">(the string swung by the wind)</text><path style="stroke:var(--muted);stroke-width:1.6;fill:none;stroke-dasharray:5 4" d="M700.0,330.0 L605.6,330.0"/><path style="fill:var(--muted);stroke:none" d="M600.0,330.0 L608.0,333.4 L608.0,326.6 Z"/><text x="706.0" y="334.0">wind</text><path style="stroke:var(--acc);stroke-width:1.4;fill:none" d="M398.7,256.4 L250.9,256.4"/><path style="fill:var(--acc);stroke:none" d="M246.0,256.4 L253.0,259.4 L253.0,253.5 Z"/><path style="fill:var(--acc);stroke:none" d="M403.6,256.4 L396.6,253.5 L396.6,259.4 Z"/><text x="324.8" y="248.4" class="c"></text><text x="389.6" y="240.4" class="e">d ≥ required?</text><text x="600.0" y="380.0">One row per structure, case and part:</text><text x="600.0" y="398.0" class="lab">its smallest distance, the member it is</text><text x="600.0" y="414.0" class="lab">nearest, the required distance</text></svg>
