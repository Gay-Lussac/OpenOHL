<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" role="img" aria-labelledby="t d"><title id="t">Shielding angle</title><desc id="d">Two shielding wires; from each, lines leaning from the vertical by the outer angle away from the other wire and the inner angle towards it; phases inside covered, one outside the outer line exposed.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="385"/><text x="20" y="26" class="t">Shielding angle: the phases within the lines from the shielding wires</text><path class="gnd" d="M30,330 L730,330"/><path class="fa" d="M260,80 L115.7,330 L564.3,330 L420,80 L340.0,160.0 Z"/><path class="acc" d="M260,80 L115.7,330"/><path class="acc" d="M420,80 L564.3,330"/><path class="acc ds" d="M260,80 L340.0,160.0 L420,80"/><path class="dash" d="M260,80 L260,230"/><circle class="dot" cx="260" cy="80" r="5"/><path class="dash" d="M420,80 L420,230"/><circle class="dot" cx="420" cy="80" r="5"/><text x="436" y="150">α<tspan dy="4" style="font-size:78%">outer</tspan></text><text x="362" y="142">α<tspan dy="4" style="font-size:78%">inner</tspan></text><text x="250" y="68" class="e lab">shielding wires</text><circle cx="210" cy="170" r="7" style="fill:var(--wire2);stroke:none"/><circle cx="480" cy="170" r="7" style="fill:var(--wire2);stroke:none"/><circle cx="340" cy="210" r="7" style="fill:var(--wire2);stroke:none"/><circle cx="560" cy="150" r="7" style="fill:var(--wire);stroke:none"/><path class="thin dt" d="M420,80 L560,150"/><text x="574" y="146">exposed: outside</text><text x="574" y="163">the outer line</text><text x="492" y="190" class="lab">covered</text><text x="20" y="358" class="lab">Covered when the line from a shielding wire above the phase leans from the vertical by at most the rule's angle</text><text x="20" y="375" class="lab">(measured to the far side of its bundle: conservative); the inner angle towards another shielding wire.</text></svg>