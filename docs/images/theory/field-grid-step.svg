<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="t d"><title id="t">A cut's grid and its isolines</title><desc id="d">Left: a coarse grid around a wire; the field is computed exactly at every point, the isoline is drawn straight between the points where it crosses the cells, so near the wire, where the level's circle is small, it cuts the corners. Right: a finer grid follows the circle closely; far from the wire the isoline is gentle and a coarse grid already follows it.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="356"/><text x="20.0" y="26.0" class="t">Every point exact; an isoline drawn straight between points</text><text x="40.0" y="56.0">coarse grid (2 m): corners cut near the wire</text><path class="thin" style="opacity:.25" d="M40,70 L40,310"/><path class="thin" style="opacity:.25" d="M80,70 L80,310"/><path class="thin" style="opacity:.25" d="M120,70 L120,310"/><path class="thin" style="opacity:.25" d="M160,70 L160,310"/><path class="thin" style="opacity:.25" d="M200,70 L200,310"/><path class="thin" style="opacity:.25" d="M240,70 L240,310"/><path class="thin" style="opacity:.25" d="M280,70 L280,310"/><path class="thin" style="opacity:.25" d="M320,70 L320,310"/><path class="thin" style="opacity:.25" d="M40,70 L340,70"/><path class="thin" style="opacity:.25" d="M40,110 L340,110"/><path class="thin" style="opacity:.25" d="M40,150 L340,150"/><path class="thin" style="opacity:.25" d="M40,190 L340,190"/><path class="thin" style="opacity:.25" d="M40,230 L340,230"/><path class="thin" style="opacity:.25" d="M40,270 L340,270"/><path class="thin" style="opacity:.25" d="M40,310 L340,310"/><path class="acc" d="M260.0,190.0 L259.1,201.0 L256.6,211.6 L252.4,221.8 L246.6,231.1 L239.5,239.5 L231.1,246.6 L221.8,252.4 L211.6,256.6 L201.0,259.1 L190.0,260.0 L179.0,259.1 L168.4,256.6 L158.2,252.4 L148.9,246.6 L140.5,239.5 L133.4,231.1 L127.6,221.8 L123.4,211.6 L120.9,201.0 L120.0,190.0 L120.9,179.0 L123.4,168.4 L127.6,158.2 L133.4,148.9 L140.5,140.5 L148.9,133.