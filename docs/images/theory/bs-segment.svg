<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">The field of one straight piece</title><desc id="d">A straight piece of wire from a to b carrying the current I, a point p beside it: the piece's direction u, the perpendicular d from the piece's line to p of length rho, the vectors r_a and r_b from the ends to p and the angles alpha_1 and alpha_2 they make with u; the field at p is perpendicular to the plane of the piece and p.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="360"/><text x="20.0" y="26.0" class="t">Biot–Savart for one straight piece, in closed form</text><path style="stroke:var(--wire);stroke-width:5;stroke-linecap:round" d="M110.0,270.0 L430.0,270.0"/><path style="stroke:var(--wire);stroke-width:1.8;fill:none" d="M170.0,296.0 L254.4,296.0"/><path style="fill:var(--wire);stroke:none" d="M260.0,296.0 L252.0,292.6 L252.0,299.4 Z"/><text x="215.0" y="316.0" class="c lab">current I</text><path style="stroke:var(--ink);stroke-width:2;fill:none" d="M110.0,270.0 L164.4,270.0"/><path style="fill:var(--ink);stroke:none" d="M170.0,270.0 L162.0,266.6 L162.0,273.4 Z"/><text x="140.0" y="260.0" class="c">û</text><circle class="ap" cx="110.0" cy="270.0" r="4.5"/><circle class="ap" cx="430.0" cy="270.0" r="4.5"/><text x="100.0" y="290.0" class="e">a</text><text x="440.0" y="290.0">b</text><path style="stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4" d="M110.0,270.0 L321.5,115.3"/><path style="fill:var(--muted);stroke:none" d="M326.0,112.0 L317.6,114.0 L321.5,119.4 Z"/><path style="stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4" d="M430.0,270.0 L335.9,117.8"/><path style="fill:var(--muted);stroke:none" d="M333.0,113.0 L334.3,121.6 L340.1,118.0 Z"/><text x="205.0" y="175.0" class="lab">r<tspan dy="4" style="font-size:78%">a</tspan></text><text x="395.0" y="185.0" class="lab">r<tspan dy="4" style="font-size:78%">b</tspan></text><path style="stroke:var(--acc);stroke-width:2;fill:none" d="M330.0,270.0 L330.0,123.6"/><path style="fill:var(--acc);stroke:none" d="M330.0,118.0 L326.6,126.0 L333.4,126.0 Z"/><text x="322.0" y="215.0" class="e">d,  |d| = ρ</text><path class="thin" d="M318.0,270.0 L318.0,258.0 L330.0,258.0"/><path class="thin" d="M144.0,245.3 L144.4,245.8 L144.7,246.4 L145.1,246.9 L145.5,247.5 L145.8,248.0 L146.1,248.6 L146.5,249.2 L146.8,249.8 L147.1,250.3 L147.4,250.9 L147.7,251.5 L148.0,252.1 L148.3,252.7 L148.5,253.3 L148.8,253.9 L149.0,254.5 L149.3,255.1 L149.5,255.8 L149.7,256.4 L149.9,257.0 L150.1,257.6 L150.3,258.3 L150.5,258.9 L150.7,259.5 L150.8,260.2 L151.0,260.8 L151.1,261.5 L151.3,262.1 L151.4,262.8 L151.5,263.4 L151.6,264.1 L151.7,264.7 L151.7,265.4 L151.8,266.0 L151.9,266.7 L151.9,267.4 L152.0,268.0 L152.0,268.7 L152.0,269.3 L152.0,270.0"/><text x="160.0" y="256.0">α<tspan dy="4" style="font-size:78%">1</tspan></text><path class="thin" d="M412.0,241.2 L413.5,240.3 L415.1,239.4 L416.8,238.7 L418.5,238.0 L420.2,237.4 L421.9,237.0 L423.7,236.6 L425.5,236.3 L427.3,236.1 L429.1,236.0 L430.9,236.0 L432.7,236.1 L434.5,236.3 L436.3,236.6 L438.1,237.0 L439.8,237.5 L441.5,238.0 L443.2,238.7 L444.9,239.4 L446.5,240.3 L448.0,241.2 L449.5,242.2 L451.0,243.3 L452.4,244.4 L453.7,245.6 L455.0,246.9 L456.2,248.3 L457.3,249.7 L458.3,251.2 L459.3,252.7 L460.2,254.3 L461.0,256.0 L461.7,257.6 L462.3,259.3 L462.8,261.1 L463.2,262.8 L463.6,264.6 L463.8,266.4 L464.0,268.2 L464.0,270.0"/><text x="428.0" y="228.0" class="c">α<tspan dy="4" style="font-size:78%">2</tspan></text><circle cx="330.0" cy="110.0" r="11" style="fill:var(--bg);stroke:var(--wire3);stroke-width:2.2"/><circle cx="330.0" cy="110.0" r="3.5" style="fill:var(--wire3);stroke:none"/><text x="346.0" y="100.0">p:  B out of the page (along û × d)</text><text x="480.0" y="236.0">|B| = μ<tspan dy="4" style="font-size:78%">0</tspan><tspan dx="1.5" dy="-4"> I ⁄ (4π ρ) · (cos α</tspan><tspan dy="4" style="font-size:78%">1</tspan><tspan dx="1.5" dy="-4"> − cos α</tspan><tspan dy="4" style="font-size:78%">2</tspan><tspan dx="1.5" dy="-4">)</tspan></text><text x="480.0" y="258.0" class="lab">exact for the straight piece;</text><text x="480.0" y="276.0" class="lab">a long piece: cos α<tspan dy="4" style="font-size:78%">1</tspan><tspan dx="1.5" dy="-4"> → 1, cos α</tspan><tspan dy="4" style="font-size:78%">2</tspan><tspan dx="1.5" dy="-4"> → −1,</tspan></text><text x="480.0" y="294.0" class="lab">the infinite wire's μ<tspan dy="4" style="font-size:78%">0</tspan><tspan dx="1.5" dy="-4"> I ⁄ (2π ρ).</tspan></text><text x="20.0" y="344.0" class="lab">The line: every piece of every subconductor, its current a phasor; the pieces' fields summed per component, B = √(|B<tspan dy="4" style="font-size:78%">x</tspan><tspan dx="1.5" dy="-4">|² + |B</tspan><tspan dy="4" style="font-size:78%">y</tspan><tspan dx="1.5" dy="-4">|² + |B</tspan><tspan dy="4" style="font-size:78%">z</tspan><tspan dx="1.5" dy="-4">|²).</tspan></text></svg>
