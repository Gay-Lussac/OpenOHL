<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d"><title id="t">The most tensioned support</title><desc id="d">An inclined span: the horizontal tension H at the low point z_0, and the tension at the higher support z_s, T = H + w (z_s − z_0), the larger of the span's two end tensions, checked against f R.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="370"/><text x="20.0" y="26.0" class="t">The maximum tension of a span: at its most tensioned support</text><path class="gnd" d="M40,300 L720,300"/><path class="st" d="M90.0,300 L90.0,210.0 M640.0,300 L640.0,90.0"/><path class="wire" d="M90.0,210.0 L96.9,212.4 L103.8,214.8 L110.6,217.1 L117.5,219.2 L124.4,221.2 L131.2,223.2 L138.1,225.1 L145.0,226.8 L151.9,228.4 L158.8,230.0 L165.6,231.4 L172.5,232.8 L179.4,234.1 L186.2,235.2 L193.1,236.2 L200.0,237.2 L206.9,238.1 L213.8,238.8 L220.6,239.4 L227.5,240.0 L234.4,240.4 L241.2,240.8 L248.1,241.1 L255.0,241.2 L261.9,241.2 L268.8,241.2 L275.6,241.1 L282.5,240.8 L289.4,240.4 L296.2,240.0 L303.1,239.4 L310.0,238.8 L316.9,238.1 L323.8,237.2 L330.6,236.2 L337.5,235.2 L344.4,234.1 L351.2,232.8 L358.1,231.4 L365.0,230.0 L371.9,228.4 L378.8,226.8 L385.6,225.1 L392.5,223.2 L399.4,221.2 L406.2,219.2 L413.1,217.1 L420.0,214.8 L426.9,212.4 L433.8,210.0 L440.6,207.4 L447.5,204.8 L454.4,202.1 L461.2,199.2 L468.1,196.2 L475.0,193.2 L481.9,190.1 L488.8,186.8 L495.6,183.4 L502.5,180.0 L509.4,176.5 L516.2,172.8 L523.1,169.1 L530.0,165.2 L536.9,161.2 L543.8,157.2 L550.6,153.1 L557.5,148.8 L564.4,144.4 L571.2,140.0 L578.1,135.5 L585.0,130.8 L591.9,126.1 L598.8,121.2 L605.6,116.2 L612.5,111.2 L619.4,106.0 L626.2,100.8 L633.1,95.4 L640.0,90.0"/><circle cx="261.9" cy="241.2" r="4" style="fill:var(--ink);stroke:none"/><path style="stroke:var(--acc);stroke-width:2;fill:none" d="M261.9,241.2 L207.5,241.2"/><path style="fill:var(--acc);stroke:none" d="M201.9,241.2 L209.9,244.6 L209.9,237.9 Z"/><path style="stroke:var(--acc);stroke-width:2;fill:none" d="M261.9,241.2 L316.3,241.2"/><p