<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">The galloping ellipse</title><desc id="d">Across the span, looking from its first structure to its last: the wire at rest, the ellipse's major axis A tilted by theta from the vertical, its minor axis B and its centre c A above the wire at rest along the major axis.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="380"/><text x="20.0" y="26.0" class="t">The galloping ellipse (across the span)</text><path class="acc" style="fill:var(--acc);fill-opacity:.10" d="M304.0,103.1 L308.4,105.0 L312.5,107.7 L316.3,111.3 L319.7,115.5 L322.7,120.6 L325.4,126.3 L327.5,132.7 L329.3,139.6 L330.5,147.2 L331.3,155.2 L331.7,163.7 L331.5,172.5 L330.9,181.7 L329.7,191.1 L328.2,200.6 L326.1,210.2 L323.6,219.9 L320.7,229.5 L317.4,239.0 L313.8,248.2 L309.8,257.2 L305.4,265.9 L300.8,274.1 L296.0,281.9 L290.9,289.2 L285.7,295.8 L280.3,301.9 L274.8,307.2 L269.3,311.8 L263.8,315.7 L258.3,318.8 L252.9,321.1 L247.6,322.5 L242.5,323.2 L237.6,322.9 L232.9,321.9 L228.5,320.0 L224.3,317.3 L220.6,313.7 L217.1,309.5 L214.1,304.4 L211.5,298.7 L209.3,292.3 L207.6,285.4 L206.3,277.8 L205.5,269.8 L205.2,261.3 L205.4,252.5 L206.0,243.3 L207.1,233.9 L208.7,224.4 L210.7,214.8 L213.2,205.1 L216.1,195.5 L219.4,186.0 L223.1,176.8 L227.1,167.8 L231.4,159.1 L236.0,150.9 L240.9,143.1 L246.0,135.8 L251.2,129.2 L256.6,123.1 L262.0,117.8 L267.5,113.2 L273.1,109.3 L278.5,106.2 L283.9,103.9 L289.2,102.5 L294.3,101.8 L299.3,102.1 Z"/><path class="thin ds" d="M232.9,321.9 L304.0,103.1"/><path class="thin ds" d="M216.1,195.5 L320.7,229.5"/><path class="thin dt" d="M240,320 L240,81.5"/><circle cx="240" cy="300" r="7" class="wire" style="stroke-width:3;fill:var(--bg)"/><circle cx="268.4" cy="212.5" r="3.5" style="fill:var(--acc);stroke:none"/><path class="thin" d="M240.0,150.0 L241.2,150.0 L242.4,150.0 L243.5,150.0 L244.7,150.1 L245.9,150.1 L247.1,150.2 L248.2,150.2 L249.4,150.3 L250.6,150.4 L251.8,150.5 L252.9,150.6 L254.1,150.7 L255.3,150.8