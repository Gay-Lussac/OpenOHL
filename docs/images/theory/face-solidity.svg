<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">A face, its outline and its solidity ratio</title><desc id="d">Left: one face of a lattice body, its outline the convex hull of its joints with the area A_o, its extent h along z and its breadth b = A_o/h; the solidity ratio sums the members' silhouettes over A_o. Right: a waisted face, whose convex hull is larger than the face.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="400"/><text x="20.0" y="26.0" class="t">A face of the lattice: outline, breadth and solidity ratio</text><path class="fa" d="M90,340 L170,80 L290,80 L370,340 Z"/><path class="dash" d="M84,345 L165,75 L295,75 L376,345 Z"/><path class="st" d="M90,340 L170,80 M370,340 L290,80"/><path style="stroke:var(--ink);stroke-width:1.6" d="M90.0,340.0 L370.0,340.0 M90.0,340.0 L344.4,256.8 M370.0,340.0 L115.6,256.8"/><path style="stroke:var(--ink);stroke-width:1.6" d="M115.6,256.8 L344.4,256.8 M115.6,256.8 L322.0,184.0 M344.4,256.8 L138.0,184.0"/><path style="stroke:var(--ink);stroke-width:1.6" d="M138.0,184.0 L322.0,184.0 M138.0,184.0 L304.4,126.8 M322.0,184.0 L155.6,126.8"/><path style="stroke:var(--ink);stroke-width:1.6" d="M155.6,126.8 L304.4,126.8 M155.6,126.8 L290.0,80.0 M304.4,126.8 L170.0,80.0"/><path style="stroke:var(--ink);stroke-width:1.6" d="M170.0,80 L290,80"/><path style="stroke:var(--wire);stroke-width:4" d="M115.6,256.8 L322.0,184.0"/><path class="ldr" d="M270.4,202.2 L410.0,150.0"/><text x="414.0" y="154.0">member m: its silhouette</text><text x="414.0" y="168.0">d<tspan dy="4" style="font-size:78%">m</tspan><tspan dx="1.5" dy="-4"> L</tspan><tspan dy="4" style="font-size:78%">m</tspan><tspan dx="1.5" dy="-4"> sin θ</tspan><tspan dy="4" style="font-size:78%">m</tspan></text><path class="ldr" d="M168.0,76.0 L120.0,56.0"/><text x="124.0" y="60.0">outline: convex hull of the joints, area A<tspan dy="4" style="font-size:78%">o</tspan></text><path style="stroke:var(--muted);stroke-width:1.1;fill:none" d="M60.0,335.1 L60.0,84.9"/><path style="fill:var(--muted);stroke:none" d="M60.0,80.0 L57.1,87.0 L62.9,87.0 Z"/><path style="fill:var(--muted);stroke:none" d="M60.0,340.0 L62.9,333.0 L57.1,333.0 Z"/><text x="53.0" y="214.0" class="e">h</text><text x="410.0" y="228.0" class="t">φ = Σ d<tspan dy="4" style="font-size:78%">m</tspan><tspan dx="1.5" dy="-4"> L</tspan><tspan dy="4" style="font-size:78%">m</tspan><tspan dx="1.5" dy="-4"> sin θ</tspan><tspan dy="4" style="font-size:78%">m</tspan><tspan dx="1.5" dy="-4"> / A</tspan><tspan dy="4" style="font-size:78%">o</tspan></text><text x="410.0" y="254.0">breadth b = A<tspan dy="4" style="font-size:78%">o</tspan><tspan dx="1.5" dy="-4"> / h</tspan></text><text x="410.0" y="272.0" class="lab">(h: the extent along z, in the plane)</text><path class="dash" d="M604,345 L617,75 L723,75 L736,345 Z"/><path class="st" d="M610.0,340.0 L645.0,210.0 L622.0,80.0"/><path class="st" d="M718.0,80.0 L695.0,210.0 L730.0,340.0"/><path style="stroke:var(--ink);stroke-width:1.4" d="M622,80 L718,80 M645,210 L695,210 M610,340 L695,210 M730,340 L645,210 M645,210 L718,80 M695,210 L622,80"/><text x="670.0" y="368.0" class="c lab">a waisted face: the hull</text><text x="670.0" y="384.0" class="c lab">is larger, φ lower (Conservative)</text></svg>
