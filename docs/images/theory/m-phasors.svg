<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">Phase currents, phasor sums and the field's ellipse</title><desc id="d">Left: the three phase currents as phasors at 0, minus 120 and plus 120 degrees. Middle: at a point each wire adds its field per component, a phasor per component. Right: over a cycle the field vector traces an ellipse; the program reports the rms of the vector and also the ellipse's semi-major axis.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="360"/><text x="20.0" y="26.0" class="t">Phasors: the currents, their sum per component, the ellipse</text><circle cx="120.0" cy="170.0" r="80" style="fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3"/><path style="stroke:var(--wire);stroke-width:2.2;fill:none" d="M120.0,170.0 L194.4,170.0"/><path style="fill:var(--wire);stroke:none" d="M200.0,170.0 L192.0,173.4 L192.0,166.6 Z"/><text x="208.0" y="188.0">I<tspan dy="4" style="font-size:78%">L1</tspan><tspan dx="1.5" dy="-4"> 0°</tspan></text><path style="stroke:var(--wire2);stroke-width:2.2;fill:none" d="M120.0,170.0 L82.8,234.4"/><path style="fill:var(--wire2);stroke:none" d="M80.0,239.3 L81.1,230.7 L86.9,234.0 Z"/><text x="74.0" y="255.3" class="e">I<tspan dy="4" style="font-size:78%">L2</tspan><tspan dx="1.5" dy="-4"> −120°</tspan></text><path style="stroke:var(--wire3);stroke-width:2.2;fill:none" d="M120.0,170.0 L82.8,105.6"/><path style="fill:var(--wire3);stroke:none" d="M80.0,100.7 L86.9,106.0 L81.1,109.3 Z"/><text x="74.0" y="94.7" class="e">I<tspan dy="4" style="font-size:78%">L3</tspan><tspan dx="1.5" dy="-4"> +120°</tspan></text><text x="30.0" y="290.0" class="lab">balanced: the same rms current</text><text x="30.0" y="306.0" class="lab">in each phase, no harmonics</text><text x="270.0" y="70.0">At a point p, per component:</text><text x="270.0" y="96.0">B<tspan dy="4" style="font-size:78%">x</tspan><tspan dx="1.5" dy="-4"> = Σ</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4"> b</tspan><tspan dy="4" style="font-size:78%">x,k</tspan><tspan dx="1.5" dy="-4"> I</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4">&#8203;</tspan></text><text x="270.0" y="118.0">B<tspan dy="4" style="font-size:78%">y</tspan><tspan dx="1.5" dy="-4"> = Σ</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4"> b</tspan><tspan dy="4" style="font-size:78%">y,k</tspan><tspan dx="1.5" dy="-4"> I</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4">&#8203;</tspan></text><text x="270.0" y="140.0">B<tspan dy="4" style="font-size:78%">z</tspan><tspan dx="1.5" dy="-4"> = Σ</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4"> b</tspan><tspan dy="4" style="font-size:78%">z,k</tspan><tspan dx="1.5" dy="-4"> I</tspan><tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4">&#8203;</tspan></text><text x="270.0" y="166.0" class="lab">b<tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4">: each piece's closed form</tspan></text><text x="270.0" y="182.0" class="lab">per ampere (real); I<tspan dy="4" style="font-size:78%">k</tspan><tspan dx="1.5" dy="-4"> complex</tspan></text><text x="270.0" y="216.0">Reported (the rms of the vector):</text><text x="270.0" y="240.0" class="t">B = √(|B<tspan dy="4" style="font-size:78%">x</tspan><tspan dx="1.5" dy="-4">|² + |B</tspan><tspan dy="4" style="font-size:78%">y</tspan><tspan dx="1.5" dy="-4">|² + |B</tspan><tspan dy="4" style="font-size:78%">z</tspan><tspan dx="1.5" dy="-4">|²)</tspan></text><text x="270.0" y="270.0">Several frequencies:</text><text x="270.0" y="290.0">B = √(B<tspan dy="4" style="font-size:78%">16.7</tspan><tspan dx="1.5" dy="-4">² + B</tspan><tspan dy="4" style="font-size:78%">50</tspan><tspan dx="1.5" dy="-4">²)</tspan></text><path class="acc" d="M705.0,150.0 L705.9,152.9 L706.6,155.9 L707.1,158.9 L707.3,162.0 L707.3,165.1 L707.0,168.2 L706.5,171.4 L705.8,174.5 L704.8,177.7 L703.6,180.8 L702.2,184.0 L700.5,187.1 L698.6,190.2 L696.5,193.2 L694.2,196.2 L691.7,199.1 L689.0,202.0 L686.1,204.8 L683.1,207.5 L679.8,210.1 L676.4,212.7 L672.8,215.1 L669.1,217.4 L665.3,219.6 L661.3,221.7 L657.2,223.6 L653.1,225.4 L648.8,227.1 L644.4,228.6 L640.0,230.0 L635.5,231.2 L631.0,232.3 L626.5,233.2 L621.9,234.0 L617.3,234.6 L612.8,235.0 L608.2,235.3 L603.7,235.4 L599.2,235.4 L594.8,235.1 L590.5,234.7 L586.2,234.2 L582.1,233.5 L578.0,232.6