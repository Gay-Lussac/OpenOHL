90.0,60.0"/><text x="686.0" y="64.0" class="e">circumscribed polygon</text><text x="686.0" y="78.0" class="e lab">(72 sides; 12 drawn)</text><text x="20.0" y="348.0" class="lab">Clearance: the distance less each wire's outer radius (bundle radius, conductor radius, iced in a case with</text><text x="20.0" y="364.0" class="lab">ice, the polyline's bound); 0 when they overlap. Conservative: the polygons hold the ellipses, so the</text><text x="20.0" y="380.0" class="lab">gap found is never more than between the true ellipses.</text></svg>
