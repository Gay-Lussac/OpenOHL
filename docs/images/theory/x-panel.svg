<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">An X-braced panel with tension-only diagonals</title><desc id="d">A panel four wide and three high, pinned at its feet, loaded by H across at a top corner. Left, diagonals without a second moment: one carries 5H/4 in tension, the other is slack. Right, with a second moment: the compressed one is bowed at N_cr, the other carries 5H/4 − N_cr.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><style>.fw{fill:var(--wire);fill-opacity:.16;stroke:none}.fa{fill:var(--acc);fill-opacity:.14;stroke:none}.f2{fill:var(--wire2);fill-opacity:.16;stroke:none}.f3{fill:var(--wire3);fill-opacity:.16;stroke:none}.fi{fill:var(--ink);fill-opacity:.10;stroke:none}.gnd{stroke:var(--muted);stroke-width:1.6;fill:none}.acc{stroke:var(--acc);stroke-width:1.8;fill:none}.w2l{stroke:var(--wire2);stroke-width:1.8;fill:none}.w3l{stroke:var(--wire3);stroke-width:1.8;fill:none}.inkl{stroke:var(--ink);stroke-width:1.4;fill:none}.ds{stroke-dasharray:5 4}.dt{stroke-dasharray:2 3}.i{font-style:italic}.sm{font-size:11px}</style><rect class="bg" width="760" height="340"/><text x="20.0" y="26.0" class="t">An X-braced panel under a horizontal load H</text><text x="200.0" y="70.0" class="c">diagonals without a second moment</text><path class="st" d="M100,250 L100,100 L300,100 L300,250"/><path style="stroke:var(--acc);stroke-width:3.2" d="M100,250 L300,100"/><path style="stroke:var(--wire3);stroke-width:2;stroke-dasharray:6 4" d="M100,100 L300,250"/><text x="240.0" y="178.0">slack</text><text x="178.0" y="228.0">5H/4</text><path class="st" style="stroke-width:1.8" d="M100,250 L91,265 L109,265 Z"/><path class="st" style="stroke-width:1.8" d="M300,250 L291,265 L309,265 Z"/><circle cx="100.0" cy="250.0" r="3.5" style="fill:var(--ink);stroke:none"/><circle cx="300.0" cy="250.0" r="3.5" style="fill:var(--ink);stroke:none"/><circle cx="100.0" cy="100.0" r="3.5" style="fill:var(--ink);stroke:none"/><circle cx="300.0" cy="100.0" r="3.5" style="fill:var(--ink);stroke:none"/><path style="stroke:var(--ink);stroke-width:2.2;fill:none" d="M30.0,100.0 L87.7,100.0"/><path style="fill:var(--ink);stroke:none" d="M94.0,100.0 L85.0,96.2 L85.0,103.8 Z"/><text x="28.0" y="92.0">H</text><text x="200.0" y="284.0" class="c lab">4</text><text x="86.0" y="179.0" class="e lab">3</text><text x="540.0" y="70.0" class="c">diagonals with a second moment</text><path class="st" d="M440,250 L440,100 L640,100 L640,250"/><path style="stroke:var(--acc);stroke-width:3.2" d="M440,250 L640,100"/><path style="stroke:var(--wire);stroke-width:2.6;fill:none" d="M440,100 Q556.0,155.0 640,250"/><path class="ldr" d="M570.0,169.0 L654.0,145.0"/><text x="658.0" y="149.0">bowed: N<tspan dy="4" style="font-size:78%">cr</tspan></text><text x="518.0" y="228.0">5H/4 − N<tspan dy="4" style="font-size:78%">cr</tspan></text><path class="st" style="stroke-width:1.8" d="M440,250 L431,265 L449,265 Z"/><path class="st" style="stroke-width:1.8" d="M640,250 L631,265 L649,265 Z"/><circle cx="440.0" cy="250.0" r="3.5" style="fill:var(--ink);stroke:none"/><circle cx="640.0" cy="250.0" r="3.5" style="fill:var(--ink);stroke:none"/><circle cx="440.0" cy="100.0" r="3.5" style="fill:var(--ink);stroke:none"/><circle cx="640.0" cy="100.0" r="3.5" style="fill:var(--ink);stroke:none"/><path style="stroke:var(--ink);stroke-width:2.2;fill:none" d="M370.0,100.0 L427.7,100.0"/><path style="fill:var(--ink);stroke:none" d="M434.0,100.0 L425.0,96.2 L425.0,103.8 Z"/><text x="368.0" y="92.0">H</text><text x="540.0" y="284.0" class="c lab">4</text><text x="426.0" y="179.0" class="e lab">3</text><text x="20.0" y="318.0" class="lab">By the method of joints: the stretched diagonal (length 5) takes the load H across; with the bowed one at N<tspan dy="4" style="font-size:78%">cr</tspan><tspan dx="1.5" dy="-4">, the rest.</tspan></text></svg>
