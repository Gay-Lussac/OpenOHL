<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660" role="img" aria-labelledby="t d"><title id="t">The set numbers of the starter's structures</title><desc id="d">Left, a suspension structure seen looking ahead along the line: one string per phase, set 1 for L1 (left, lower crossarm), set 2 for L2 (right, upper), set 3 for L3 (right, lower), set 19 for the earth wire at the peak. Right, a tension structure: two strings at each place, sets 21, 22, 23 and 39 towards the span behind, 41, 42, 43 and 59 towards the span ahead. Below, seen from the side, the four clicks of section S1: T1 set 41, T2 set 1, T3 set 1, T4 set 21, then Enter.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="860" height="660"/><text x="20.0" y="26.0" class="t">The set numbers: which string a click picks</text><text x="20.0" y="56.0" class="t">Suspension structure (T2, T3, T5)</text><text x="20.0" y="74.0" class="lab">looking ahead along the line</text><path class="st" d="M199,330.0 L210,109.0 L220,109.0 L231,330.0 M203,290.0 L227,250.0 M227,290.0 L203,250.0"/><path class="st" d="M105,187.0 L325,187.0"/><path class="st" d="M215,148.0 L303,148.0"/><path class="dash" d="M75,330.0 L355,330.0"/><path class="str" d="M105,187.0 L105,209.0"/><circle class="ap" cx="105" cy="187.0" r="4.5"/><circle cx="105.0" cy="209.0" r="5.5" style="fill:var(--wire)"/><text x="95.0" y="214.0" class="e">set 1 · L1</text><path class="str" d="M303,148.0 L303,170.0"/><circle class="ap" cx="303" cy="148.0" r="4.5"/><circle cx="303.0" cy="170.0" r="5.5" style="fill:var(--wire2)"/><text x="313.0" y="175.0">set 2 · L2</text><path class="str" d="M325,187.0 L325,209.0"/><circle class="ap" cx="325" cy="187.0" r="4.5"/><circle cx="325.0" cy="209.0" r="5.5" style="fill:var(--wire3)"/><text x="335.0" y="214.0">set 3 · L3</text><circle cx="215.0" cy="103.0" r="5.5" style="fill:var(--ink)"/><text x="227.0" y="107.0">set 19 · earth wire</text><text x="445.0" y="56.0" class="t">Tension structure (T1, T4, T6)</text><text x="445.0" y="74.0" class="lab">looking ahead: two strings at each place</text><path class="st" d="M624,330.0 L635,109.0 L645,109.0 L656,330.0 M628,290.0 L652,250.0 M652,290.0 L628,250.0"/><path class="st" d="M530,187.0 L750,187.0"/><path class="st" d="M640,148.0 L728,148.0"/><path class="dash" d="M500,330.0 L780,330.0"/><path class="str" d="M530,187.0 L556,172.0"/><path class="str" d="M530,187.0 L502,203.0"/><circle cx="556.0" cy="172.0" r="5" style="fill:var(--wire)"/><circle cx="502.0" cy="203.0" r="5" style="fill:var(--wire)"/><circle class="ap" cx="530" cy="187.0" r="4.5"/><text x="565.0" y="176.0">41</text><text x="493.0" y="207.0" class="e">21