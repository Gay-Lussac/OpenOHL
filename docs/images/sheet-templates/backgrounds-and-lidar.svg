<svg class="f" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500"><style>svg.f{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--acc2:#bc4c00;--ok:#1a7f37;--bg:#ffffff;--fill:#eef1f4;--line:#8c959f;}@media (prefers-color-scheme: dark){svg.f{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--acc2:#f0883e;--ok:#3fb950;--bg:#0d1117;--fill:#1c2128;--line:#6e7681;}}svg.f text.t{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}svg.f text.m{fill:var(--muted)}svg.f text.a{fill:var(--acc)}svg.f text.b{fill:var(--acc2)}svg.f text.o{fill:var(--ok)}svg.f text.c{font-family:ui-monospace,Menlo,Consolas,monospace}svg.f text.k{font-weight:600}svg.f .l{stroke:var(--ink);fill:none}svg.f .lm{stroke:var(--line);fill:none}svg.f .la{stroke:var(--acc);fill:none}svg.f .lb{stroke:var(--acc2);fill:none}svg.f .lo{stroke:var(--ok);fill:none}svg.f .fi{fill:var(--fill)}svg.f .fa{fill:var(--acc)}svg.f .fb{fill:var(--acc2)}svg.f .fo{fill:var(--ok)}svg.f .bg{fill:var(--bg)}svg.f .fk{fill:var(--ink)}</style><rect class="bg" width="860" height="500"/><text class="t k" x="20.0" y="24.0" font-size="14" text-anchor="start">[plan_background]: the ground is straightened along the line, like everything on the plan</text><text class="t m" x="50.0" y="62.0" font-size="12" text-anchor="start">on the ground</text><line class="l" x1="50.0" y1="150.0" x2="190.0" y2="150.0" stroke-width="2"/><line class="l" x1="190.0" y1="150.0" x2="360.0" y2="80.0" stroke-width="2"/><line class="lm" x1="95.0" y1="72.0" x2="110.0" y2="215.0" stroke-width="1"/><line class="lm" x1="163.0" y1="72.0" x2="170.0" y2="215.0" stroke-width="1"/><line class="lm" x1="240.0" y1="72.0" x2="280.0" y2="190.0" stroke-width="1"/><line class="lm" x1="305.0" y1="72.0" x2="345.0" y2="175.0" stroke-width="1"/><text class="t k" x="50.0" y="175.0" font-size="12" text-anchor="start">axis</text><text class="t b" x="232.0" y="172.0" font-size="12" text-anchor="start">bend</text><line class="lb