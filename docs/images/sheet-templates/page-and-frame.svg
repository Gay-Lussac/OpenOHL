padding</text><text class="t k" x="171.0" y="169.0" font-size="14" text-anchor="start">Everything of the sheet stays inside the dashed line:</text><text class="t " x="171.0" y="191.0" font-size="13" text-anchor="start">the panels, title block, legend, key map, scale bars and notes.</text><text class="t m" x="171.0" y="227.0" font-size="13" text-anchor="start">A wide left margin is the binding edge.</text><text class="t m" x="171.0" y="249.0" font-size="13" text-anchor="start">Lengths on paper carry their unit: "10 mm", "1 cm" (a bare number is mm).</text></svg>
