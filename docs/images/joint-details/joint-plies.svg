<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 320" width="1208" height="320" role="img" aria-labelledby="t d"><title id="t">How member ends meet</title><desc id="d">Three cases in section. A: an angle nested heel into heel inside a larger one, a bolt through both legs, one shear plane between them. B: an angle's leg between an outer cover and an inner cover clear of the root fillet, a bolt through the three, two shear planes. C: one bar running on through the joint, the work point on its axis, no cut and no bolt.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.steel{fill:var(--fill)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--ink);stroke-width:1.4;fill:none;stroke-dasharray:9 5}.faint{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:3 3}.onto{stroke:var(--muted);stroke-width:7;fill:none;opacity:0.35}.dim{stroke:var(--acc);stroke-width:1.3;fill:none}.arr{fill:var(--acc)}.bolt{fill:var(--bg);stroke:var(--ink);stroke-width:1.8}.bolt2{fill:var(--bg);stroke:var(--muted);stroke-width:1.4}.wp{fill:var(--ink)}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.val{fill:var(--acc)}.t{font-weight:600;font-size:14px}</style><rect class="bg" width="1208" height="320"/><text x="8" y="20" class="t">How member ends meet (in section)</text><polygon class="steel" points="4.0,258.0 228.0,258.0 228.0,242.0 4.0,242.0"/><polygon class="steel" points="4.0,258.0 20.0,258.0 20.0,34.0 4.0,34.0"/><polygon class="steel" points="20.0,242.0 196.0,242.0 196.0,229.2 20.0,229.2"/><polygon class="steel" points="20.0,242.0 32.8,242.0 32.8,66.0 20.0,66.0"/><polyline class="st" points="4.0,258.0 228.0,258.0 228.0,242.0 4.0,242.0 4.0,258.0"/><polyline class="st" points="4.0,258.0 20.0,258.0 20.0,34.0 4.0,34.0 4.0,258.0"/><polyline class="st" points="20.0,242.0 196.0,242.0 196.0,229.2 20.0,229.2 20.0,242.0"/><polyline class="st" points="20.0,242.0 32.8,242.0 32.8,66.0 20.0,66.0 20.0,242.0"/><polyline class="st" points="117.6,267.6 130.4,267.6 130.4,219.6 117.6,219.6 117.6,267.6"/><polyline class="st" points="108.0,229.2 140.0,229.2 140.0,219.6 108.0,219.6 108.0,229.2"/><polyline class="st" points="108.0,267.6 140.0,267.6 140.0,258.0 108.0,258.0 108.0,267.6"/><polyline class="dash" points="92.0,242.0 244.0,242.0"/><text x="251.2" y="246.0" class="lab">shear plane</text><text x="81.0" y="298.6" class="val">A — nested</text><polygon class="steel" points="404.0,258.0 628.0,258.0 628.0,242.0 404.0,242.0"/><polygon class="steel" points="404.0,258.0 420.0,258.0 420.0,34.0 404.0,34.0"/><polygon class="steel" points="404.0,274.0 628.0,274.0 628.0,258.0 404.0,258.0"/><polygon class="steel" points="444.0,242.0 628.0,242.0 628.0,226.0 444.0,226.0"/><polyline class="st" points="404.0,258.0 628.0,258.0 628.0,242.0 404.0,242.0 404.0,258.0"/><polyline class="st" points="404.0,258.0 420.0,258.0 420.0,34.0 404.0,34.0 404.0,258.0"/><polyline class="st" points="404.0,274.0 628.0,274.0 628.0,258.0 404.0,258.0 404.0,274.0"/><polyline class="st" points="444.0,242.0 628.0,242.0 628.0,226.0 444.0,226.0 444.0,242.0"/><polyline class="st" points="533.6,283.6 546.4,283.6 546.4,216.4 533.6,216.4 533.6,283.6"/><polyline class="st" points="524.0,226.0 556.0,226.0 556.0,216.4 524.0,216.4 524.0,226.0"/><polyline class="st" points="524.0,283.6 556.0,283.6 556.0,274.0 524.0,274.0 524.0,283.6"/><polyline class="dash" points="508.0,258.0 572.0,258.0"/><polyline class="dash" points="508.0,242.0 572.0,242.0"/><text x="635.2" y="214.0" class="lab">inner cover</text><text x="635.2" y="274.8" class="lab">outer cover</text><text x="460.0" y="311.