<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 412" width="813" height="412" role="img" aria-labelledby="t d"><title id="t">What the values of a member end mean</title><desc id="d">The bolted leg of an angle seen flat, from its heel to its edge, its end where the steel stops; the member's axis runs past that end to beside the work point. Dimensioned: the gauge from the heel to the gauge line, the edge distance from it to the leg's edge, the pitch between bolts, the end distance from the last bolt to the member's end, the eccentricity e from the axis to the gauge line, where the steel stops from the work point, and the shift of the axis beside the work point towards what the member bolts onto; a second gauge line faint.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.steel{fill:var(--fill)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--ink);stroke-width:1.4;fill:none;stroke-dasharray:9 5}.faint{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:3 3}.onto{stroke:var(--muted);stroke-width:7;fill:none;opacity:0.35}.dim{stroke:var(--acc);stroke-width:1.3;fill:none}.arr{fill:var(--acc)}.bolt{fill:var(--bg);stroke:var(--ink);stroke-width:1.8}.bolt2{fill:var(--bg);stroke:var(--muted);stroke-width:1.4}.wp{fill:var(--ink)}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.val{fill:var(--acc)}.t{font-weight:600;font-size:14px}</style><rect class="bg" width="813" height="412"/><text x="8" y="20" class="t">What the values of a member end mean (the leg bolted, seen flat)</text><polygon class="steel" points="120.6,347.4 520.6,