<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">The radial clearance check, step by step</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale. What one Run does for every span and every rule (docs/user-guide/radial-clearances.md).</text>

  <!-- 1 weather cases -->
  <rect x="20" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="30" y="90" font-weight="bold">1  Weather cases</text>
  <rect x="35" y="105" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="121">max. temperature</text>
  <rect x="35" y="133" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="149">ice</text>
  <rect x="35" y="161" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="177">high wind 600 Pa</text>
  <text x="30" y="210" fill="#555" font-size="12">the cases the rules</text>
  <text x="30" y="225" fill="#555" font-size="12">name (none named:</text>
  <text x="30" y="240" fill="#555" font-size="12">every case)</text>

  <!-- 2 wire positions -->
  <rect x="185" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="195" y="90" font-weight="bold">2  Wire positions</text>
  <circle cx="260" cy="115" r="4" fill="#555"/>
  <text x="270" y="119" fill="#555" font-size="11">axis</text>
  <path d="M215,185 A70,70 0 0,0 305,185" fill="none" stroke="#2e86c1" stroke-width="10" stroke-opacity="0.25"/>
  <path d="M215,185 A70,70 0 0,0 305,185" fill="none" stroke="#2e86c1" stroke-dasharray="4,3"/>
  <line x1="260" y1="115" x2="260" y2="185" stroke="#999"/>
  <line x1="260" y1="115" x2="213" y2="167" stroke="#999"/>
  <line x1="260" y1="115" x2="307" y2="167" stroke="#999"/>
  <circle cx="260" cy="185" r="5" fill="#1f618d"/>
  <circle cx="213" cy="167" r="5" fill="#1f618d"/>
  <circle cx="307" cy="167" r="5" fill="#1f618d"/>
  <text x="195" y="215" fill="#555" font-size="12">still air, blown left and</text>
  <text x="195" y="230" fill="#555" font-size="12">right; the swing arc (band)</text>
  <text x="195" y="245" fill="#555" font-size="12">between them, widened by</text>
  <text x="195" y="260" fill="#555" font-size="12">the band margin; or the</text>
  <text x="195" y="275" fill="#555" font-size="12">wind steps</text>

  <!-- 3 the distance in any direction -->
  <rect x="350" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="360" y="90" font-weight="bold">3  Any direction</text>
  <circle cx="425" cy="160" r="45" fill="#f39c12" fill-opacity="0.10" stroke="#f39c12" stroke-dasharray="5,4"/>
  <circle cx="425" cy="160" r="5" fill="#1f618d"/>
  <line x1="425" y1="160" x2="458" y2="190" stroke="#b9770e" marker-end="url(#g)"/>
  <line x1="425" y1="160" x2="384" y2="181" stroke="#b9770e" marker-end="url(#g)"/>
  <line x1="425" y1="160" x2="425" y2="114" stroke="#b9770e" marker-end="url(#g)"/>
  <text x="360" y="230" fill="#555" font-size="12">no zone to set: the</text>
  <text x="360" y="245" fill="#555" font-size="12">shortest 3D distance from</text>
  <text x="360" y="260" fill="#555" font-size="12">each subconductor, below,</text>
  <text x="360" y="275" fill="#555" font-size="12">beside or above the wire</text>

  <!-- 4 targets -->
  <rect x="515" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="525" y="90" font-weight="bold">4  What is near</text>
  <path d="M525,215 L560,205 L600,212 L630,200 L655,207" fill="none" stroke="#7d6608" stroke-width="2"/>
  <circle cx="570" cy="175" r="3" fill="#27ae60"/>
  <circle cx="585" cy="160" r="3" fill="#27ae60"/>
  <circle cx="600" cy="170" r="3" fill="#27ae60"/>
  <rect x="615" y="150" width="25" height="52" fill="#d5d8dc" stroke="#7f8c8d"/>
  <text x="525" y="240" fill="#555" font-size="12">the ground (terrain or a</text>
  <text x="525" y="255" fill="#555" font-size="12">TIN layer) and the LiDAR</text>
  <text x="525" y="270" fill="#555" font-size="12">points of the rule's</text>
  <text x="525" y="285" fill="#555" font-size="12">classes near the wires</text>

  <!-- 5 rule -->
  <rect x="680" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="690" y="90" font-weight="bold">5  The rule</text>
  <circle cx="725" cy="125" r="5" fill="#1f618d"/>
  <rect x="790" y="150" width="25" height="60" fill="#d5d8dc" stroke="#7f8c8d"/>
  <line x1="731" y1="129" x2="786" y2="160" stroke="#555" marker-end="url(#g)"/>
  <text x="745" y="132" font-size="12">found</text>
  <circle cx="725" cy="125" r="42" fill="none" stroke="#c0392b" stroke-dasharray="4,3"/>
  <text x="700" y="185" fill="#c0392b" font-size="12">req.</text>
  <text x="690" y="245" fill="#555" font-size="12">found in 3D, to the</text>
  <text x="690" y="260" fill="#555" font-size="12">conductor's surface,</text>
  <text x="690" y="275" fill="#555" font-size="12">compared with the rule's</text>
  <text x="690" y="290" fill="#555" font-size="12">distance at the wire's</text>
  <text x="690" y="305" fill="#555" font-size="12">voltage</text>

  <!-- 6 results -->
  <rect x="845" y="70" width="135" height="250" fill="none" stroke="#ccc"/>
  <text x="855" y="90" font-weight="bold">6  Results</text>
  <rect x="855" y="105" width="115" height="20" fill="#fdedec" stroke="#c0392b"/>
  <text x="860" y="120" fill="#c0392b" font-size="12">✖ S1 span 3 −0.42 m</text>
  <rect x="855" y="130" width="115" height="20" fill="#fff" stroke="#ccc"/>
  <text x="860" y="145" font-size="12">S2 span 1 −0.10 m</text>
  <line x1="875" y1="175" x2="925" y2="225" stroke="#c0392b" stroke-width="3"/>
  <circle cx="875" cy="175" r="4" fill="#1f618d"/>
  <circle cx="925" cy="225" r="4" fill="#c0392b"/>
  <text x="900" y="190" fill="#c0392b" font-size="12">red mark</text>
  <text x="855" y="260" fill="#555" font-size="12">a row per span below</text>
  <text x="855" y="275" fill="#555" font-size="12">a rule, worst first; a</text>
  <text x="855" y="290" fill="#555" font-size="12">red mark in the views</text>

  <!-- arrows -->
  <line x1="95" y1="340" x2="912" y2="340" stroke="#555" marker-end="url(#g)"/>
  <text x="20" y="370" fill="#555">Every rule, every weather case it applies in, every wind position of that case, every span (and jumper) it checks:</text>
  <text x="20" y="388" fill="#555">the smallest margin (found − required) is kept per span and rule. A negative margin is a finding: a row in the Results tab</text>
  <text x="20" y="406" fill="#555">and a red mark drawn from the wire to the target.</text>
</svg>
