<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">The wire clearance check, step by step</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale. What one Run does for every rule between the wires of the line (docs/user-guide/wire-clearances.md).</text>

  <!-- 1 weather cases -->
  <rect x="20" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="30" y="90" font-weight="bold">1  Weather cases</text>
  <rect x="35" y="105" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="121">max. temperature</text>
  <rect x="35" y="133" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="149">ice</text>
  <rect x="35" y="161" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="177">high wind 600 Pa</text>
  <text x="30" y="210" fill="#555" font-size="12">every case the rules</text>
  <text x="30" y="225" fill="#555" font-size="12">name (none named:</text>
  <text x="30" y="240" fill="#555" font-size="12">every case), less those</text>
  <text x="30" y="255" fill="#555" font-size="12">ticked out in 2 Scope;</text>
  <text x="30" y="270" fill="#555" font-size="12">case pairs: two cases</text>

  <!-- 2 wind positions: one wind swings both -->
  <rect x="185" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="195" y="90" font-weight="bold">2  Wind positions</text>
  <circle cx="230" cy="110" r="4" fill="#555"/>
  <circle cx="290" cy="110" r="4" fill="#555"/>
  <line x1="230" y1="110" x2="230" y2="170" stroke="#999"/>
  <line x1="230" y1="110" x2="265" y2="160" stroke="#999"/>
  <line x1="290" y1="110" x2="290" y2="180" stroke="#999"/>
  <line x1="290" y1="110" x2="320" y2="168" stroke="#999"/>
  <circle cx="230" cy="170" r="5" fill="#1f618d"/>
  <circle cx="265" cy="160" r="5" fill="#1f618d" fill-opacity="0.5"/>
  <circle cx="290" cy="180" r="5" fill="#1f618d"/>
  <circle cx="320" cy="168" r="5" fill="#1f618d" fill-opacity="0.5"/>
  <line x1="200" y1="135" x2="222" y2="135" stroke="#555" marker-end="url(#g)"/>
  <text x="195" y="128" fill="#555" font-size="11">wind</text>
  <text x="195" y="215" fill="#555" font-size="12">each case's own wind</text>
  <text x="195" y="230" fill="#555" font-size="12">from the sides chosen;</text>
  <text x="195" y="245" fill="#555" font-size="12">or the wind steps; or</text>
  <text x="195" y="260" fill="#555" font-size="12">the swing arc: one wind</text>
  <text x="195" y="275" fill="#555" font-size="12">swings all wires together</text>

  <!-- 3 wire pairs -->
  <rect x="350" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="360" y="90" font-weight="bold">3  Wire pairs</text>
  <circle cx="425" cy="110" r="5" fill="#7f8c8d"/>
  <text x="435" y="114" fill="#555" font-size="11">earth wire</text>
  <circle cx="390" cy="140" r="5" fill="#1f618d"/>
  <circle cx="390" cy="170" r="5" fill="#1f618d"/>
  <circle cx="390" cy="200" r="5" fill="#1f618d"/>
  <circle cx="460" cy="140" r="5" fill="#b9770e"/>
  <circle cx="460" cy="170" r="5" fill="#b9770e"/>
  <circle cx="460" cy="200" r="5" fill="#b9770e"/>
  <line x1="390" y1="140" x2="390" y2="170" stroke="#555" stroke-dasharray="3,2"/>
  <line x1="390" y1="170" x2="460" y2="170" stroke="#555" stroke-dasharray="3,2"/>
  <line x1="425" y1="110" x2="390" y2="140" stroke="#555" stroke-dasharray="3,2"/>
  <text x="360" y="230" fill="#555" font-size="12">phase to phase, circuit</text>
  <text x="360" y="245" fill="#555" font-size="12">to circuit, phase to</text>
  <text x="360" y="260" fill="#555" font-size="12">earth wire; the same</text>
  <text x="360" y="275" fill="#555" font-size="12">phase only when asked</text>

  <!-- 4 the distance -->
  <rect x="515" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="525" y="90" font-weight="bold">4  The distance</text>
  <circle cx="560" cy="130" r="12" fill="#eef3f8" stroke="#1f618d"/>
  <circle cx="620" cy="185" r="9" fill="#eef3f8" stroke="#b9770e"/>
  <line x1="569" y1="139" x2="613" y2="179" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="600" y="145" fill="#c0392b" font-size="12">d</text>
  <text x="525" y="225" fill="#555" font-size="12">surface to surface:</text>
  <text x="525" y="240" fill="#555" font-size="12">radial in any direction,</text>
  <text x="525" y="255" fill="#555" font-size="12">vertical where the two</text>
  <text x="525" y="270" fill="#555" font-size="12">wires cross in plan;</text>
  <text x="525" y="285" fill="#555" font-size="12">exclusions left out</text>

  <!-- 5 rule -->
  <rect x="680" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="690" y="90" font-weight="bold">5  The rule</text>
  <rect x="695" y="105" width="120" height="70" fill="#fff" stroke="#ccc"/>
  <text x="702" y="122" font-size="12">up to 0 kV: 0.5 m</text>
  <text x="702" y="140" font-size="12">up to 150 kV: 2.0 m</text>
  <text x="702" y="158" font-size="12">up to 420 kV: 3.5 m</text>
  <text x="690" y="200" fill="#c0392b" font-size="12">found d &lt; required?</text>
  <text x="690" y="230" fill="#555" font-size="12">the rule's distance at</text>
  <text x="690" y="245" fill="#555" font-size="12">the pair's voltage (the</text>
  <text x="690" y="260" fill="#555" font-size="12">higher, the sum or the</text>
  <text x="690" y="275" fill="#555" font-size="12">voltage between them)</text>

  <!-- 6 results -->
  <rect x="845" y="70" width="135" height="250" fill="none" stroke="#ccc"/>
  <text x="855" y="90" font-weight="bold">6  Results</text>
  <rect x="855" y="105" width="115" height="20" fill="#fdedec" stroke="#c0392b"/>
  <text x="860" y="120" fill="#c0392b" font-size="12">✖ S2 span 3 −1.54</text>
  <rect x="855" y="130" width="115" height="20" fill="#fff" stroke="#ccc"/>
  <text x="860" y="145" font-size="12">S1 span 1 −0.20</text>
  <line x1="875" y1="175" x2="925" y2="225" stroke="#c0392b" stroke-width="3"/>
  <circle cx="875" cy="175" r="4" fill="#1f618d"/>
  <circle cx="925" cy="225" r="4" fill="#b9770e"/>
  <text x="900" y="190" fill="#c0392b" font-size="12">red mark</text>
  <text x="855" y="260" fill="#555" font-size="12">a row per rule, measure</text>
  <text x="855" y="275" fill="#555" font-size="12">and wire pair below it,</text>
  <text x="855" y="290" fill="#555" font-size="12">worst first</text>

  <!-- arrows -->
  <line x1="95" y1="340" x2="912" y2="340" stroke="#555" marker-end="url(#g)"/>
  <text x="20" y="370" fill="#555">Every rule, every weather case (or case pair) it applies in, every wind position, every pair of wires it takes:</text>
  <text x="20" y="388" fill="#555">the lowest clearance over every position is kept per rule, measure and wire pair. Below the rule's distance it is a</text>
  <text x="20" y="406" fill="#555">finding: a row in the Results tab and a red mark drawn between the two wires.</text>
</svg>
