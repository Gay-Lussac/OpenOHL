<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">The lightning shielding check, step by step</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale. What one Run does for every rule, every weather case it applies in and every span (docs/user-guide/lightning-shielding.md).</text>

  <!-- 1 weather cases -->
  <rect x="20" y="70" width="180" height="250" fill="none" stroke="#ccc"/>
  <text x="30" y="90" font-weight="bold">1  Weather cases</text>
  <rect x="35" y="105" width="150" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="121">phases: max. temp.</text>
  <rect x="35" y="133" width="150" height="22" fill="#eef7ee" stroke="#5e9b62"/>
  <text x="42" y="149">shielding: everyday</text>
  <text x="30" y="180" fill="#555" font-size="12">the cases each rule names</text>
  <text x="30" y="195" fill="#555" font-size="12">(none: every case); the</text>
  <text x="30" y="210" fill="#555" font-size="12">shielding wires in the same</text>
  <text x="30" y="225" fill="#555" font-size="12">case, or in cases of their</text>
  <text x="30" y="240" fill="#555" font-size="12">own; each case solved once</text>
  <text x="30" y="255" fill="#555" font-size="12">per calculation asked</text>

  <!-- 2 wires solved -->
  <rect x="215" y="70" width="180" height="250" fill="none" stroke="#ccc"/>
  <text x="225" y="90" font-weight="bold">2  The wires solved</text>
  <line x1="235" y1="105" x2="235" y2="200" stroke="#555" stroke-width="2"/>
  <line x1="375" y1="105" x2="375" y2="200" stroke="#555" stroke-width="2"/>
  <line x1="226" y1="125" x2="244" y2="125" stroke="#555" stroke-width="2"/>
  <line x1="366" y1="125" x2="384" y2="125" stroke="#555" stroke-width="2"/>
  <path d="M235,107 Q305,140 375,107" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <path d="M235,128 Q305,185 375,128" fill="none" stroke="#1f618d" stroke-width="2"/>
  <line x1="225" y1="200" x2="385" y2="200" stroke="#8b6b45" stroke-width="1.5"/>
  <text x="305" y="139" fill="#2e7d32" font-size="11" text-anchor="middle">shielding wire</text>
  <text x="305" y="172" fill="#1f618d" font-size="11" text-anchor="middle">phase</text>
  <text x="225" y="225" fill="#555" font-size="12">each section by its own</text>
  <text x="225" y="240" fill="#555" font-size="12">calculation or the rule's;</text>
  <text x="225" y="255" fill="#555" font-size="12">phases: sections with a</text>
  <text x="225" y="270" fill="#555" font-size="12">system; shielding wires:</text>
  <text x="225" y="285" fill="#555" font-size="12">earthed wires (or types)</text>

  <!-- 3 cross-sections -->
  <rect x="410" y="70" width="180" height="250" fill="none" stroke="#ccc"/>
  <text x="420" y="90" font-weight="bold">3  Cross-sections</text>
  <rect x="425" y="140" width="10" height="10" fill="#eee" stroke="#555"/>
  <rect x="565" y="140" width="10" height="10" fill="#eee" stroke="#555"/>
  <line x1="430" y1="138" x2="570" y2="138" stroke="#2e7d32" stroke-width="2"/>
  <line x1="430" y1="152" x2="570" y2="152" stroke="#1f618d" stroke-width="2"/>
  <line x1="447.5" y1="115" x2="447.5" y2="175" stroke="#0969da" stroke-width="1.5"/>
  <line x1="482.5" y1="115" x2="482.5" y2="175" stroke="#0969da" stroke-width="1.5"/>
  <line x1="517.5" y1="115" x2="517.5" y2="175" stroke="#0969da" stroke-width="1.5"/>
  <line x1="552.5" y1="115" x2="552.5" y2="175" stroke="#0969da" stroke-width="1.5"/>
  <line x1="430" y1="185" x2="465" y2="185" stroke="#555" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="447" y="200" fill="#555" font-size="11" text-anchor="middle">step</text>
  <text x="420" y="225" fill="#555" font-size="12">in plan: square to the span,</text>
  <text x="420" y="240" fill="#555" font-size="12">at the middle of each of</text>
  <text x="420" y="255" fill="#555" font-size="12">⌈length / step⌉ equal steps</text>
  <text x="420" y="270" fill="#555" font-size="12">(5 m by default): the wires</text>
  <text x="420" y="285" fill="#555" font-size="12">where they cross, the ground</text>
  <text x="420" y="300" fill="#555" font-size="12">across (every 1 m)</text>

  <!-- 4 each cut -->
  <rect x="605" y="70" width="180" height="250" fill="none" stroke="#ccc"/>
  <text x="615" y="90" font-weight="bold">4  In each cut</text>
  <line x1="615" y1="200" x2="775" y2="200" stroke="#8b6b45" stroke-width="1.5"/>
  <circle cx="660" cy="115" r="4" fill="#2e7d32"/>
  <line x1="660" y1="115" x2="660" y2="170" stroke="#999" stroke-dasharray="3,3"/>
  <line x1="660" y1="115" x2="632" y2="170" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="645" cy="150" r="4.5" fill="#2e7d32"/>
  <text x="640" y="185" fill="#0969da" font-size="11">angle</text>
  <circle cx="738" cy="140" r="32" fill="none" stroke="#0969da" stroke-dasharray="4,3"/>
  <circle cx="712" cy="122" r="3.5" fill="#2e7d32"/>
  <circle cx="712" cy="160" r="4.5" fill="#c0392b"/>
  <text x="742" y="186" fill="#0969da" font-size="11" text-anchor="middle">sphere r</text>
  <text x="615" y="225" fill="#555" font-size="12">angle: the line from a</text>
  <text x="615" y="240" fill="#555" font-size="12">shielding wire within the</text>
  <text x="615" y="255" fill="#555" font-size="12">rule's angle; sphere: no</text>
  <text x="615" y="270" fill="#555" font-size="12">free sphere centre within</text>
  <text x="615" y="285" fill="#555" font-size="12">r of the phase's surface</text>
  <text x="615" y="300" fill="#555" font-size="12">(exact, no sampling)</text>

  <!-- 5 results -->
  <rect x="800" y="70" width="180" height="250" fill="none" stroke="#ccc"/>
  <text x="810" y="90" font-weight="bold">5  Results</text>
  <rect x="810" y="105" width="160" height="20" fill="#fdedec" stroke="#c0392b"/>
  <text x="815" y="120" fill="#c0392b" font-size="12">✖ T2–T3 L1  15 m exposed</text>
  <rect x="810" y="130" width="160" height="20" fill="#fff" stroke="#ccc"/>
  <text x="815" y="145" font-size="12">T2–T3 L3  covered</text>
  <line x1="815" y1="180" x2="965" y2="180" stroke="#1f618d" stroke-width="2"/>
  <line x1="860" y1="180" x2="890" y2="180" stroke="#c0392b" stroke-width="4"/>
  <text x="875" y="172" fill="#c0392b" font-size="11" text-anchor="middle">exposed</text>
  <text x="810" y="215" fill="#555" font-size="12">per phase and span: the</text>
  <text x="810" y="230" fill="#555" font-size="12">length exposed (each cut</text>
  <text x="810" y="245" fill="#555" font-size="12">for its step), where it is</text>
  <text x="810" y="260" fill="#555" font-size="12">worst, the margin (angle</text>
  <text x="810" y="275" fill="#555" font-size="12">needed, or r_max); red in</text>
  <text x="810" y="290" fill="#555" font-size="12">3D, the worst cut drawn</text>

  <!-- arrows -->
  <line x1="110" y1="340" x2="880" y2="340" stroke="#555" marker-end="url(#g)"/>
  <text x="20" y="370" fill="#555">Every rule, every weather case it applies in (with the shielding wires' cases of its own), every span holding a phase it protects:</text>
  <text x="20" y="388" fill="#555">one row per phase. The other phases and the structures never shield; the ground does (for the sphere, at β·r). No value is</text>
  <text x="20" y="406" fill="#555">built in: the angles, the striking distance or the stroke current and β are yours or a design-code preset's.</text>
</svg>
