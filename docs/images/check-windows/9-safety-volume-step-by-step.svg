<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">The safety volumes, step by step</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale. What one Run does for the wires ticked (docs/user-guide/safety-volumes.md).</text>

  <!-- 1 weather cases -->
  <rect x="20" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="30" y="90" font-weight="bold">1  Weather cases</text>
  <rect x="35" y="105" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="121">max. temperature</text>
  <rect x="35" y="133" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="149">ice</text>
  <rect x="35" y="161" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="177">high wind 600 Pa</text>
  <text x="30" y="210" fill="#555" font-size="12">the cases ticked in</text>
  <text x="30" y="225" fill="#555" font-size="12">2 Scope, each solved</text>
  <text x="30" y="240" fill="#555" font-size="12">by the line's solver</text>

  <!-- 2 wire positions -->
  <rect x="185" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="195" y="90" font-weight="bold">2  Wire positions</text>
  <circle cx="260" cy="115" r="4" fill="#555"/>
  <text x="270" y="119" fill="#555" font-size="11">axis</text>
  <path d="M215,185 A70,70 0 0,0 305,185" fill="none" stroke="#2e86c1" stroke-width="10" stroke-opacity="0.25"/>
  <path d="M215,185 A70,70 0 0,0 305,185" fill="none" stroke="#2e86c1" stroke-dasharray="4,3"/>
  <line x1="260" y1="115" x2="260" y2="185" stroke="#999"/>
  <line x1="260" y1="115" x2="213" y2="167" stroke="#999"/>
  <line x1="260" y1="115" x2="307" y2="167" stroke="#999"/>
  <circle cx="260" cy="185" r="5" fill="#1f618d"/>
  <circle cx="213" cy="167" r="5" fill="#1f618d"/>
  <circle cx="307" cy="167" r="5" fill="#1f618d"/>
  <text x="195" y="215" fill="#555" font-size="12">blown left and right at</text>
  <text x="195" y="230" fill="#555" font-size="12">full wind; the swing arc</text>
  <text x="195" y="245" fill="#555" font-size="12">(band) between them,</text>
  <text x="195" y="260" fill="#555" font-size="12">widened by the band</text>
  <text x="195" y="275" fill="#555" font-size="12">margin; or the wind steps</text>

  <!-- 3 distance -->
  <rect x="350" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="360" y="90" font-weight="bold">3  Distance</text>
  <circle cx="425" cy="160" r="48" fill="#f39c12" fill-opacity="0.08" stroke="#f39c12" stroke-dasharray="5,4"/>
  <circle cx="425" cy="160" r="38" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12"/>
  <circle cx="425" cy="160" r="5" fill="#1f618d"/>
  <line x1="430" y1="160" x2="461" y2="160" stroke="#b9770e" marker-end="url(#g)"/>
  <text x="438" y="154" font-size="11" fill="#b9770e">d</text>
  <text x="458" y="125" font-size="11" fill="#b9770e">+ margin</text>
  <text x="360" y="230" fill="#555" font-size="12">around every position:</text>
  <text x="360" y="245" fill="#555" font-size="12">d at the wire's voltage</text>
  <text x="360" y="260" fill="#555" font-size="12">plus the margin, from</text>
  <text x="360" y="275" fill="#555" font-size="12">the conductor's surface</text>

  <!-- 4 union -->
  <rect x="515" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="525" y="90" font-weight="bold">4  One volume</text>
  <circle cx="565" cy="165" r="30" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12"/>
  <circle cx="590" cy="175" r="30" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12"/>
  <circle cx="615" cy="165" r="30" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12"/>
  <circle cx="565" cy="165" r="4" fill="#1f618d"/>
  <circle cx="590" cy="175" r="4" fill="#1f618d"/>
  <circle cx="615" cy="165" r="4" fill="#1f618d"/>
  <text x="525" y="230" fill="#555" font-size="12">the tubes of all positions</text>
  <text x="525" y="245" fill="#555" font-size="12">joined: one closed volume</text>
  <text x="525" y="260" fill="#555" font-size="12">per wire, circuit or</text>
  <text x="525" y="275" fill="#555" font-size="12">system; the jumpers in,</text>
  <text x="525" y="290" fill="#555" font-size="12">the structures not</text>

  <!-- 5 mesh -->
  <rect x="680" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="690" y="90" font-weight="bold">5  Mesh</text>
  <path d="M705,190 A50,50 0 0,1 805,190" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12"/>
  <polyline points="700,190 708,155 730,133 755,125 780,133 802,155 810,190" fill="none" stroke="#555" stroke-dasharray="4,3"/>
  <circle cx="755" cy="190" r="4" fill="#1f618d"/>
  <text x="690" y="230" fill="#555" font-size="12">triangles that hold the</text>
  <text x="690" y="245" fill="#555" font-size="12">volume whole, never</text>
  <text x="690" y="260" fill="#555" font-size="12">inside it; outside by at</text>
  <text x="690" y="275" fill="#555" font-size="12">most the tolerance where</text>
  <text x="690" y="290" fill="#555" font-size="12">it is smooth</text>

  <!-- 6 results -->
  <rect x="845" y="70" width="135" height="250" fill="none" stroke="#ccc"/>
  <text x="855" y="90" font-weight="bold">6  Results</text>
  <rect x="855" y="105" width="115" height="20" fill="#fff" stroke="#ccc"/>
  <text x="860" y="120" font-size="12">L1 — 110 kV, 4 m</text>
  <rect x="855" y="130" width="115" height="20" fill="#fff" stroke="#ccc"/>
  <text x="860" y="145" font-size="12">L2 — 110 kV, 4 m</text>
  <rect x="860" y="165" width="30" height="36" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="864" y="187" font-size="11">DXF</text>
  <rect x="895" y="165" width="30" height="36" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="900" y="187" font-size="11">IFC</text>
  <rect x="930" y="165" width="35" height="36" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="934" y="187" font-size="11">KMZ</text>
  <text x="855" y="230" fill="#555" font-size="12">a row per volume; drawn</text>
  <text x="855" y="245" fill="#555" font-size="12">in 3D and the plan;</text>
  <text x="855" y="260" fill="#555" font-size="12">saved in Performed</text>
  <text x="855" y="275" fill="#555" font-size="12">checks; exported</text>

  <!-- arrows -->
  <line x1="95" y1="340" x2="912" y2="340" stroke="#555" marker-end="url(#g)"/>
  <text x="20" y="370" fill="#555">Every weather case ticked, every wind position of that case, every wire of the systems, circuits or spans ticked: the space</text>
  <text x="20" y="388" fill="#555">within the distance of any of its positions belongs to the volume. Nothing is compared and nothing is a finding: the volumes</text>
  <text x="20" y="406" fill="#555">are what the work near the line must stay out of.</text>
</svg>
