<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">Distance between conductors: what OpenOHL measures</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale (docs/user-guide/distance-between-conductors.md). The required distance z is the plugin's.</text>

  <!-- 1 the pairs -->
  <rect x="20" y="65" width="310" height="225" fill="none" stroke="#ccc"/>
  <text x="30" y="85" font-weight="bold">1  The pairs of a span</text>
  <line x1="175" y1="100" x2="175" y2="230" stroke="#555" stroke-width="3"/>
  <line x1="95" y1="130" x2="255" y2="130" stroke="#555" stroke-width="2"/>
  <line x1="115" y1="175" x2="235" y2="175" stroke="#555" stroke-width="2"/>
  <circle cx="175" cy="103" r="4" fill="#555"/>
  <text x="183" y="107" fill="#555" font-size="12">earth wire</text>
  <circle cx="100" cy="142" r="5" fill="#1f618d"/>
  <circle cx="250" cy="142" r="5" fill="#1f618d"/>
  <circle cx="120" cy="187" r="5" fill="#1f618d"/>
  <circle cx="230" cy="187" r="5" fill="#1f618d"/>
  <line x1="100" y1="142" x2="250" y2="142" stroke="#c0392b" stroke-dasharray="4,3"/>
  <line x1="100" y1="142" x2="120" y2="187" stroke="#c0392b" stroke-dasharray="4,3"/>
  <line x1="250" y1="142" x2="230" y2="187" stroke="#c0392b" stroke-dasharray="4,3"/>
  <line x1="100" y1="142" x2="175" y2="103" stroke="#c0392b" stroke-dasharray="4,3"/>
  <text x="30" y="250" fill="#555" font-size="12">every two conductors between the same two</text>
  <text x="30" y="265" fill="#555" font-size="12">structures (ticked: nearby spans too); not two</text>
  <text x="30" y="280" fill="#555" font-size="12">earth wires, one phase, or a shared clamp</text>

  <!-- 2 stations -->
  <rect x="345" y="65" width="310" height="225" fill="none" stroke="#ccc"/>
  <text x="355" y="85" font-weight="bold">2  Stations along the span</text>
  <line x1="370" y1="100" x2="370" y2="215" stroke="#555" stroke-width="2"/>
  <line x1="630" y1="100" x2="630" y2="215" stroke="#555" stroke-width="2"/>
  <path d="M370,110 Q500,200 630,110" fill="none" stroke="#1f618d" stroke-width="2"/>
  <path d="M370,135 Q500,225 630,135" fill="none" stroke="#7f9bb8" stroke-width="2"/>
  <g fill="#1f618d">
    <circle cx="400" cy="126" r="2.5"/><circle cx="430" cy="138" r="2.5"/><circle cx="460" cy="147" r="2.5"/>
    <circle cx="490" cy="152" r="2.5"/><circle cx="520" cy="153" r="2.5"/><circle cx="550" cy="148" r="2.5"/>
    <circle cx="580" cy="140" r="2.5"/><circle cx="610" cy="128" r="2.5"/>
  </g>
  <line x1="460" y1="147" x2="460" y2="172" stroke="#c0392b" stroke-width="2"/>
  <text x="440" y="142" fill="#c0392b" font-size="12">P</text>
  <text x="464" y="186" fill="#c0392b" font-size="12">Q</text>
  <line x1="490" y1="232" x2="520" y2="232" stroke="#555" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="527" y="236" fill="#555" font-size="12">Δs</text>
  <text x="355" y="250" fill="#555" font-size="12">a station P every Δs along each conductor in</text>
  <text x="355" y="265" fill="#555" font-size="12">turn (its ends included); Q the closest point of</text>
  <text x="355" y="280" fill="#555" font-size="12">the other conductor, searched continuously</text>

  <!-- 3 d and beta -->
  <rect x="670" y="65" width="310" height="225" fill="none" stroke="#ccc"/>
  <text x="680" y="85" font-weight="bold">3  d and β at a station</text>
  <circle cx="770" cy="120" r="6" fill="#1f618d"/>
  <circle cx="860" cy="200" r="6" fill="#7f9bb8"/>
  <text x="752" y="116" fill="#1f618d">P</text>
  <text x="870" y="205" fill="#555">Q</text>
  <line x1="770" y1="120" x2="860" y2="200" stroke="#c0392b" stroke-width="2"/>
  <text x="822" y="152" fill="#c0392b" font-weight="bold">d</text>
  <line x1="770" y1="120" x2="770" y2="220" stroke="#555" stroke-dasharray="4,3"/>
  <path d="M770,160 A40,40 0 0,0 800,147" fill="none" stroke="#555"/>
  <text x="776" y="178" fill="#555">β</text>
  <text x="680" y="250" fill="#555" font-size="12">d: the distance between the axes |PQ|;</text>
  <text x="680" y="265" fill="#555" font-size="12">β: the angle of PQ from the vertical (in the</text>
  <text x="680" y="280" fill="#555" font-size="12">vertical plane through P and Q)</text>

  <!-- 4 sag and string -->
  <rect x="20" y="305" width="310" height="240" fill="none" stroke="#ccc"/>
  <text x="30" y="325" font-weight="bold">4  Local sag f and string l_k</text>
  <line x1="50" y1="340" x2="50" y2="450" stroke="#555" stroke-width="3"/>
  <line x1="300" y1="340" x2="300" y2="450" stroke="#555" stroke-width="3"/>
  <line x1="50" y1="345" x2="50" y2="378" stroke="#8e44ad" stroke-width="3"/>
  <text x="56" y="365" fill="#8e44ad" font-size="12">l_k</text>
  <line x1="300" y1="370" x2="290" y2="370" stroke="#8e44ad" stroke-width="3"/>
  <text x="218" y="362" fill="#8e44ad" font-size="12">0 (tension)</text>
  <line x1="50" y1="378" x2="290" y2="370" stroke="#555" stroke-dasharray="5,3"/>
  <text x="110" y="370" fill="#555" font-size="12">chord</text>
  <path d="M50,378 Q170,470 290,370" fill="none" stroke="#1f618d" stroke-width="2"/>
  <line x1="190" y1="373" x2="190" y2="419" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="196" y="402" fill="#c0392b" font-weight="bold">f</text>
  <text x="30" y="480" fill="#555" font-size="12">f: below the chord between the clamps (0 there);</text>
  <text x="30" y="495" fill="#555" font-size="12">l_k: the suspension string, linear between the</text>
  <text x="30" y="510" fill="#555" font-size="12">ends; 0 at a tension string and at a section's end.</text>
  <text x="30" y="525" fill="#555" font-size="12">Phase spacers: the sag between their clamps too.</text>

  <!-- 5 unequal wind -->
  <rect x="345" y="305" width="310" height="240" fill="none" stroke="#ccc"/>
  <text x="355" y="325" font-weight="bold">5  Under unequal wind</text>
  <line x1="420" y1="345" x2="580" y2="345" stroke="#555" stroke-width="2"/>
  <circle cx="440" cy="345" r="3" fill="#555"/>
  <circle cx="560" cy="345" r="3" fill="#555"/>
  <line x1="440" y1="345" x2="440" y2="440" stroke="#7f9bb8" stroke-dasharray="4,3"/>
  <line x1="560" y1="345" x2="560" y2="440" stroke="#7f9bb8" stroke-dasharray="4,3"/>
  <line x1="440" y1="345" x2="510" y2="425" stroke="#1f618d" stroke-width="2"/>
  <circle cx="510" cy="425" r="6" fill="#1f618d"/>
  <line x1="560" y1="345" x2="575" y2="438" stroke="#1f618d" stroke-width="2"/>
  <circle cx="575" cy="438" r="6" fill="#1f618d"/>
  <line x1="510" y1="425" x2="575" y2="438" stroke="#c0392b" stroke-width="2"/>
  <text x="538" y="452" fill="#c0392b" font-weight="bold">d</text>
  <text x="470" y="400" fill="#1f618d" font-size="12">p</text>
  <text x="572" y="380" fill="#1f618d" font-size="12">share × p</text>
  <line x1="375" y1="380" x2="415" y2="380" stroke="#555" marker-end="url(#g)"/>
  <text x="372" y="372" fill="#555" font-size="12">wind</text>
  <text x="355" y="480" fill="#555" font-size="12">one conductor at a wind p, the other from a</text>
  <text x="355" y="495" fill="#555" font-size="12">share of p up to p, p in steps from none to the</text>
  <text x="355" y="510" fill="#555" font-size="12">case's wind, from each side: the closest</text>
  <text x="355" y="525" fill="#555" font-size="12">approach, exact (segment against segment)</text>

  <!-- 6 the plugin -->
  <rect x="670" y="305" width="310" height="240" fill="none" stroke="#ccc"/>
  <text x="680" y="325" font-weight="bold">6  The plugin: the distance z</text>
  <rect x="690" y="345" width="125" height="70" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="698" y="365" font-size="12">measured:</text>
  <text x="698" y="382" font-size="12">d, β, f, l_k,</text>
  <text x="698" y="399" font-size="12">kV, spacer sag…</text>
  <line x1="815" y1="380" x2="845" y2="380" stroke="#555" marker-end="url(#g)"/>
  <rect x="848" y="345" width="115" height="70" fill="#fdf2e9" stroke="#d68910"/>
  <text x="856" y="365" font-size="12">the plugin's</text>
  <text x="856" y="382" font-size="12">rule and values:</text>
  <text x="856" y="399" font-size="12" font-weight="bold">z per station</text>
  <text x="680" y="445" font-size="12">margin d − z; below 0: the pair fails</text>
  <text x="680" y="480" fill="#555" font-size="12">per pair: the worst station (smallest d − z)</text>
  <text x="680" y="495" fill="#555" font-size="12">and the length of conductor below z; the</text>
  <text x="680" y="510" fill="#555" font-size="12">plugin's own page explains its rule</text>
</svg>
