<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">The vegetation and danger-tree check, step by step</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale. What one Run does for every span in scope (docs/user-guide/vegetation.md).</text>

  <!-- 1 weather cases -->
  <rect x="20" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="30" y="90" font-weight="bold">1  Weather cases</text>
  <rect x="35" y="105" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="121">max. temperature</text>
  <rect x="35" y="133" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="149">ice</text>
  <rect x="35" y="161" width="120" height="22" fill="#eef3f8" stroke="#7f9bb8"/>
  <text x="42" y="177">high wind 600 Pa</text>
  <text x="30" y="210" fill="#555" font-size="12">the cases ticked in</text>
  <text x="30" y="225" fill="#555" font-size="12">2 Scope, each solved</text>
  <text x="30" y="240" fill="#555" font-size="12">for the wires in scope</text>

  <!-- 2 wire positions -->
  <rect x="185" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="195" y="90" font-weight="bold">2  Wire positions</text>
  <circle cx="260" cy="115" r="4" fill="#555"/>
  <text x="270" y="119" fill="#555" font-size="11">axis</text>
  <path d="M215,185 A70,70 0 0,0 305,185" fill="none" stroke="#2e86c1" stroke-width="10" stroke-opacity="0.25"/>
  <path d="M215,185 A70,70 0 0,0 305,185" fill="none" stroke="#2e86c1" stroke-dasharray="4,3"/>
  <line x1="260" y1="115" x2="260" y2="185" stroke="#999"/>
  <line x1="260" y1="115" x2="213" y2="167" stroke="#999"/>
  <line x1="260" y1="115" x2="307" y2="167" stroke="#999"/>
  <circle cx="260" cy="185" r="5" fill="#1f618d"/>
  <circle cx="213" cy="167" r="5" fill="#1f618d"/>
  <circle cx="307" cy="167" r="5" fill="#1f618d"/>
  <text x="195" y="215" fill="#555" font-size="12">still air, blown left and</text>
  <text x="195" y="230" fill="#555" font-size="12">right; optionally the swing</text>
  <text x="195" y="245" fill="#555" font-size="12">arc (band), the wind steps</text>
  <text x="195" y="260" fill="#555" font-size="12">and unbalanced ice on</text>
  <text x="195" y="275" fill="#555" font-size="12">spans near vegetation</text>

  <!-- 3 the vegetation points -->
  <rect x="350" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="360" y="90" font-weight="bold">3  The points</text>
  <line x1="365" y1="150" x2="485" y2="150" stroke="#1f618d" stroke-width="2"/>
  <rect x="365" y="115" width="120" height="70" fill="#f39c12" fill-opacity="0.08" stroke="#f39c12" stroke-dasharray="5,4"/>
  <circle cx="380" cy="128" r="3" fill="#27ae60"/>
  <circle cx="395" cy="172" r="3" fill="#27ae60"/>
  <circle cx="430" cy="125" r="3" fill="#27ae60"/>
  <circle cx="455" cy="170" r="3" fill="#27ae60"/>
  <circle cx="472" cy="133" r="3" fill="#27ae60"/>
  <circle cx="500" cy="105" r="3" fill="#bbb"/>
  <text x="360" y="215" fill="#555" font-size="12">the LiDAR points of the</text>
  <text x="360" y="230" fill="#555" font-size="12">vegetation classes within</text>
  <text x="360" y="245" fill="#555" font-size="12">the search distance of</text>
  <text x="360" y="260" fill="#555" font-size="12">the spans (plan view), read</text>
  <text x="360" y="275" fill="#555" font-size="12">again from the point cloud</text>

  <!-- 4 grow-in -->
  <rect x="515" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="525" y="90" font-weight="bold">4  Grow-in</text>
  <circle cx="590" cy="150" r="22" fill="none" stroke="#c0392b"/>
  <circle cx="590" cy="150" r="34" fill="none" stroke="#c0392b" stroke-dasharray="4,3"/>
  <circle cx="590" cy="150" r="42" fill="none" stroke="#c0392b" stroke-dasharray="1,3"/>
  <circle cx="590" cy="150" r="5" fill="#1f618d"/>
  <circle cx="618" cy="172" r="3" fill="#27ae60"/>
  <circle cx="645" cy="105" r="3" fill="#27ae60"/>
  <text x="525" y="215" fill="#555" font-size="12">a point nearer a wire's</text>
  <text x="525" y="230" fill="#555" font-size="12">surface than c + g + b</text>
  <text x="525" y="245" fill="#555" font-size="12">(clearance, growth until</text>
  <text x="525" y="260" fill="#555" font-size="12">the next cut, buffer) in</text>
  <text x="525" y="275" fill="#555" font-size="12">any position grows in</text>

  <!-- 5 fall-in -->
  <rect x="680" y="70" width="150" height="250" fill="none" stroke="#ccc"/>
  <text x="690" y="90" font-weight="bold">5  Fall-in</text>
  <line x1="690" y1="200" x2="820" y2="200" stroke="#7d6608" stroke-width="2"/>
  <line x1="715" y1="200" x2="715" y2="120" stroke="#27ae60" stroke-width="3"/>
  <circle cx="715" cy="120" r="3" fill="#27ae60"/>
  <path d="M719,200 L719,120 A80,80 0 0,1 799,200" fill="#27ae60" fill-opacity="0.10" stroke="#27ae60" stroke-dasharray="4,3"/>
  <circle cx="790" cy="150" r="5" fill="#1f618d"/>
  <circle cx="790" cy="150" r="14" fill="none" stroke="#c0392b" stroke-dasharray="3,3"/>
  <text x="768" y="133" fill="#c0392b" font-size="11">A</text>
  <text x="690" y="230" fill="#555" font-size="12">a tree (a point above its</text>
  <text x="690" y="245" fill="#555" font-size="12">base on the ground) falls</text>
  <text x="690" y="260" fill="#555" font-size="12">about its root ball; within</text>
  <text x="690" y="275" fill="#555" font-size="12">A of a wire: a danger tree.</text>
  <text x="690" y="290" fill="#555" font-size="12">No base: questionable</text>

  <!-- 6 results -->
  <rect x="845" y="70" width="135" height="250" fill="none" stroke="#ccc"/>
  <text x="855" y="90" font-weight="bold">6  Results</text>
  <rect x="855" y="105" width="115" height="20" fill="#fdedec" stroke="#c0392b"/>
  <text x="860" y="120" fill="#c0392b" font-size="12">✖ S1 span 1  12  3</text>
  <rect x="855" y="130" width="115" height="20" fill="#fff" stroke="#ccc"/>
  <text x="860" y="145" font-size="12">S2 span 4   2  0</text>
  <circle cx="880" cy="185" r="3" fill="#17a589"/>
  <circle cx="892" cy="178" r="3" fill="#17a589"/>
  <line x1="930" y1="215" x2="945" y2="170" stroke="#d35400" stroke-width="3"/>
  <text x="855" y="245" fill="#555" font-size="12">a row per span with</text>
  <text x="855" y="260" fill="#555" font-size="12">findings; every point</text>
  <text x="855" y="275" fill="#555" font-size="12">and tree drawn in the</text>
  <text x="855" y="290" fill="#555" font-size="12">views in your colours</text>

  <!-- arrows -->
  <line x1="95" y1="340" x2="912" y2="340" stroke="#555" marker-end="url(#g)"/>
  <text x="20" y="370" fill="#555">Every weather case ticked, every wire position of that case, every span in scope: each vegetation point is measured once</text>
  <text x="20" y="388" fill="#555">against every position. Per span the counts, the nearest point and the worst falling tree are kept (with their case and</text>
  <text x="20" y="406" fill="#555">position), and every grow-in point and danger tree found is listed and drawn.</text>
</svg>
