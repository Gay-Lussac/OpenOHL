<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Weather case and load case</title><desc id="d">A weather case (temperature, wind, ice) gives the wires' shape and tension in OHL-Design. A load case takes a weather case with factors and gives the loads sent to the structures; OHL-Structure's structure load cases combine them for the analysis.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="820" height="300"/><text x="20.0" y="26.0" class="t">Weather case, load case, structure load case</text><rect class="box" x="20" y="60" width="230" height="120" rx="6"/><text x="32.0" y="82.0" class="t">weather case (.ohlwc)</text><text x="32.0" y="104.0" class="lab">temperature</text><text x="32.0" y="121.0" class="lab">wind pressure</text><text x="32.0" y="138.0" class="lab">ice</text><text x="32.0" y="155.0" class="lab">→ the wires' sag and tension</text><rect class="box" x="300" y="60" width="230" height="120" rx="6"/><text x="312.0" y="82.0" class="t">load case (.ohllc)</text><text x="312.0" y="104.0" class="lab">a weather case</text><text x="312.0" y="121.0" class="lab">+ load factors</text><text x="312.0" y="138.0" class="lab">+ the structures' own wind</text><text x="312.0" y="155.0" class="lab">→ loads on structures</text><rect class="box" x="580" y="60" width="220" height="120" rx="6"/><text x="592.0" y="82.0" class="t">structure load case</text><text x="592.0" y="104.0" class="lab">(.ohlslc, OHL-Structure)</text><text x="592.0" y="121.0" class="lab">load cases from the line</text><text x="592.0" y="138.0" class="lab">+ the structure's own loads</text><text x="592.0" y="155.0" class="lab">→ member forces</text><path class="ldr" d="M250,120 L300,120 M292,115 L300,120 L292,125"/><path class="ldr" d="M530,120 L580,120 M572,115 L580,120 L572,125"/><text x="20.0" y="220.0" class="lab">Wire condition (not a case): initial, after creep, after load: the state of the wire the weather case is solved in.</text><text x="20.0" y="245.0" class="lab">A weather case alone may also be sent to the structures (every factor 1).</text></svg>
