<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="t d"><title id="t">Systems, phases and the earth wire</title><desc id="d">A structure carrying two systems, one on each side, three phases each, and one earth wire at the peak. Each colour is a conductor path: the sections and jumpers of one phase joined end to end.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="700" height="470"/><text x="20.0" y="26.0" class="t">Two systems on one structure, looking ahead</text><path class="st" d="M320,410 L350,100 L380,410 M335,410 L365,410"/><path class="st" d="M230,140 L470,140 M210,200 L490,200 M240,260 L460,260 M350,80 L350,100"/><path class="str" d="M230,140 L230,175"/><circle cx="230" cy="175" r="9" class="wire" style="stroke-width:3"/><circle class="ap" cx="230" cy="140" r="4.5"/><text x="214.0" y="180.0" class="e">L1</text><path class="str" d="M470,140 L470,175"/><circle cx="470" cy="175" r="9" class="wire" style="stroke-width:3"/><circle class="ap" cx="470" cy="140" r="4.5"/><text x="486.0" y="180.0">L1</text><path class="str" d="M250,200 L250,235"/><circle cx="250" cy="235" r="9" class="wire2" style="stroke-width:3"/><circle class="ap" cx="250" cy="200" r="4.5"/><text x="234.0" y="240.0" class="e">L2</text><path class="str" d="M450,200 L450,235"/><circle cx="450" cy="235" r="9" class="wire2" style="stroke-width:3"/><circle class="ap" cx="450" cy="200" r="4.5"/><text x="466.0" y="240.0">L2</text><path class="str" d="M260,260 L260,295"/><circle cx="260" cy="295" r="9" class="wire3" style="stroke-width:3"/><circle class="ap" cx="260" cy="260" r="4.5"/><text x="244.0" y="300.0" class="e">L3</text><path class="str" d="M440,260 L440,295"/><circle cx="440" cy="295" r="9" class="wire3" style="stroke-width:3"/><circle class="ap" cx="440" cy="260" r="4.5"/><text x="456.0" y="300.0">L3</text><circle class="dot" cx="350" cy="80" r="5"/><path class="ldr" d="M350.0,80.0 L430.0,58.0"/><text x="434.0" y="62.0">earth wire (no phase, earthed)</text><path class="thin" d="M150,100 L150,320 M550,100 L550,320"/><text x="150.0" y="340.0" class="c">system A, 220 kV</text><text x="150.0" y="356.0" class="c lab">phases L1 L2 L3</text><text x="550.0" y="340.0" class="c">system B, 220 kV</text><text x="550.0" y="356.0" class="c lab">phases L1 L2 L3</text><text x="20.0" y="436.0" class="lab">One colour = one conductor path: one phase's sections and jumpers,</text><text x="20.0" y="452.0" class="lab">joined end to end through the line (it carries one phase of one system).</text></svg>
