<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="t d"><title id="t">Span points and span objects</title><desc id="d">A span from the side with labelled span points: one holding a marker ball, one holding a spacer's clamp joining it to the wire of another section below, and one holding the clamp of a tap, a jumper ending on the span.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="860" height="360"/><text x="20.0" y="26.0" class="t">Span points and what they hold (side view of one span)</text><path class="st" d="M60,60 L60,300 M800,60 L800,300"/><path class="dash" d="M20,300 L840,300"/><path class="wire" d="M60.0,90.0 L97.0,107.1 L134.0,122.4 L171.0,135.9 L208.0,147.6 L245.0,157.5 L282.0,165.6 L319.0,171.9 L356.0,176.4 L393.0,179.1 L430.0,180.0 L467.0,179.1 L504.0,176.4 L541.0,171.9 L578.0,165.6 L615.0,157.5 L652.0,147.6 L689.0,135.9 L726.0,122.4 L763.0,107.1 L800.0,90.0"/><path class="wire2" d="M60.0,150.0 L97.0,167.1 L134.0,182.4 L171.0,195.9 L208.0,207.6 L245.0,217.5 L282.0,225.6 L319.0,231.9 L356.0,236.4 L393.0,239.1 L430.0,240.0 L467.0,239.1 L504.0,236.4 L541.0,231.9 L578.0,225.6 L615.0,217.5 L652.0,207.6 L689.0,195.9 L726.0,182.4 L763.0,167.1 L800.0,150.0"/><circle class="ap" cx="245.0" cy="169.5" r="11" style="fill:var(--wire)"/><path class="ldr" d="M245.0,169.5 L170.0,230.0"/><text x="166.0" y="234.0" class="e">marker ball (a body)</text><path class="str" d="M430.0,180.0 L430.0,240.0"/><rect class="ap" x="426.0" y="176.0" width="8" height="8"/><rect class="ap" x="426.0" y="236.0" width="8" height="8"/><path class="ldr" d="M430.0,210.0 L520.0,250.0"/><text x="524.0" y="254.0">spacer (joins span points of two sections)</text><rect class="ap" x="633.2" y="147.8" width="8" height="8"/><path class="wire" stroke-dasharray="5 3" d="M637.2,151.8 Q677.2,211.8 697.2,281.8"/><path class="ldr" d="M682.2,236.8 L760.0,325.0"/><text x="756.0" y="329.0" class="e">tap: a jumper ending on the span</text><path class="ldr" d="M637.2,151.8 L640.0,70.0"/><text x="644.0" y="74.0">span point holding a clamp</text><path class="ldr" d="M245.0,157.5 L300.0,60.0"/><text x="304.0" y="64.0">span point holding a body</text><text x="20.0" y="350.0" class="lab">■ clamp (a hinge: forces only)    ● body (weight, wind, ice)</text></svg>
