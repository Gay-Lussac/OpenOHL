<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d"><title id="t">Strings combined</title><desc id="d">Four ways single strings combine: one string; two strings to one wire point; a string below the wire point of two strings; two tension strings hanging from a suspension string's wire point, each ending a section.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="820" height="300"/><text x="20.0" y="26.0" class="t">Strings and how they combine: each one is a single string</text><path class="st" d="M50,80 L150,80"/><path class="str" d="M100,80 L100,180"/><circle class="ap" cx="100" cy="80" r="4.5"/><circle class="wp" cx="100" cy="180" r="5"/><text x="100.0" y="228.0" class="c">one string</text><path class="st" d="M210,80 L360,80"/><path class="str" d="M225,80 L285,180"/><path class="str" d="M345,80 L285,180"/><circle class="ap" cx="225" cy="80" r="4.5"/><circle class="ap" cx="345" cy="80" r="4.5"/><circle class="wp" cx="285" cy="180" r="5"/><text x="285.0" y="228.0" class="c">two strings,</text><text x="285.0" y="244.0" class="c">one wire point</text><path class="st" d="M410,80 L560,80"/><path class="str" d="M425,80 L485,150"/><path class="str" d="M545,80 L485,150"/><path class="str" d="M485,150 L485,195"/><circle class="ap" cx="425" cy="80" r="4.5"/><circle class="ap" cx="545" cy="80" r="4.5"/><circle class="ap" cx="485" cy="150" r="4"/><circle class="wp" cx="485" cy="195" r="5"/><text x="485.0" y="228.0" class="c">a string below</text><text x="485.0" y="244.0" class="c">two strings</text><path class="st" d="M640,80 L740,80"/><path class="str" d="M690,80 L690,140"/><path class="str" d="M690,140 L630,152"/><path class="str" d="M690,140 L750,152"/><path class="wire" d="M590,170 Q610,158 630,152 M750,152 Q770,158 790,170"/><circle class="ap" cx="690" cy="80" r="4.5"/><circle class="ap" cx="690" cy="140" r="4"/><circle class="wp" cx="630" cy="152" r="5"/><circle class="wp" cx="750" cy="152" r="5"/><text x="690.0" y="228.0" class="c">two tension strings</text><text x="690.0" y="244.0" class="c">from a string (side view)</text><circle class="ap" cx="30" cy="279" r="4.5"/><text x="42.0" y="283.0" class="lab">attachment point, or a wire point strings hang from</text><circle class="wp" cx="400" cy="279" r="5"/><text x="412.0" y="283.0" class="lab">wire point</text><path class="str" d="M510,279 L540,279"/><text x="548.0" y="283.0" class="lab">string (one straight member)</text></svg>
