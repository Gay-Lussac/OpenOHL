<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-labelledby="t d"><title id="t">A structure and its parts</title><desc id="d">A structure seen along the line: attachment points on its crossarms, a string hanging from each to a wire point with its set number, and the earth wire's wire point at the peak, fixed without a string.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="700" height="420"/><text x="20.0" y="26.0" class="t">A structure, looking ahead along the line</text><path class="st" d="M300,395 L330,100 L360,395 M315,395 L345,395"/><path class="st" d="M210,140 L450,140 M230,215 L430,215 M330,80 L330,100"/><path class="str" d="M220,140 L220,185"/><circle class="wp" cx="220" cy="185" r="5"/><circle class="ap" cx="220" cy="140" r="4.5"/><text x="230.0" y="190.0" class="lab">set 1</text><path class="str" d="M440,140 L440,185"/><circle class="wp" cx="440" cy="185" r="5"/><circle class="ap" cx="440" cy="140" r="4.5"/><text x="450.0" y="190.0" class="lab">set 2</text><path class="str" d="M240,215 L240,260"/><circle class="wp" cx="240" cy="260" r="5"/><circle class="ap" cx="240" cy="215" r="4.5"/><text x="250.0" y="265.0" class="lab">set 3</text><path class="str" d="M420,215 L420,260"/><circle class="wp" cx="420" cy="260" r="5"/><circle class="ap" cx="420" cy="215" r="4.5"/><text x="430.0" y="265.0" class="lab">set 4</text><circle class="wp" cx="330" cy="80" r="5"/><text x="342.0" y="85.0" class="lab">set 5</text><path class="ldr" d="M220.0,140.0 L150.0,105.0"/><text x="146.0" y="109.0" class="e">attachment point</text><path class="ldr" d="M220.0,162.0 L150.0,162.0"/><text x="146.0" y="166.0" class="e">string</text><path class="ldr" d="M240.0,260.0 L170.0,300.0"/><text x="166.0" y="304.0" class="e">wire point</text><path class="ldr" d="M330.0,80.0 L420.0,60.0"/><text x="424.0" y="64.0">earth wire's wire point (fixed, no string)</text><path class="ldr" d="M347.0,320.0 L430.0,340.0"/><text x="434.0" y="344.0">structure (here a lattice tower)</text></svg>
