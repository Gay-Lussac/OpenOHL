<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d"><title id="t">Sag, clearances and the swing band</title><desc id="d">Left: a span from the side, with the sag below the chord and the vertical clearance from the lowest point of the wire to the ground. Right: the same span cut across, with the wire swung by the wind inside its swing band and the radial clearance to an object beside the line.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="900" height="360"/><text x="20.0" y="26.0" class="t">Sag and clearances (left: side view; right: across the span)</text><path class="dash" d="M20,320 L480,320"/><path class="st" d="M50,320 L50,80 M450,320 L450,80"/><path class="thin" d="M50,90 L450,90"/><path class="wire" d="M50.0,90.0 L70.0,112.8 L90.0,133.2 L110.0,151.2 L130.0,166.8 L150.0,180.0 L170.0,190.8 L190.0,199.2 L210.0,205.2 L230.0,208.8 L250.0,210.0 L270.0,208.8 L290.0,205.2 L310.0,199.2 L330.0,190.8 L350.0,180.0 L370.0,166.8 L390.0,151.2 L410.0,133.2 L430.0,112.8 L450.0,90.0"/><path class="thin" d="M250,90 L250,210 M245,90 L255,90 M245,210 L255,210"/><text x="258.0" y="154.0">sag</text><path class="thin" stroke-dasharray="3 3" d="M250,210 L250,320"/><path class="thin" d="M300,210 L300,320 M295,210 L305,210 M295,320 L305,320"/><text x="308.0" y="269.0">vertical clearance</text><text x="60.0" y="82.0" class="lab">chord</text><path class="dash" d="M500,320 L890,320"/><path class="band" d="M551.7,188.3 A139,139 0 0 0 748.3,188.3 L728.5,168.5 A111,111 0 0 1 571.5,168.5 Z"/><path class="thin" d="M650,90 L650.0,215.0 M650,90 L721.7,192.4"/><circle cx="650.0" cy="215.0" r="6" class="wire" style="stroke-width:3"/><circle cx="721.7" cy="192.4" r="6" class="wire" style="stroke-width:3"/><circle class="ap" cx="650" cy="90" r="4"/><rect class="box" x="830" y="130" width="40" height="190"/><text x="850.0" y="122.0" class="c lab">object</text><path class="thin" d="M728.7,192.4 L830,192.4 M830,187.4 L830,197.4"/><text x="775.8" y="214.4" class="c">radial clearance</text><path class="ldr" d="M650.0,215.0 L600.0,262.0"/><text x="596.0" y="266.0" class="e">wire, still air</text><path class="ldr" d="M721.7,192.4 L720.0,292.0"/><text x="716.0" y="296.0" class="e">wire in the wind</text><path class="ldr" d="M569.7,185.8 L540.0,130.0"/><text x="536.0" y="134.0" class="e">swing band</text><path class="ldr" d="M650.0,90.0 L600.0,64.0"/><text x="596.0" y="68.0" class="e">point the wire swings about</text></svg>
