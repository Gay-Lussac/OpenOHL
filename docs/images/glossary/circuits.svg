<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d"><title id="t">System, circuit, conductor path and phase</title><desc id="d">Plan, schematic. In system A, circuit North holds two conductor paths: its phase L1, two sections joined by a jumper at a tension structure (one path), and its phase L2, one section. A branch of phase L1 that is not connected to North's L1 is a second circuit; a jumper joining them would make one path, and one circuit.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="760" height="420"/><text x="20.0" y="26.0" class="t">System, circuit, conductor path, phase (plan, schematic)</text><rect class="band" x="40" y="50" width="560" height="300" rx="8"/><text x="52.0" y="340.0" class="lab">system A, 220 kV — phases L1 L2 L3</text><rect class="box" x="82" y="92" width="16" height="96"/><rect class="box" x="322" y="92" width="16" height="96"/><rect class="box" x="552" y="92" width="16" height="96"/><path class="wire" d="M90,110 L316,110"/><path class="wire" d="M344,110 L560,110"/><path class="wire" stroke-dasharray="5 3" d="M316,110 Q330,132 344,110"/><circle class="wp" cx="90" cy="110" r="4"/><circle class="wp" cx="316" cy="110" r="4"/><circle class="wp" cx="344" cy="110" r="4"/><circle class="wp" cx="560" cy="110" r="4"/><path class="wire2" d="M90,170 L560,170"/><circle cx="90" cy="170" r="4" style="fill:var(--wire2)"/><circle cx="560" cy="170" r="4" style="fill:var(--wire2)"/><text x="76.0" y="114.0" class="e">L1</text><text x="76.0" y="174.0" class="e">L2</text><text x="210.0" y="102.0" class="c lab">section</text><text x="450.0" y="102.0" class="c lab">section</text><path class="ldr" d="M330.0,124.0 L380.0,145.0"/><text x="384.0" y="149.0">jumper</text><rect class="box" x="192" y="262" width="16" height="40"/><rect class="box" x="462" y="262" width="16" height="40"/><path class="wire3" d="M200,282 L470,282"/><circle cx="200" cy="282" r="4" style="fill:var(--wire3)"/><circle cx="470" cy="282" r="4" style="fill:var(--wire3)"/><text x="186.0" y="286.0" class="e">L1</text><path class="thin" d="M615,100 L625,100 L625,180 L615,180"/><text x="635.0" y="136.0">circuit North</text><text x="635.0" y="152.0" class="lab">2 conductor paths</text><path class="thin" d="M615,272 L625,272 L625,292 L615,292"/><text x="635.0" y="280.0">circuit Branch</text><text x="635.0" y="296.0" class="lab">1 conductor path</text><path class="ldr" d="M140.0,110.0 L250.0,74.0"/><text x="254.0" y="78.0">one conductor path (L1): section, jumper, section</text><path class="ldr" d="M330.0,282.0 L230.0,316.0"/><text x="234.0" y="320.0">the same phase L1, not connected: another circuit</text><text x="20.0" y="380.0" class="lab">A conductor path is in one circuit; a circuit has one path per phase. Circuits are not merged:</text><text x="20.0" y="396.0" class="lab">a jumper joining the two L1 paths would make them one path, and one circuit (its name chosen then).</text></svg>
