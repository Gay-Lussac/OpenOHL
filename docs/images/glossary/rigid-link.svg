<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d"><title id="t">Joints, attachment points and the rigid link</title><desc id="d">Left: a structure's joints, an attach joint at the crossarm's tip and support joints at its feet. Right, enlarged: an attachment point at an offset e from its attach joint, joined to it by a rigid link; the string's force F at the point reaches the joint as the same force and the moment M = F times e.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="860" height="400"/><text x="20.0" y="26.0" class="t">Joints, attachment points and the rigid link</text><path class="st" d="M120,360 L160,90 L200,360 M140,360 L180,360"/><path class="st" d="M160,90 L290,110 M160,140 L290,110"/><circle class="dot" cx="160" cy="90" r="3"/><circle class="dot" cx="160" cy="140" r="3"/><circle class="dot" cx="148" cy="220" r="3"/><circle class="dot" cx="172" cy="220" r="3"/><circle class="dot" cx="290" cy="110" r="3.5"/><circle cx="290" cy="110" r="9" style="fill:none;stroke:var(--wire);stroke-width:2"/><path class="st" style="stroke-width:1.8" d="M120,360 L111,376 L129,376 Z"/><path class="st" style="stroke-width:1.8" d="M200,360 L191,376 L209,376 Z"/><path class="str" d="M290,110 L290,175"/><circle class="wp" cx="290" cy="175" r="5"/><path class="ldr" d="M286.0,102.0 L250.0,55.0"/><text x="254.0" y="59.0">attach joint (strings hang here)</text><path class="ldr" d="M200.0,368.0 L260.0,385.0"/><text x="264.0" y="389.0">support joint (the structure stands here)</text><path class="ldr" d="M160.0,140.0 L60.0,140.0"/><text x="56.0" y="144.0" class="e">joint</text><path class="ldr" d="M290.0,150.0 L330.0,160.0"/><text x="334.0" y="164.0">string</text><rect class="box" x="470" y="50" width="370" height="300" rx="6"/><text x="480.0" y="70.0" class="lab">enlarged: a point at an offset from its joint</text><path class="st" d="M480,120 L560,150 M480,190 L560,150"/><circle class="dot" cx="560" cy="150" r="4"/><circle cx="560" cy="150" r="11" style="fill:none;stroke:var(--wire);stroke-width:2"/><path style="stroke:var(--wire3);stroke-width:6;stroke-linecap:round" d="M560,150 L700,175"/><circle class="ap" cx="700" cy="175" r="5.5"/><path class="str" d="M700,175 L700,265"/><circle class="wp" cx="700" cy="265" r="5"/><path class="wire" style="stroke-width:2.6" d="M728,195 L728,245 M722,235 L728,247 L734,235"/><text x="736.0" y="227.0">F (the string's force)</text><path class="thin" d="M560,300 L700,300 M560,295 L560,305 M700,295 L700,305"/><text x="630.0" y="294.0" class="c">e (offset)</text><path class="dash" d="M560,165 L560,293 M700,270 L700,293"/><path class="wire" style="stroke-width:2" d="M535.6,158.9 A26,26 0 1 1 582.5,163.0"/><path class="wire" style="stroke-width:2" d="M573.5,162.0 L582.5,163.0 L580.5,154.0"/><text x="520.0" y="110.0">M = F · e at the joint</text><path class="ldr" d="M556.0,160.0 L515.0,250.0"/><text x="511.0" y="254.0" class="e">attach joint</text><path class="ldr" d="M630.0,162.5 L650.0,110.0"/><text x="654.0" y="114.0">rigid link</text><path class="ldr" d="M700.0,175.0 L712.0,138.0"/><text x="716.0" y="142.0">attachment point</text><text x="480.0" y="325.0" class="lab">The point keeps its place. The joint carries F and M = F · e</text><text x="480.0" y="341.0" class="lab">where a frame member meets it (a truss-only joint cannot).</text></svg>
