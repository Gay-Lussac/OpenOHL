<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">Route, alignment and alignment points, in plan</title><desc id="d">Plan view: a route made of two alignments meeting at a junction; each alignment runs through alignment points. A structure is on an alignment when it is tied to one of its points, stands within 5 m of a point no structure is tied to, or is reached along it by a span of the line from a structure already on it; a crossing line's structures beside it are not on it.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="760" height="400"/><text x="20.0" y="26.0" class="t">A route in plan: alignments through alignment points</text><path class="st" d="M40,260 L230,210 L430,230 L620,120" style="stroke-width:2"/><path class="st" d="M430,230 L560,310 L730,320" style="stroke-width:2"/><rect class="ap" x="35" y="255" width="10" height="10"/><rect class="ap" x="225" y="205" width="10" height="10"/><rect class="ap" x="425" y="225" width="10" height="10"/><rect class="ap" x="615" y="115" width="10" height="10"/><rect class="ap" x="555" y="305" width="10" height="10"/><rect class="ap" x="725" y="315" width="10" height="10"/><path class="wire" d="M40.0,260.0 L135.0,235.0 L230.0,210.0 L330.0,220.0 L430.0,230.0 L496.5,191.5 L563.0,153.0 L626.0,129.0" style="stroke-width:1.4"/><path class="wire" d="M430.0,230.0 L495.0,270.0 L560.0,310.0 L645.0,315.0 L730.0,320.0" style="stroke-width:1.4"/><circle class="dot" cx="40.0" cy="260.0" r="4"/><circle class="dot" cx="135.0" cy="235.0" r="4"/><circle class="dot" cx="230.0" cy="210.0" r="4"/><circle class="dot" cx="330.0" cy="220.0" r="4"/><circle class="dot" cx="430.0" cy="230.0" r="4"/><circle class="dot" cx="496.5" cy="191.5" r="4"/><circle class="dot" cx="563.0" cy="153.0" r="4"/><circle class="dot" cx="626.0" cy="129.0" r="4"/><circle class="dot" cx="495.0" cy="270.0" r="4"/><circle class="dot" cx="560.0" cy="310.0" r="4"/><circle class="dot" cx="645.0" cy="315.0" r="4"/><circle class="dot" cx="730.0" cy="320.0" r="4"/><path class="wire3" d="M288,112 L318,172 L346,266 L374,328" style="stroke-width:1.4"/><circle class="ap" cx="318" cy="172" r="4.5"/><circle class="ap" cx="346" cy="266" r="4.5"/><circle class="dash" cx="620" cy="120" r="16"/><path class="ldr" d="M230.0,210.0 L40.0,170.0"/><text x="44.0" y="174.0">point with a structure tied to it</text><path class="ldr" d="M626.0,129.0 L600.0,70.0"/><text x="596.0" y="74.0" class="e">within 5 m of a free alignment point: on it</text><path class="ldr" d="M330.0,220.0 L300.0,330.0"/><text x="296.0" y="334.0" class="e">reached along it by a span: on it</text><path class="ldr" d="M318.0,172.0 L360.0,120.0"/><text x="364.0" y="124.0">crossing line beside it: not on it</text><path class="ldr" d="M430.0,230.0 L580.0,250.0"/><text x="584.0" y="254.0">junction (on both alignments)</text><text x="70.0" y="285.0" class="lab">alignment 1</text><text x="640.0" y="300.0" class="lab">alignment 2</text><text x="20.0" y="50.0" class="lab">route: both alignments together (the path of the line)</text><rect class="ap" x="20" y="371" width="10" height="10"/><text x="36.0" y="380.0" class="lab">alignment point</text><circle class="dot" cx="160" cy="376" r="4"/><text x="170.0" y="380.0" class="lab">structure on the alignment</text><circle class="ap" cx="356" cy="376" r="4.5"/><text x="366.0" y="380.0" class="lab">structure not on it</text><path class="wire" d="M500,376 L530,376" style="stroke-width:1.4"/><text x="536.0" y="380.0" class="lab">span</text></svg>
