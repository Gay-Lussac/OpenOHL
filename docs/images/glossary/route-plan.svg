<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">Route, alignment and alignment points, in plan</title><desc id="d">Plan view: a route made of two alignments meeting at a junction; each alignment runs through alignment points, and structures stand along it, some tied to an alignment point.</desc><style>svg{--ink:#1f2328;--muted:#59636e;--acc:#0969da;--wire:#bc4c00;--wire2:#1a7f37;--wire3:#8250df;--bg:#ffffff;--fill:#eef1f4;}@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--muted:#9198a1;--acc:#58a6ff;--wire:#f0883e;--wire2:#3fb950;--wire3:#bc8cff;--bg:#0d1117;--fill:#1c2128;}}.bg{fill:var(--bg)}.st{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:var(--muted);stroke-width:1.2;fill:none}.dash{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.str{stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round}.wire{stroke:var(--wire);stroke-width:2.2;fill:none}.wire2{stroke:var(--wire2);stroke-width:2.2;fill:none}.wire3{stroke:var(--wire3);stroke-width:2.2;fill:none}.band{fill:var(--fill);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.box{fill:var(--fill);stroke:var(--muted);stroke-width:1}.ap{fill:var(--bg);stroke:var(--ink);stroke-width:2}.wp{fill:var(--wire);stroke:none}.dot{fill:var(--ink);stroke:none}.ldr{stroke:var(--muted);stroke-width:1;fill:none}text{font:13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.lab{fill:var(--muted);font-size:12px}.t{font-weight:600;font-size:14px}.c{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="760" height="360"/><text x="20.0" y="26.0" class="t">A route in plan: alignments through alignment points</text><path class="st" d="M40,260 L230,210 L430,230 L620,120" style="stroke-width:2"/><path class="st" d="M430,230 L560,310 L730,320" style="stroke-width:2"/><rect class="ap" x="35" y="255" width="10" height="10"/><rect class="ap" x="225" y="205" width="10" height="10"/><rect class="ap" x="425" y="225" width="10" height="10"/><rect class="ap" x="615" y="115" width="10" height="10"/><rect class="ap" x="555" y="305" width="10" height="10"/><rect class="ap" x="725" y="315" width="10" height="10"/><circle class="dot" cx="135.0" cy="235.0" r="4"/><circle class="dot" cx="330.0" cy="220.0" r="4"/><circle class="dot" cx="493.3" cy="193.3" r="4"/><circle class="dot" cx="556.7" cy="156.7" r="4"/><circle class="dot" cx="495.0" cy="270.0" r="4"/><circle class="dot" cx="645.0" cy="315.0" r="4"/><circle class="dot" cx="230.0" cy="210.0" r="4"/><circle class="dot" cx="430.0" cy="230.0" r="4"/><path class="ldr" d="M230.0,210.0 L240.0,150.0"/><text x="244.0" y="154.0">alignment point (a structure tied to it)</text><path class="ldr" d="M620.0,120.0 L600.0,70.0"/><text x="596.0" y="74.0" class="e">alignment point</text><path class="ldr" d="M330.0,220.0 L330.0,290.0"/><text x="334.0" y="294.0">structure on the alignment</text><path class="ldr" d="M430.0,230.0 L570.0,250.0"/><text x="574.0" y="254.0">junction (on both alignments)</text><text x="90.0" y="280.0" class="lab">alignment 1</text><text x="640.0" y="296.0" class="lab">alignment 2</text><text x="20.0" y="50.0" class="lab">route: both alignments together (the path of the line)</text><rect class="ap" x="20" y="331" width="10" height="10"/><text x="36.0" y="340.0" class="lab">alignment point</text><circle class="dot" cx="160" cy="336" r="4"/><text x="170.0" y="340.0" class="lab">structure</text></svg>
