<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>How a route is cut into profile sheets: each sheet holds as many whole spans as fit at the horizontal scale and ends at a structure on the line; a break within the break clearance of another structure, or at a structure beside the line, is not free and the break moves back</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">Where the sheets break</text>
  <text x="20" y="50" fill="#555">Schematic, not to scale. The route seen along its stations; the sheets laid one after the other.</text>

  <!-- ground and wires -->
  <path d="M40,300 C120,290 200,310 300,295 S480,280 560,300 S760,310 960,290" fill="none" stroke="#7b5a2b" stroke-width="1.5"/>
  <path d="M50,190 Q110,235 170,190 Q240,240 310,188 Q370,235 430,190 Q500,240 570,190 Q635,235 700,192 Q760,232 820,190 Q880,232 940,190" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <!-- structures on the line -->
  <g stroke="#000" stroke-width="2">
    <line x1="50" y1="298" x2="50" y2="185"/><line x1="170" y1="296" x2="170" y2="185"/><line x1="310" y1="294" x2="310" y2="183"/>
    <line x1="430" y1="288" x2="430" y2="185"/><line x1="570" y1="300" x2="570" y2="185"/><line x1="700" y1="304" x2="700" y2="187"/>
    <line x1="820" y1="300" x2="820" y2="185"/><line x1="940" y1="291" x2="940" y2="185"/>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="40" y="178">T1</text><text x="160" y="178">T2</text><text x="300" y="176">T3</text><text x="420" y="178">T4</text>
    <text x="560" y="178">T5</text><text x="690" y="180">T6</text><text x="810" y="178">T7</text><text x="930" y="178">T8</text>
  </g>
  <!-- structure beside the line near T7 -->
  <line x1="835" y1="300" x2="835" y2="230" stroke="#7d3c98" stroke-width="2"/>
  <text x="842" y="240" font-size="12" font-weight="bold" fill="#7d3c98">C1</text>
  <rect x="805" y="215" width="44" height="90" fill="#7d3c98" fill-opacity="0.12"/>
  <text x="700" y="330" font-size="11" fill="#7d3c98">C1 beside the line, and the break</text>
  <text x="700" y="344" font-size="11" fill="#7d3c98">clearance around what is drawn of it</text>

  <!-- sheets -->
  <rect x="50" y="90" width="380" height="20" fill="#2e86c1" fill-opacity="0.12" stroke="#2e86c1"/>
  <text x="200" y="105" fill="#2e86c1" font-weight="bold">sheet 1: T1–T4</text>
  <rect x="430" y="90" width="270" height="20" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22"/>
  <text x="480" y="105" fill="#e67e22" font-weight="bold">sheet 2: T4–T6</text>
  <rect x="700" y="90" width="240" height="20" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60"/>
  <text x="760" y="105" fill="#27ae60" font-weight="bold">sheet 3: T6–T8</text>
  <!-- reach of sheet 1 -->
  <path d="M50,130 L470,130" stroke="#555" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="160" y="148" fill="#555" font-size="12">what one sheet holds at the horizontal scale</text>
  <!-- match lines -->
  <g stroke="#555" stroke-dasharray="8,4"><line x1="430" y1="85" x2="430" y2="310"/><line x1="700" y1="85" x2="700" y2="310"/></g>

  <!-- notes -->
  <g fill="#333" font-size="12">
    <text x="40" y="375">• Sheet 1 cannot reach T5: it ends at T4, the last structure on the line within its reach (whole spans only).</text>
    <text x="40" y="395">• Sheet 2 could reach T7, but T7 lies within the break clearance of C1: the break moves back to T6, the last free place that fits.</text>
    <text x="40" y="415">• A structure beside the line (C1) never ends a sheet. When no free place fits, the sheet runs on, drawn anyway, with a warning.</text>
  </g>
</svg>
