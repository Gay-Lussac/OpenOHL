[package]
name = "asce-mop74"
description = "OpenOHL design-code plugin: ASCE MOP 74 reliability-based structural loading"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Built separately from the main workspace, for the wasm32-wasip2 target.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"
serde = { version = "1", features = ["derive"] }
ohl-code-common = { path = "../common" }

[profile.release]
opt-level = "s"
lto = true
strip = true
