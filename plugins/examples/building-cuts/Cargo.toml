[package]
name = "building-cuts"
description = "Example OpenOHL field-presets plugin: buildings near the line, the field's cuts and places of sensitive use"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Built separately from the main workspace, for the wasm32-wasip2 target;
# its own tests run natively (`cargo test` in this folder).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
