[package]
name = "project-bundle"
description = "Example OpenOHL project plugin: a JSON bundle of a line and its library files"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Built separately from the main workspace, for the wasm32-wasip2 target.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
