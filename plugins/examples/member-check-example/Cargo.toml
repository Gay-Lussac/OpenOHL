[package]
name = "member-check-example"
description = "Example plugin: a member check by gross yield and Euler buckling (an illustration, not a design code)"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Built separately from the main workspace, for the wasm32-wasip2 target.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
strip = true
