[[case]]
id = "tb324-011"
title = "TB 324 sec. 2.5: the Drake span between 2 m dead-end strings of 100 kg sags 6.45 m"
calculation = "line.section"
reference = "CIGRE TB 324, sec. 2.5 item 2, p. 16-17"
notes = """Printed: with 2 m dead-end strings of 100 kg at both ends the example span's sag grows
from 6.41 m to 6.45 m. Read as: H = 28 kN (the example's), 300 m between the strings'
attachment points, the sag measured from them.
Model: attachment points (0, 0, 30) and (300, 0, 30) m; strain strings 2 m, 980.665 N, the
line's default stiffness 5e7 N; Drake as the brochure gives it (w = 15.97 N/m, sec. 2.1;
components 402.8 mm² at 55 GPa + 65.8 mm² at 190 GPa, sec. 5.2.3-5.2.4, for its stretch);
the section strung at 28 kN at 15 °C, solved in still air at 15 °C. Expected: the low point
30 - 6.45 = 23.55 m, tolerance 0.005 m (printed to 0.01 m).
Hand: each string hangs at tan(theta) = (V_clamp + W/2) / H = (2364.6 + 490.3) / 28000,
theta = 5.83°: it drops 2 sin(theta) = 0.203 m and shortens the span to 296.02 m, whose sag at
28 kN is 6.251 m (inextensible): 6.454 m. Reference (elastic wire, weight per unstressed metre,
the strings' 1.1 mm stretch): 6.4490 m, low point 23.5510 m.
The bare span's 6.41 m on this page is printed as 6.42 m on p. 11 (6.4204 m)."""
max_seconds = 5.0
expected.low_z_0_m = { value = 23.55, abs_tol = 0.005 }
expected.h_0_n = { value = 28000.0, rel_tol = 1e-7 }

[case.inputs]
weather = { name = "stringing", temperature = "15 °C" }
cable = { id = "drake-tb324", name = "Drake as given in CIGRE TB 324", kind = "acsr", source = "CIGRE TB 324 sec. 2.1 (weight), sec. 5.2.3-5.2.4 (components)", diameter = "28.1 mm", mass_per_length = "1.628487 kg/m", rated_tensile_strength = "140 kN", outer = { area = "402.8 mm²", modulus = "55 GPa", thermal_expansion = 23e-6 }, core = { area = "65.8 mm²", modulus = "190 GPa", thermal_expansion = 11.5e-6 } }
line = '''
{"format": "ohl-line", "version": 6, "name": "TB 324 sec. 2.5", "crs": "local",
 "structures": [
  {"id": "T1", "position": [0, 0, 0], "orientation_deg": -90,
   "points": [{"label": "A1", "position": [0, 0, 30]}],
   "strings": [{"label": "S1", "top": "A1", "wire": "W1", "length": 2.0, "weight": 980.665, "stiffness": 5e7}],
   "wires": [{"label": "W1", "position": [2, 0, 29.8], "set": 1}]},
  {"id": "T2", "position": [300, 0, 0], "orientation_deg": -90,
   "points": [{"label": "A1", "position": [300, 0, 30]}],
   "strings": [{"label": "S1", "top": "A1", "wire": "W1", "length": 2.0, "weight": 980.665, "stiffness": 5e7}],
   "wires": [{"label": "W1", "position": [298, 0, 29.8], "set": 1}]}
 ],
 "sections": [{"id": "S", "cable": "drake-tb324", "bundle": 1,
  "points": [{"structure": "T1", "set": 1}, {"structure": "T2", "set": 1}],
  "stringing": {"kind": "tension", "horizontal_tension": 28000.0, "temperature": 15.0}}]
}
'''

[[case]]
id = "tb324-012"
title = "TB 324 sec. 5.2.3-5.2.4: Drake's composite modulus and expansion from its components"
calculation = "cables.properties"
reference = "CIGRE TB 324, sec. 5.2.3 eq. (19) p. 37 and sec. 5.2.4 eq. (20) and example p. 38-39"
notes = """Inputs p. 39: aluminium 402.8 mm², steel 65.8 mm², total 468.6 mm²; E_A = 55 GPa,
E_S = 190 GPa (p. 37); alpha_A = 23e-6 /K (sec. 5.2.2 p. 36), alpha_S = 11.5e-6 /K (p. 39).
Eq. (19): E_AS = 55 x 402.8/468.6 + 190 x 65.8/468.6 = 47.2774 + 26.6791 = 73.956 GPa,
printed rounded as 74; eq. (20) with that value: 18.851e-6 /K. The brochure prints 18.84e-6,
evaluating eq. (20) with the rounded 74 GPa (that gives 18.840e-6). Expected: the equations
with the printed inputs, tolerance 1e-4 relative (the printed 74 and 18.84 are within their
rounding of the rounded E)."""
inputs = { cable = { id = "drake-tb324", name = "Drake as given in CIGRE TB 324", kind = "acsr", source = "CIGRE TB 324 sec. 5.2.3-5.2.4", diameter = "28.1 mm", mass_per_length = "1.628487 kg/m", rated_tensile_strength = "140 kN", outer = { area = "402.8 mm²", modulus = "55 GPa", thermal_expansion = 23e-6 }, core = { area = "65.8 mm²", modulus = "190 GPa", thermal_expansion = 11.5e-6 } } }
expected.modulus_gpa = { value = 73.956, rel_tol = 1e-4 }
expected.thermal_expansion_per_k = { value = 18.851e-6, rel_tol = 1e-4 }
expected.area_mm2 = { value = 468.6, rel_tol = 1e-9 }

