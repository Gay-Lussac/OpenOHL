# Worked examples of CIGRE Technical Brochure 324, "Sag-tension calculation
# methods for overhead lines" (Working Group B2.12). Inputs and expected values
# are the brochure's printed numbers, cited by section and page (the
# brochure's own page numbers). Each tolerance is the printed rounding
# (half a unit of the last printed digit) unless a case says otherwise.
#
# Independent check of every case: benchmarks/reference/textbook_reference.py
# (tb324_cases) reproduces the printed values from the printed inputs.
# Examples not used, and why: docs/validation/textbook.md.

[[case]]
id = "tb324-001"
title = "TB 324 sec. 2.1-2.4: Drake, 300 m level span, H = 28 kN, w = 15.97 N/m"
calculation = "catenary.span"
reference = "CIGRE TB 324, sec. 2.1 p. 11 (sag), sec. 2.2-2.3 p. 12 (length, slack), sec. 2.4 p. 15 (support tension)"
notes = """Inputs p. 11: S = 300 m, H = 28 kN (20 % RTS), w = 15.97 N/m. Printed: sag 6.420 m
(the parabola 6.417 m, 3 mm less), length 300.366 m (slack 0.366 m, 0.122 %), support tension
H + w D = 28000 + 15.97 x 6.420 = 28102.5 N, printed as H plus 102 N (the product 102.5 N
truncated): expected 28102.5 N, tolerance 0.5 N.
Reference: sag 6.420433 m, length 300.366105 m, T 28102.534 N."""
max_seconds = 1.0
inputs = { span = "300 m", rise = "0 m", horizontal_tension = "28 kN", weight = "15.97 N/m" }
expected.sag_m = { value = 6.420, abs_tol = 0.0005 }
expected.length_m = { value = 300.366, abs_tol = 0.0005 }
expected.tension_left_n = { value = 28102.5, abs_tol = 0.5 }
expected.low_point_x_m = { value = 150.0, abs_tol = 1e-6 }

[[case]]
id = "tb324-002"
title = "TB 324 sec. 2.3: 100 mm more wire in the Drake span — sag 7.241 m at 24.8 kN"
calculation = "catenary.tension_for_sag"
reference = "CIGRE TB 324, sec. 2.3 p. 13"
notes = """Printed (parabolic): with 0.1 m added to the 0.366 m slack, D = sqrt(3 x 300 x 0.466 / 8)
= 7.241 m and H = w S^2 / 8D = 24.8 kN. The case gives the code the sag and asks for H by the
exact catenary: 24831.1 N (reference) — 24.8 kN to the printed digits; tolerance 50 N."""
max_seconds = 1.0
inputs = { span = "300 m", rise = "0 m", weight = "15.97 N/m", sag = "7.241 m" }
expected.horizontal_tension_n = { value = 24800.0, abs_tol = 50.0 }

# Table 2 (sec. 2.7, p. 20): 300 m span, Drake, H = 28000 N, w = 15.96 N/m
# (the value of the worked example on p. 19), one support h lower. The
# brochure's R (lower) support is the code's left support (x = 0), its L
# (higher) the right one: low_point_x_m = Xr, tension_left_n = Tr,
# tension_right_n = Tl. Xr is printed to 0.01 m (tolerance 0.005 m),
# tensions to 1 N (0.5 N). Vr < 0 from h = 30 m: the low point is beyond
# the lower support and the wire pulls it up (uplift).

