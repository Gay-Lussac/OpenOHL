# No range given (2026-10-22): an INVENTED soft cable — the synthetic
# curves above with every stress a tenth (moduli 55 and 190 MPa per %),
# neither component with a max_strain. Strung at 25 kN, at the max load
# case (30 N/m, -10 °C) its strain passes 1 % (hand estimate: a composite
# stiffness of about 3 MN per unit strain, a tenth of the synthetic
# cable's, so some 35-45 kN strain it beyond 1 %; nonlinear-006 counts
# it with a range of 1 % given). Without a max_strain there is no warning
# (owner, 2026-10-22: no 1 % default).
[[case]]
id = "nonlinear-005"
title = "Invented soft cable without max_strain, strained beyond 1 %: no range warning"
calculation = "sagtension.nonlinear"
reference = "Owner decision 2026-10-22 (no range given, no warning); the strain beyond 1 % shown by nonlinear-006"
