# Beyond the curves' range (2026-10-22): the SYNTHETIC cable of
# nonlinear.toml (invented curves, not a real conductor) with the outer
# strands' curves valid only up to 0.2 % strain (`max_strain = 0.2`). The
# polynomial is still evaluated beyond it; the results warn when a state's
# strain at the most tensioned support passes it (`beyond_range`: the number
# of warnings over the initial state and both final states).
#
# Hand check (the model of benchmarks/sagtension/reference_nonlinear.py,
# the same case as nonlinear-002): at the max load case, -10 °C, 30 N/m,
# H = 41996.10 N, the support tension H cosh(S/2C) = 42237.01 N gives a
# total strain of 0.15484 %; the outer strands' mechanical strain is
# 0.15484 % - 23e-6 x (-10 - 20) = 0.22384 % > 0.2 %: a warning in each of
# the three states (both final states reload onto the initial curve
# there). At 75 °C (as nonlinear-001): 20389.83 N, 0.18764 % total, outer
# 0.18764 % - 23e-6 x 55 = 0.06114 % < 0.2 %: none. The core gives no
# max_strain: no range, never warned (owner, 2026-10-22; until then a 1 %
# default, which its 0.189 % and 0.124 % stayed within: the counts are
# unchanged). nonlinear-005 below: the core strained beyond 1 % without a
# range gives no warning.

[[case]]
id = "nonlinear-003"
title = "Synthetic cable, outer curves valid to 0.2 %: the max load case is beyond the range (3 warnings)"
calculation = "sagtension.nonlinear"
reference = "Hand check of the strain at the support (benchmarks/sagtension/reference_nonlinear.py's model)"
max_seconds = 2.0
expected.beyond_range = { value = 3.0, abs_tol = 0.0 }
expected.h_initial_n = { value = 41996.09907, rel_tol = 1e-7 }

[case.inputs]
span = "300 m"
known_tension = "25 kN"
known_load = "15.690640 N/m"
known_temperature = "15 °C"
creep_load = "15.690640 N/m"
creep_temperature = "15 °C"
max_load = "30 N/m"
max_temperature = "-10 °C"
load = "30 N/m"
temperature = "-10 °C"

[case.inputs.cable]
id = "synthetic"
name = "Synthetic ACSR-like test cable"
kind = "acsr"
source = "Synthetic test data — not a real conductor"
diameter = "28 mm"
mass_per_length = "1.6 kg/m"
rated_tensile_strength = "140 kN"
outer = { area = "400 mm²", modulus = "55 GPa", thermal_expansion = 23.0e-6, stress_strain = { stress_unit = "MPa", initial = [0.0, 250.0, -110.0, 40.0, -8.0], creep = [0.0, 160.0, -60.0, 15.0, -2.0], final_modulus = 550.0, max_compression = 0.0, max_strain = 0.2 } }
core = { area = "65 mm²", modulus = "190 GPa", thermal_expansion = 11.5e-6, stress_strain = { stress_unit = "MPa", initial = [0.0, 1800.0, -120.0, 30.0, -5.0], final_modulus = 1900.0 } }

[[case]]
id = "nonlinear-004"
title = "Synthetic cable, outer curves valid to 0.2 %: at 75 °C within the range (no warning)"
calculation = "sagtension.nonlinear"
reference = "Hand check of the strain at the support (benchmarks/sagtension/reference_nonlinear.py's model)"
max_seconds = 2.0
expected.beyond_range = { value = 0.0, abs_tol = 0.0 }
