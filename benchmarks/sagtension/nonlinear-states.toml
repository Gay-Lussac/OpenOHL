# By hand (the signed set): the core's initial curve rises at 1950 MPa/% at
# zero strain, more steeply than its final modulus (1900 MPa/%), so its set
# e - P(e)/EA_f at the load-stretch point is negative (-0.0023 %). The final
# line EA_f (e - e_p) passes through that point: reloaded to the same case
# the cable is back on the initial curve, so after load equals initial
# (load_final_over_initial = 1). A set clamped at zero would put the core's
# final line under the initial curve there and the final tension below the
# initial one.
[[case]]
id = "nlstate-004"
title = "Invented cable (signed set), level 300 m strung at 25 kN at 15 °C: the load-stretch case (30 N/m, -10 °C): after load equals initial (the core's negative set), after creep governs"
calculation = "sagtension.nonlinear"
reference = "Independent re-implementation (benchmarks/sagtension/reference_invented_states.py)"
max_seconds = 5.0
expected.h_initial_n = { value = 42243.55136, rel_tol = 1e-7 }
expected.h_final_creep_n = { value = 41954.90356, rel_tol = 1e-7 }
expected.h_final_load_n = { value = 42243.55136, rel_tol = 1e-7 }
expected.h_final_n = { value = 41954.90356, rel_tol = 1e-7 }
expected.final_cause = { value = 0, abs_tol = 0.0 }
expected.load_final_over_initial = { value = 1.0, abs_tol = 1e-6 }
expected.beyond_range = { value = 0.0, abs_tol = 0.0 }

