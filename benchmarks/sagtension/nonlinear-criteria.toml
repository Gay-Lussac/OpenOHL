# Tension criteria on the non-linear model (2026-10-22), each in a
# condition: initial (as strung), after creep, after load. The unknown is the
# stringing tension (horizontal, 60 °F, bare, initial curve); each trial
# strings the cable, takes both permanent sets from it and solves each
# criterion's case in its condition; the governing criterion is found by
# iteration (a bisection per criterion, then a check of all at the smallest,
# repeated while one is above its limit).
#
# The cable and cases of crosscheck-drake.toml: the DRAKE-LIKE test cable
# (curves from a public-domain library's test data, source not stated; test
# input only, not CIGRE TB 324 data), level 365.76 m; creep 60 °F bare;
# heaviest load 0.5 in ice, 8 psf, 0 °F. RTS 140118.981 N.
#
# Expected values: benchmarks/sagtension/reference_crosscheck.py (the
# independent model of crosscheck-drake.toml; a bisection of fixed length per
# criterion, then the same check). Tolerance 1e-7 relative on the tension
# (the code's bisection stops at 1e-10, the reference's at 75 kN / 2^48),
# 1e-6 on the utilisations.

# Hand: the criterion's case is the reference case on the initial curve, so the
# stringing tension is the limit, 26689.329692 N.
[[case]]
id = "nlcrit-001"
title = "Non-linear criteria, Drake-like cable 365.76 m: H initial at 60 °F <= 26689.33 N: the stringing tension itself"
calculation = "sagtension.nonlinear_criteria"
reference = "Independent re-implementation (benchmarks/sagtension/reference_crosscheck.py)"
max_seconds = 20.0
expected.reference_tension_n = { value = 26689.32969, rel_tol = 1e-7 }
expected.governing_index = { value = 0, abs_tol = 0.0 }
expected.utilisation_0 = { value = 1, abs_tol = 1e-6 }

[case.inputs]
span = "365.76 m"
known_load = "15.965729813 N/m"
known_temperature = "15.555555556 °C"
creep_load = "15.965729813 N/m"
creep_temperature = "15.555555556 °C"
max_load = "36.865347248 N/m"
max_wind = "20.509298261 N/m"
max_temperature = "-17.777777778 °C"
criteria = [
  { label = "H initial 60 F", load = "15.965729813 N/m", temperature = "15.555555556 °C", condition = "initial", limit = "horizontal", value = "26689.329692 N" },
]

[case.inputs.cable]
id = "drake-like"
name = "Drake-like test cable"
kind = "acsr"
source = "curves from a public-domain library's test data, source not stated; test input only, not CIGRE TB 324 data"
diameter = "28.1432 mm"
mass_per_length = "1.628051354 kg/m"
rated_tensile_strength = "140118.981 N"
outer = { area = "400 mm²", modulus = "60 GPa", thermal_expansion = 2.304e-05, stress_strain = { stress_unit = "psi", basis = "total", initial = [-1213, 44308.1, -14004.4, -37618, 30676], creep = [-544.8, 21426.8, -18842.2, 5495, 0], final_modulus = 64000.0, max_compression = 0.0, max_strain = 0.912980, reference_temperature = "21.111111 °C" } }
