# Tension criteria on the non-linear model (2026-10-22), each in a
# condition: initial (as strung), after creep, after load. The unknown is the
# stringing tension (horizontal, 15 °C, bare, initial curve); each trial
# strings the cable, takes both permanent sets from it and solves each
# criterion's case in its condition; the governing criterion is found by
# iteration (a bisection per criterion, then a check of all at the smallest,
# repeated while one is above its limit).
#
# The cable and cases of nonlinear-states.toml: the INVENTED test cable (not
# a real conductor), level 300 m; creep 15 °C bare; heaviest load 30 N/m at
# -10 °C; RTS 140 kN. The limits are INVENTED (fractions of that RTS), not
# from any code or utility. These cases replace those on the Drake-like
# cable (removed 2026-10-22).
#
# Expected values: benchmarks/sagtension/reference_invented_states.py (a
# bisection of fixed length per criterion, then the same check). Tolerance
# 1e-7 relative on the tension (the code's bisection stops at 1e-10, the
# reference's at 75 kN / 2^48), 1e-6 on the utilisations.

# By hand: the criterion's case is the reference case on the initial curve, so
# the stringing tension is the limit, 25000 N.
[[case]]
id = "nlcrit-001"
title = "Non-linear criteria, invented cable 300 m: H initial at 15 °C <= 25000 N: the stringing tension itself"
calculation = "sagtension.nonlinear_criteria"
reference = "Independent re-implementation (benchmarks/sagtension/reference_invented_states.py)"
max_seconds = 20.0
expected.reference_tension_n = { value = 25000, rel_tol = 1e-7 }
expected.governing_index = { value = 0, abs_tol = 0.0 }
expected.utilisation_0 = { value = 1, abs_tol = 1e-6 }

[case.inputs]
span = "300 m"
known_load = "15.690640 N/m"
known_temperature = "15 °C"
creep_load = "15.690640 N/m"
creep_temperature = "15 °C"
max_load = "30 N/m"
max_temperature = "-10 °C"
criteria = [
  { label = "H initial 15 C", load = "15.690640 N/m", temperature = "15 °C", condition = "initial", limit = "horizontal", value = "25000 N" },
]

[case.inputs.cable]
id = "invented-signed-set"
name = "Invented test cable (core steeper than its final modulus)"
kind = "acsr"
source = "Invented test data — not a real conductor"
diameter = "28 mm"
mass_per_length = "1.6 kg/m"
rated_tensile_strength = "140 kN"
outer = { area = "400 mm²", modulus = "55 GPa", thermal_expansion = 23.0e-6, stress_strain = { stress_unit = "MPa", initial = [0.0, 250.0, -110.0, 40.0, -8.0], creep = [0.0, 160.0, -60.0, 15.0, -2.0], final_modulus = 550.0, max_compression = 0.0, reference_temperature = "20 °C" } }
core = { area = "65 mm²", modulus = "190 GPa", thermal_expansion = 11.5e-6, stress_strain = { stress_unit = "MPa", initial = [0.0, 1950.0, -150.0, 30.0, -5.0], creep = [0.0, 1850.0, -120.0, 30.0, -5.0], final_modulus = 1900.0, max_compression = 0.0, reference_temperature = "20 °C" } }

