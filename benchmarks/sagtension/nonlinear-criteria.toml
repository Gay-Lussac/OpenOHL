# Estimate by hand from xdrake-001 (strung at 26689.33 N: after creep 24822.22 N,
# after load 24727.59 N at 60 °F, about proportional): 20 % RTS initial gives
# 28023.8 N; 15 % RTS = 21017.8 N after creep gives about 21017.8 / 0.9300
# = 22599 N; H/w <= 1400 m (22352.0 N) after load about 22352.0 / 0.9265
# = 24125 N; the heavy case far below 50 % RTS. After creep governs; the
# proportion overestimates it (the creep set grows with the stringing
# tension, the H lost to it with it): the reference gives 21975.9 N.
