# Textbook change of state of a single span (linear elastic + thermal),
# for temperature, ice and wind, at high temperature, and creep taken as an
# equivalent temperature (the line's linear cable model, FE and RS).
#
# Cable (invented textbook data, used by every textbook file): 400 mm² at
# 75 GPa (EA = 30 MN), alpha = 20e-6 /K, 1.6 kg/m (w = 15.69064 N/m with
# g = 9.80665), diameter 28 mm. Strung at H = 25 kN at 10 °C.
#
# Expected values: benchmarks/reference/textbook_reference.py — the span
# by quadrature (see textbook-catenary.toml), the mean tension from the
# same integrals, and a secant root on log H of the model the calculation
# documents (docs/theory/sagtension.md): L = L0 exp(alpha dt) (1 + Tmean/EA),
# the cable's own weight conserved (owner decision 2026-10-21): 15.69064 N/m
# per metre of unstressed cable at 10 °C, so per metre of the span's length
# L it is 15.69064 L0 / L (a fixed point: L depends on the load); ice and
# wind per metre of the real cable as given. Before 2026-10-21 the weight
# per metre of stretched cable stayed 15.69064 N/m, and a span grew heavier
# with its length (+0.25 % at 150 °C; each case's old value in its notes).
#
# Hand check, every case: the classical parabolic change-of-state cubic
# (strain from H, additive thermal form)
#     H2^2 [H2 - K] = M,  K = H1 - EA w1^2 S^2 / (24 H1^2) - EA alpha (t2 - t1),
#     M = EA w2^2 S^2 / 24
# with the loads per metre of stretched cable: strung, w1 = 15.69064 /
# (1 + 25 kN / 30 MN) = 15.67758 N/m, so EA w1^2 S^2 / (24 H1^2) = 44241.5 N;
# w2 the own weight over the stretch at t2 (printed by the reference as
# load_per_stretched_m), plus ice. Its known error against the exact
# catenary with the mean tension is a few 0.01 % (stated per case); it
# confirms the expected values to 3 digits. Total weight, every case: the
# reference's load per metre times the length is 15.69064 L0 (plus the ice).
#
# Tolerance: 1e-7 relative (the code's change of state iterates to far
# below it; the reference is good to 1e-12). Sags, lengths 1e-7 / 1e-9.

[[case]]
id = "tbcos-001"
title = "Level 300 m: 25 kN at 10 °C -> 70 °C (temperature rise)"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py)"
notes = """Load at 70 °C 15.66175 N/m (the own weight over exp(60 alpha)(1 + Tmean/EA)).
Cubic: K = 25000 - 44241.5 - 30e6 x 20e-6 x 60 = -55241.5 N, M = 30e6 x 15.66175^2 x 300^2 / 24
= 2.75952e13 N^3: H2 = 19247.3 N (the exact 19242.87 N is 0.023 % lower). Sag w S^2 / 8H =
9.157 m parabolic, catenary 9.1677 m. Before 2026-10-21 (15.69064 N/m per stretched metre):
19265.84 N, 9.1737 m (H 0.12 % higher)."""
max_seconds = 1.0
inputs = { span = "300 m", rise = "0 m", axial_stiffness = "30e6 N", thermal_expansion = 20e-6, known_tension = "25 kN", known_load = "15.69064 N/m", known_temperature = "10 °C", load = "15.69064 N/m", temperature = "70 °C" }
expected.horizontal_tension_n = { value = 19242.8746, rel_tol = 1e-7 }
expected.sag_m = { value = 9.167739335, rel_tol = 1e-7 }
expected.length_m = { value = 300.7457906, rel_tol = 1e-9 }
expected.tension_left_n = { value = 19386.45745, rel_tol = 1e-7 }

