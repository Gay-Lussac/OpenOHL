[[case]]
id = "tbcos-004"
title = "Level 300 m: thermal sag at 150 °C"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py)"
notes = """Cubic: K = 25000 - 44315.3 - 84000 = -103315.3 N, M = 2.76971e13: H2 = 15282.0 N
(exact 15275.27 N, -0.044 %). Sag 11.5788 m: 4.51 m more than when strung (7.0660 m).
