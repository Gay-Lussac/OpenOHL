# A heated span weighs what it weighs when strung (owner decision
# 2026-10-21): a level 400 m span between fixed wire points at 30 m, strung
# at 25 kN at 10 °C, at 150 °C — the closed-form change of state, the
# finite elements and the line's ruling-span method, each against the
# reference (benchmarks/reference/textbook_reference.py, heated_span_cases).
#
# Hand check of the weight, all three: a level span hangs symmetrically,
# so each support carries half the span's weight, and
#     2 sqrt(Tmax^2 - H^2) = w L0 = 15.69378 N/m x 400.7151 m = 6288.73 N
# (w the data sheet's 15.69064 N/m at 20 °C per metre at the stringing
# temperature, 10 °C: x exp(10 alpha); L0 the unstressed length as strung
# at 10 °C; the closed form's the same to 0.2 mm). From the expected
# values: FE 2 sqrt(18010.65477^2 - 17734.05312^2) = 6288.73 N; closed
# form 2 sqrt(18010.64164^2 - 17734.03979^2) = 6288.73 N; RS
# 2 sqrt(18018.80616^2 - 17742.33168^2) = 6288.73 N. With the weight taken
# at 10 °C (before 2026-10-21): 6287.47 N, FE 17732.40 N. Before the
# weight was conserved the FE span weighed 6305.10 N at 150 °C (+0.28 %,
# by exp(140 alpha)) and carried 17779.38 N (+0.27 %), sag 17.6857 m
# (+2.7 mm); the closed form 17782.28 N.
#
# The three differ only by their models: the closed form spreads the
# weight evenly over the stretched span and stretches it by its mean
# tension (FE - closed form: 0.013 N, 7.5e-7); the RS method adds its
# strains (1 + eps = 1 + T/EA + alpha dt instead of exp(alpha dt)(1 + T/EA):
# (alpha dt)^2 / 2 + alpha dt T/EA, about 6e-6 of length here), 8.28 N
