# Creep as an equivalent temperature: the wire library's linear model
# `linear_creep_temperature` (creep_temperature_shift = 25 °C) after creep,
# one dead-end span of 300 m between fixed wire points at 30 m height, the
# line's solver (line.section), the creep case "everyday" at 10 °C.
# Expected: the permanent stretch alpha x 25 = 500 µstrain lengthens the
# unstressed length (FE: L0 (1 + 5e-4) exp(alpha dt), the element's own
# elastic catenary; RS: the ruling-span model's additive strain).
# Hand: after creep at 10 °C the span hangs as when strung and warmed to
# 35 °C — the reference's FE at 35 °C gives 22143.91 N, sag 7.97308 m,
# 0.003 % / 0.2 mm from the creep state (the two forms differ by
# (alpha dt)^2 / 2 and by the weight per metre of the thermally longer
# unstressed length, see docs/validation/textbook.md).

[[case]]
id = "tbcreep-001"
title = "Creep as +25 °C (linear model), finite elements: dead-end span 300 m at 10 °C"
calculation = "line.section"
reference = "Independent elastic span by quadrature (benchmarks/reference/textbook_reference.py)"
max_seconds = 5.0
expected.h_0_n = { value = 22144.52732, rel_tol = 1e-7 }
expected.sag_0_m = { value = 7.972860915, abs_tol = 1e-6 }

[case.inputs]
weather = { name = "everyday", temperature = "10 °C" }
cable = { id = "tb", name = "Textbook cable", kind = "aaac", source = "Invented textbook data", diameter = "28 mm", mass_per_length = "1.6 kg/m", rated_tensile_strength = "120 kN", model = "linear_creep_temperature", creep_temperature_shift = 25.0, outer = { area = "400 mm²", modulus = "75 GPa", thermal_expansion = 20e-6 } }
line = '''
{"format": "ohl-line", "version": 6, "name": "creep", "crs": "local",
 "creep_stretch": {"creep_case": "everyday"},
 "structures": [
  {"id": "T1", "position": [0, 0, 0], "orientation_deg": -90,
   "wires": [{"label": "W1", "position": [0, 0, 30], "set": 1}]},
  {"id": "T2", "position": [300, 0, 0], "orientation_deg": -90,
   "wires": [{"label": "W1", "position": [300, 0, 30], "set": 1}]}
 ],
 "sections": [{"id": "S", "cable": "tb", "bundle": 1, "calculation": "creep-fe",
  "points": [{"structure": "T1", "set": 1}, {"structure": "T2", "set": 1}],
  "stringing": {"kind": "tension", "horizontal_tension": 25000.0, "temperature": 10.0}}]
}
'''

[[case]]
id = "tbcreep-002"
title = "Creep as +25 °C (linear model), ruling span: dead-end span 300 m at 10 °C"
calculation = "line.section"
reference = "Independent quadrature + secant, additive strain (benchmarks/reference/textbook_reference.py)"
notes = """RS: L0 = L(25 kN) / (1 + Tmean/EA + alpha (10 - 20)) at stringing (20 °C: the linear
model's reference temperature), times 1 + 5e-4; then sum L / (1 + Tmean/EA + alpha (t - 20)) = L0.
Hand: as the change of state to 35 °C, 22146.2 N vs FE 22144.5 N: the RS method's additive
thermal form and weight per metre of stretched cable against the FE's (0.008 %)."""
max_seconds = 5.0
expected.h_0_n = { value = 22146.18506, rel_tol = 1e-7 }
expected.sag_0_m = { value = 7.978164344, abs_tol = 1e-6 }

[case.inputs]
