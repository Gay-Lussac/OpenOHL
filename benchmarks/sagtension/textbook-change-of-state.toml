notes = """Ice (textbook-ice-wind.toml, tbwx-001): 913 x 9.80665 x pi/4 x (0.052^2 - 0.028^2)
= 13.50152 N/m, total 29.19216 N/m as given; per metre of the stretched cable 29.17458 N/m
