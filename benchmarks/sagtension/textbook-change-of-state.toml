# The data sheet's weight at its reference temperature (owner decision
# 2026-10-21): a cable library gives its mass per metre at the data sheet's
# reference temperature (the cable's `reference_temperature`, else 20 °C);
# strung at t_s, a metre of unstressed cable holds w exp(-alpha (t_s - t_ref))
# of it, conserved from there. Every line-model case above (and in the
# other textbook files) takes the textbook cable's 1.6 kg/m at 20 °C,
# strung at 10 °C: 15.69064 exp(10 alpha) = 15.69378 N/m (+0.020 %). These
# two cases check it where t_s and t_ref are given apart.

[[case]]
id = "tbwref-001"
title = "Level 300 m: 25 kN at 10 °C -> 70 °C, the weight given at 20 °C (closed form)"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py, weight_reference_cases)"
notes = """tbcos-001 with its weight given at 20 °C (input weight_temperature): per metre of unstressed
cable at the stringing temperature, 10 °C, it is 15.69064 exp(-20e-6 x (10 - 20)) = 15.69378 N/m
(hand: 15.69064 x 1.000200020). Load per stretched metre at 70 °C 15.66488 N/m (the 15.69378
over exp(60 alpha)(1 + Tmean/EA)). Cubic as tbcos-001 with w1 = 15.69378 / (1 + 25 kN / 30 MN)
= 15.68071 N/m (EA w1^2 S^2 / 24 H1^2 = 44259.2 N, K = -55259.2 N), M = 30e6 x 15.66488^2 x 300^2
/ 24 = 2.76062e13: H2 = 19248.7 N (the exact 19244.26 N). 1.38 N (0.0072 %) above tbcos-001,
where the weight is the stringing temperature's: the heavier cable sags more when strung, so the
same tension leaves less slack."""
