# Textbook change of state of a single span (linear elastic + thermal),
# for temperature, ice and wind, at high temperature, and creep taken as an
# equivalent temperature (the line's linear cable model, FE and RS).
#
# Cable (invented textbook data, used by every textbook file): 400 mm² at
# 75 GPa (EA = 30 MN), alpha = 20e-6 /K, 1.6 kg/m (w = 15.69064 N/m with
# g = 9.80665), diameter 28 mm. Strung at H = 25 kN at 10 °C.
#
# Expected values: benchmarks/reference/textbook_reference.py — the span
# by quadrature (see textbook-catenary.toml), the mean tension from the
# same integrals, and a secant root on log H of the model the calculation
# documents (docs/theory/sagtension.md): L = L0 exp(alpha dt) (1 + Tmean/EA).
#
# Hand check, every case: the classical parabolic change-of-state cubic
# (strain from H, additive thermal form)
#     H2^2 [H2 - K] = M,  K = H1 - EA w1^2 S^2 / (24 H1^2) - EA alpha (t2 - t1),
#     M = EA w2^2 S^2 / 24
# Here EA w1^2 S^2 / (24 H1^2) = 2.7697e13 / 6.25e8 = 44315.3 N. Its known
# error against the exact catenary with the mean tension is a few 0.01 %
# (stated per case); it confirms the expected values to 3 digits.
#
# Tolerance: 1e-7 relative (the code's change of state iterates to far
# below it; the reference is good to 1e-12). Sags, lengths 1e-7 / 1e-9.

[[case]]
id = "tbcos-001"
title = "Level 300 m: 25 kN at 10 °C -> 70 °C (temperature rise)"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py)"
notes = """Cubic: K = 25000 - 44315.3 - 30e6 x 20e-6 x 60 = -55315.3 N, M = 2.76971e13 N^3:
H2 = 19270.3 N (the exact 19265.84 N is 0.023 % lower). Sag w S^2 / 8H = 9.162 m parabolic,
catenary 9.1737 m."""
max_seconds = 1.0
inputs = { span = "300 m", rise = "0 m", axial_stiffness = "30e6 N", thermal_expansion = 20e-6, known_tension = "25 kN", known_load = "15.69064 N/m", known_temperature = "10 °C", load = "15.69064 N/m", temperature = "70 °C" }
expected.horizontal_tension_n = { value = 19265.84218, rel_tol = 1e-7 }
expected.sag_m = { value = 9.173714837, rel_tol = 1e-7 }
expected.length_m = { value = 300.7467615, rel_tol = 1e-9 }
expected.tension_left_n = { value = 19409.78363, rel_tol = 1e-7 }

[[case]]
id = "tbcos-002"
title = "Level 300 m: 25 kN at 10 °C -> 12 mm radial glaze ice at -5 °C"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py)"
notes = """Ice (textbook-ice-wind.toml, tbwx-001): 913 x 9.80665 x pi/4 x (0.052^2 - 0.028^2)
= 13.50152 N/m, total 29.19216 N/m. Cubic: K = 25000 - 44315.3 + 9000 = -10315.3 N,
M = 30e6 x 29.19216^2 x 300^2 / 24 = 9.58705e13: H2 = 42575.0 N (exact 42568.11 N, -0.016 %).
The sag grows from 7.0660 m (strung) to 7.7218 m: the cable stretches elastically by about
(42.7 - 25.1) kN / 30 MN = 590 µstrain and shrinks by 300 µstrain with the cold."""
max_seconds = 1.0
inputs = { span = "300 m", rise = "0 m", axial_stiffness = "30e6 N", thermal_expansion = 20e-6, known_tension = "25 kN", known_load = "15.69064 N/m", known_temperature = "10 °C", load = "29.19215686 N/m", temperature = "-5 °C" }
expected.horizontal_tension_n = { value = 42568.107, rel_tol = 1e-7 }
expected.sag_m = { value = 7.721777643, rel_tol = 1e-7 }
expected.length_m = { value = 300.5293537, rel_tol = 1e-9 }
expected.tension_left_n = { value = 42793.52234, rel_tol = 1e-7 }

[[case]]
id = "tbcos-003"
title = "Level 300 m: 25 kN at 10 °C -> 600 Pa wind at 10 °C (resultant load in the blown plane)"
calculation = "sagtension.change_of_state"
