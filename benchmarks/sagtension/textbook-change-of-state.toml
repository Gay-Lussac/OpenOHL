[[case]]
id = "tbheat-003"
title = "Level 400 m at 150 °C, total weight constant: the line's ruling-span method"
calculation = "line.section"
reference = "Independent quadrature + secant, additive strain (benchmarks/reference/textbook_reference.py)"
notes = """Additive strain eps = T/EA + alpha (t - 20 °C); the own weight per stretched metre
