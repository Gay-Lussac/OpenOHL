42571.05 N, -0.016 %). The sag grows from 7.0602 m (strung) to 7.7166 m: the cable stretches
elastically by about (42.7 - 25.1) kN / 30 MN = 590 µstrain and shrinks by 300 µstrain with the
cold. Before 2026-10-21: 42568.11 N."""
