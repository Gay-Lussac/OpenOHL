expected.tension_left_n = { value = 15456.94447, rel_tol = 1e-7 }

[[case]]
id = "tbcos-005"
title = "Inclined 300 m, rise 50 m: 25 kN at 10 °C -> 80 °C"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py)"
notes = """The level-span cubic (span 300 m) gives 18614.9 N, 0.53 % above the exact 18517.59 N:
