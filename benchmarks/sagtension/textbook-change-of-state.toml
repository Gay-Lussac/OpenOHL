# A heated span weighs what it weighs when strung (owner decision
# 2026-10-21): a level 400 m span between fixed wire points at 30 m, strung
# at 25 kN at 10 °C, at 150 °C — the closed-form change of state, the
# finite elements and the line's ruling-span method, each against the
# reference (benchmarks/reference/textbook_reference.py, heated_span_cases).
#
# Hand check of the weight, all three: a level span hangs symmetrically,
# so each support carries half the span's weight, and
#     2 sqrt(Tmax^2 - H^2) = w L0 = 15.69064 N/m x 400.7147 m = 6287.47 N
# (L0 the unstressed length as strung at 10 °C; the closed form's
# 400.7147 m the same to 0.2 mm). From the expected values: FE
# 2 sqrt(18008.91428^2 - 17732.39756^2) = 6287.47 N; closed form
# 2 sqrt(18008.90116^2 - 17732.38424^2) = 6287.47 N; RS
# 2 sqrt(18017.0662^2 - 17740.67664^2) = 6287.47 N. Before 2026-10-21 the
# FE span weighed 6305.10 N at 150 °C (+0.28 %, by exp(140 alpha)) and
# carried 17779.38 N (+0.27 %), sag 17.6857 m (+2.7 mm); the closed form
# 17782.28 N.
#
# The three differ only by their models: the closed form spreads the
# weight evenly over the stretched span and stretches it by its mean
# tension (FE - closed form: 0.013 N, 7.5e-7); the RS method adds its
# strains (1 + eps = 1 + T/EA + alpha dt instead of exp(alpha dt)(1 + T/EA):
# (alpha dt)^2 / 2 + alpha dt T/EA, about 6e-6 of length here), 8.28 N
# (0.047 %) above the FE.

[[case]]
id = "tbheat-001"
title = "Level 400 m at 150 °C, total weight constant: closed-form change of state"
calculation = "sagtension.change_of_state"
reference = "Independent quadrature + secant (benchmarks/reference/textbook_reference.py)"
notes = """Load per stretched metre 15.69064 / (exp(140 alpha)(1 + Tmean/EA)); 2 sqrt(Tmax^2 - H^2)
= 6287.470 N = 15.69064 x 400.7147 m. Before 2026-10-21: 17782.28 N (+0.28 %)."""
max_seconds = 1.0
inputs = { span = "400 m", rise = "0 m", axial_stiffness = "30e6 N", thermal_expansion = 20e-6, known_tension = "25 kN", known_load = "15.69064 N/m", known_temperature = "10 °C", load = "15.69064 N/m", temperature = "150 °C" }
expected.horizontal_tension_n = { value = 17732.38424, rel_tol = 1e-7 }
expected.sag_m = { value = 17.68296317, rel_tol = 1e-7 }
expected.length_m = { value = 402.0770323, rel_tol = 1e-9 }
expected.tension_left_n = { value = 18008.90116, rel_tol = 1e-7 }

[[case]]
id = "tbheat-002"
title = "Level 400 m at 150 °C, total weight constant: finite elements"
calculation = "line.section"
reference = "Independent elastic span by quadrature (benchmarks/reference/textbook_reference.py)"
notes = """The element's unstressed length L0 exp(140 alpha), the own weight per unit of it
15.69064 exp(-140 alpha) N/m: 2 sqrt(Tmax^2 - H^2) = 6287.470 N = 15.69064 x 400.714704 m.
Before 2026-10-21: 17779.38 N, 6305.10 N of weight."""
max_seconds = 5.0
expected.h_0_n = { value = 17732.39756, rel_tol = 1e-7 }
expected.max_tension_0_n = { value = 18008.91428, rel_tol = 1e-7 }
expected.sag_0_m = { value = 17.68297723, abs_tol = 1e-6 }

