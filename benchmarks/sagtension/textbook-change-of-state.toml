max_seconds = 1.0
inputs = { span = "300 m", rise = "50 m", axial_stiffness = "30e6 N", thermal_expansion = 20e-6, known_tension = "25 kN", known_load = "15.69064 N/m", known_temperature = "10 °C", load = "15.69064 N/m", temperature = "80 °C" }
expected.horizontal_tension_n = { value = 18517.59043, rel_tol = 1e-7 }
expected.sag_m = { value = 9.676462762, rel_tol = 1e-7 }
expected.length_m = { value = 304.9355368, rel_tol = 1e-9 }
