[[case]]
id = "hotcreep-003"
title = "INVENTED law alone at 30 MPa held: 500 h at 100 °C, then 100 h at 150 °C by strain hardening"
calculation = "cables.hot_creep"
reference = "By hand (the comments above) and benchmarks/reference/textbook_reference.py"
