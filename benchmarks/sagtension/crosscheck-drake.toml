# Cross-check of the non-linear (shell/core) model on a Drake-like cable
# against an independent implementation, with the conventions matched.
#
# THE CURVES: from a public-domain library's test data (its test fixture
# names the cable "ACSR Drake"; the source of the curves is not stated).
# They are test input only: not CIGRE TB 324 data, not a manufacturer's.
# Degree-4 polynomials in psi on the total area, strain in %, at 70 °F;
# final moduli 64000 (shell) and 37000 (core) psi/%; the validity limits
# converted from the library's load limits to strains (0.91298 % and
# 0.650017 %); neither component takes compression (the library: core
# compression modulus 0, shell taken as 0 too). The component areas split
# the total 468.6442 mm² arbitrarily (no effect: total-area basis).
# The core's initial curve rises more steeply at zero strain (38629
# psi/%) than its final modulus (37000): its permanent set is negative,
# -0.003 % (the case of the 2026-10-22 fix, decision log).
#
# Span: level 1200 ft (365.76 m), strung at H = 6000 lbf (26689.33 N) at
# 60 °F on the initial curve; own weight 1.094 lb/ft (15.96573 N/m),
# conserved (owner decision 2026-10-21). Creep: 60 °F, bare, on the creep
# curve. Heaviest load: 0.5 in ice, 8 psf, 0 °F (36.865 N/m, wind 20.509
# N/m). Final states: both computed; per case the one giving the longer
# cable (lower H) governs (2026-10-22): after load at 32-120 °F and with
# the 1 in / no-wind ice, after creep from 167 °F up and at the
# load-stretch case itself.
#
# FIRST REFERENCE (the expected values): benchmarks/sagtension/
# reference_crosscheck.py, an independent re-implementation with other
# numerics (Illinois strain inversion, Newton on each polynomial for the
# zero-tension strain, Simpson integrals, a secant root on log H). It
# agrees with the code to 1e-10. Tolerance 1e-7 relative.
#
# SECOND REFERENCE: the public-domain library's own sag-tension run on the
# same inputs (a scratch driver; its code is not copied). Its conventions
# differ, and the differences are explained:
#  1. its own weight is a constant load per metre of stretched cable in
#     every state (the spans get heavier as they stretch): emulated inside
#     it by a negative "ice" adjusting each state's weight, iterated; the
#     raw values differ by up to 0.2 % (250 °F);
#  2. its length update is first order, L(1 + d_eps), not L0 (1 + eps): about
#     L d_eps eps, 0.01-0.02 % of H on this span;
#  3. its mean tension samples 101 points (2e-6) and its tolerances are
#     0.01 lbf;
#  4. it shifts a curve that does not start at zero load along the strain
#     axis; here the polynomial is used from zero strain with the
#     compression cap of zero: the same curve where the load is positive.
# With 1 emulated, the remainder is -0.004 to +0.022 % (items 2-3).
#
# Before 2026-10-22 this code gave, at the load-stretch case, a final
# 53983.13 N against an initial 54059.11 N (-0.14 %): the core's negative
# set was clamped at zero, so the final line lay under the initial curve
# at the very point it starts from. Every case's previous value is in its
# notes.

# Second reference, weight convention emulated: initial 26689.330 N, after load
# 24726.163 N, after creep 24820.737 N (raw: 26689.3, 24737.1, 24829.4 N).
# Expected minus it: -0.000 %, +0.006 %, +0.006 %.
# Before 2026-10-22: initial 26689.330 N, final (after load) 24690.265 N.
[[case]]
id = "xdrake-001"
title = "Drake-like cable, level 365.76 m strung at 26689.33 N (6000 lbf) at 60 °F: 60 °F (15.6 °C), bare: the stringing case"
calculation = "sagtension.nonlinear"
reference = "Independent re-implementation (benchmarks/sagtension/reference_crosscheck.py); second reference: a public-domain library's own run, conventions matched (notes)"
max_seconds = 5.0
expected.h_initial_n = { value = 26689.32969, rel_tol = 1e-7 }
expected.h_final_creep_n = { value = 24822.21872, rel_tol = 1e-7 }
expected.h_final_load_n = { value = 24727.59293, rel_tol = 1e-7 }
expected.h_final_n = { value = 24727.59293, rel_tol = 1e-7 }
expected.final_cause = { value = 1, abs_tol = 0.0 }
expected.beyond_range = { value = 0.0, abs_tol = 0.0 }

