# The 2D fields against hvlbuzz (owner, 2026-10-29: "for the electric and
# magnetic fields you can probably use hvlbuzz … it's only 2D but at least
# this can be validated"). hvlbuzz 2.0 (FKH, Switzerland;
# https://gitlab.com/fkh-ch/emc, GPL-3.0-or-later) is an independent
# program: its electric field from a charge simulation with 12 line charges
# round every subconductor, its magnetic field by Biot–Savart. Its project
# files are in benchmarks/electrical/hvlbuzz/ with the profiles it wrote
# (run 2026-10-29); reference_hvlbuzz.py turns them into these cases.
# Induced currents in the earth wires neglected (both programs).
#
# Tolerances: B 1e-7 (the same law; hvlbuzz's values agree to their last
# digits); E 0.2 % (the program takes one charge at each bundle's centre,
# hvlbuzz 12 round every subconductor: on the 380 kV bundles the profiles
# differ by up to 0.12 %, on single wires by some 0.003 %).

[[case]]
id = "electrical-050"
title = "One 380 kV circuit, flat, two-conductor bundles, 1000 A: E and B 1 m above the ground against hvlbuzz"
calculation = "electrical.fields_2d"
reference = "hvlbuzz 2.0 (FKH, gitlab.com/fkh-ch/emc), its own charge simulation and Biot–Savart; benchmarks/electrical/hvlbuzz/A-flat-380kV.json"
[case.inputs]
height = 1.0
offsets = [-50, -45, -40, -35, -30, -25, -20, -15, -10, -5, 0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
[[case.inputs.systems]]
subconductors = 2
spacing = 0.4
diameter = 0.0318
kv = 380
amps = 1000
bundle_angle = 0
phases = [[-9, 20], [0, 20], [9, 20]]
