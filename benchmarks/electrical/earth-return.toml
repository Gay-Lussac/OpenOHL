# The earth return term between two wires, against an independent
# evaluation of Carson's integral by numerical quadrature
# (benchmarks/electrical/reference_electrical.py: scipy's adaptive
# quadrature, a different method from the program's series and asymptotic
# expansion). They guard the formulas, not the homogeneous-earth model
# itself. No openly published table of Carson's terms with their inputs was
# found (an open page, Vismor's "Carson's Equations", tabulates the
# parameter a for "distance 100 ft" without saying whether it is the self
# term's height or a distance to an image: not used).
#
# Outputs: dr_ohm_per_km, dx_ohm_per_km — the term ΔZ beyond the perfect
# earth's j·ωμ0/2π·ln(D'/d), Ω/km; a — Carson's parameter. Lengths in m.
# Cases from power frequency to 50 kHz and from 0.5 to 1000 Ω·m (a from
# 0.02 to 28: the series and, above a = 15, the asymptotic expansion).

[[case]]
id = "electrical-010"
title = "Carson: self term, 20 m high, 50 Hz, 100 Ω·m"
calculation = "electrical.earth_return"
reference = "Carson's integral by quadrature (benchmarks/electrical/reference_electrical.py)"
[case.inputs]
hi = "20 m"
hj = "20 m"
x = "0 m"
frequency = 50
resistivity = 100
[case.expected]
a = { value = 0.0794767, rel_tol = 1e-5 }
dr_ohm_per_km = { value = 0.0471883562, rel_tol = 1e-6 }
dx_ohm_per_km = { value = 0.200124683, rel_tol = 1e-6 }

