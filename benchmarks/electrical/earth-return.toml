# The complex depth, against its own closed form evaluated independently
# (the reference script). It differs from Carson's integral by 1 % (R) and
# 2 % (X) of the term in electrical-020 and up to 3 % in electrical-021
# (printed by the script): the method's known accuracy, not checked here.

[[case]]
id = "electrical-020"
title = "Complex depth: mutual term, 50 Hz, 100 Ω·m"
calculation = "electrical.earth_return"
reference = "Deri, Tevan, Semlyen, Castanheira, IEEE Trans. PAS-100 (8), 1981: the closed form evaluated by benchmarks/electrical/reference_electrical.py"
[case.inputs]
hi = "20 m"
hj = "26 m"
x = "7.5 m"
frequency = 50
resistivity = 100
earth_return = "complex_depth"
[case.expected]
dr_ohm_per_km = { value = 0.04738023, rel_tol = 1e-6 }
dx_ohm_per_km = { value = 0.195083661, rel_tol = 1e-6 }

