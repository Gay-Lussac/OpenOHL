# The lightning shielding check against the classical constructions,
# computed on their own by reference_lightning.py (no OpenOHL code).
# Rolling sphere over level ground: r_max, the largest striking
# distance still reaching the phase, from the sphere resting on the
# ground and touching the shielding wire (electrogeometric model;
# Young, Clayton and Hileman 1963; Armstrong and Whitehead 1968);
# to 2 cm (the program halves to 1 cm). Shielding angle: exact.

[[case]]
id = "electrical-060"
title = "Rolling sphere: one shielding wire at 32 m, a phase 5 m out and 8 m below, ground factor 1.0: r_max and the verdict at r = 30 m"
calculation = "electrical.lightning_cut"
reference = "Classical construction, computed by benchmarks/electrical/reference_lightning.py"
[case.inputs]
method = "sphere"
shields = [[0.0, 32.0]]
phase = [5.0, 24.0, 0.0]
ground = 0.0
striking_distance = 30.0
ground_factor = 1.0
[case.expected]
r_max_m = { value = 59.36266829794469, abs_tol = 0.02 }
exposed = { value = 1.0, abs_tol = 0.0 }

