# Structure analysis (ohl-structures-fe): frames, trusses, guys and poles
# against closed-form textbook results. Each model is an .ohlfe text with
# its own [[load]]s. E = 210 GPa throughout. The reference values are the
# formulas in the notes, evaluated to double precision.

[[case]]
id = "structfe-001"
title = "Cantilever, tip load: deflection PL³/3EI, rotation PL²/2EI, moment PL"
calculation = "structures.fe"
reference = "Euler–Bernoulli beam theory (e.g. Timoshenko & Gere, Mechanics of Materials); one frame element is exact"
notes = "L = 4 m, I = 2e-6 m4, P = 1 kN down at the tip; first order"
max_seconds = 1.0
inputs.model = '''
[analysis]
nonlinear = false
[[material]]
id = "steel"
elasticity = "210 GPa"
[[section]]
id = "s"
material = "steel"
area = "1000 mm2"
iy = "200 cm4"
iz = "200 cm4"
[[node]]
id = "base"
point = ["0 m", "0 m", "0 m"]
support = "fixed"
[[node]]
id = "tip"
point = ["4 m", "0 m", "0 m"]
[[member]]
id = "beam"
nodes = ["base", "tip"]
section = "s"
kind = "frame"
[[load]]
node = "tip"
force = ["0 N", "0 N", "-1 kN"]
'''
expected.u_tip_z = { value = -0.050793650793650794, rel_tol = 1e-9 }
expected.u_tip_ry = { value = 0.01904761904761905, rel_tol = 1e-9 }
expected.r_base_z = { value = 1000.0, rel_tol = 1e-9 }
expected.r_base_ry = { value = -4000.0, rel_tol = 1e-9 }

[[case]]
id = "structfe-002"
title = "Triangle truss, ridge load P: rafters −P/√2, tie +P/2, supports P/2"
calculation = "structures.fe"
reference = "Method of joints (statics)"
notes = "Span 4 m, rise 2 m (45° rafters), P = 10 kN; out-of-plane y held at every node"
max_seconds = 1.0
inputs.model = '''
[analysis]
nonlinear = false
[[material]]
id = "steel"
elasticity = "210 GPa"
[[section]]
id = "s"
material = "steel"
area = "1000 mm2"
[[node]]
id = "A"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
id = "B"
point = ["4 m", "0 m", "0 m"]
support = ["y", "z"]
[[node]]
id = "C"
point = ["2 m", "0 m", "2 m"]
support = ["y"]
[[member]]
id = "AB"
nodes = ["A", "B"]
section = "s"
[[member]]
id = "AC"
nodes = ["A", "C"]
section = "s"
[[member]]
id = "BC"
nodes = ["B", "C"]
section = "s"
[[load]]
node = "C"
force = ["0 N", "0 N", "-10 kN"]
'''
expected.n_AB = { value = 5000.0, rel_tol = 1e-9 }
expected.n_AC = { value = -7071.067811865475, rel_tol = 1e-9 }
expected.n_BC = { value = -7071.067811865475, rel_tol = 1e-9 }
expected.r_A_z = { value = 5000.0, rel_tol = 1e-9 }
expected.r_B_z = { value = 5000.0, rel_tol = 1e-9 }

