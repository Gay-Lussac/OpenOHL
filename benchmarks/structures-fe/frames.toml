[[case]]
id = "structfe-009"
title = "Beam on a spring support: the spring's force is the reaction by statics, P·a/L"
calculation = "structures.fe"
reference = "Statics of a simply supported beam (a spring support leaves it determinate); the spring's travel is its force over k"
notes = "L = 4 m, P = 10 kN down at a = 1 m from A; A pinned (and held about the beam's axis), B on a vertical spring k = 1 MN/m (held across the beam in y): R_A = 3P/4, R_B = P/4 = −k·u_B; first order"
max_seconds = 1.0
inputs.model = '''
[analysis]
nonlinear = false
[[material]]
id = "steel"
elasticity = "210 GPa"
[[section]]
id = "s"
material = "steel"
area = "1000 mm2"
iy = "200 cm4"
iz = "200 cm4"
[[node]]
id = "A"
point = ["0 m", "0 m", "0 m"]
support = ["x", "y", "z", "rx"]
[[node]]
id = "C"
point = ["1 m", "0 m", "0 m"]
[[node]]
id = "B"
point = ["4 m", "0 m", "0 m"]
support = ["y"]
spring = [0, 0, 1e6, 0, 0, 0]
[[member]]
id = "AC"
nodes = ["A", "C"]
section = "s"
kind = "frame"
[[member]]
id = "CB"
nodes = ["C", "B"]
section = "s"
kind = "frame"
[[load]]
node = "C"
force = ["0 N", "0 N", "-10 kN"]
'''
expected.r_B_z = { value = 2500.0, rel_tol = 1e-9 }
expected.r_A_z = { value = 7500.0, rel_tol = 1e-9 }
expected.u_B_z = { value = -0.0025, rel_tol = 1e-9 }

