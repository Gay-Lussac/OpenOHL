point = ["4 m", "0 m", "3 m"]
[[node]]
id = "D"
point = ["0 m", "0 m", "3 m"]
[[member]]
id = "AD"
nodes = ["A", "D"]
section = "s"
[[member]]
id = "BC"
nodes = ["B", "C"]
section = "s"
[[member]]
id = "DC"
nodes = ["D", "C"]
section = "s"
[[member]]
id = "AC"
nodes = ["A", "C"]
section = "s"
