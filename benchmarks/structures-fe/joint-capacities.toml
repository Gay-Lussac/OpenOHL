inputs.parts = [
  { kind = "weld", weld = "fillet", throat = "4 mm", length = "100 mm", angle = 90, fy = "355 MPa", thicknesses = ["10 mm", "10 mm"], force = "50 kN", in_plane = 500.0 },
]
expected.usage_0 = { value = 0.8169934640522876, rel_tol = 1e-9 }

