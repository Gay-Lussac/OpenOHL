notes = "a 4 mm x 100 mm, plates at 90 deg, f_y 355 MPa, F 50 kN, M 0.5 kN m: 500 + 300 = 800 kN/m, 80 kN; (87) a L 0.6 f_uE / gamma_M2 = 97.92 kN -> 0.81699; (88) s = a / cos 45 = 5.657 mm, s L 0.8 f_y / gamma_M2 = 128.5 kN (0.62)"
