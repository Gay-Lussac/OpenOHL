# The connection capacities (stage 5 of the joint details, queue item C10;
# 2026-11-23; built, in active development, not approved yet): invented
# joint parts and bolt groups sent to the bundled design-code plugins
# (plugins/codes/asce10, plugins/codes/sia263) as a structure's run sends
# them, against hand calculations of the methods the theory pages give
# (docs/theory/joint-groups.md, joint-plates.md, asce10.md, sia263.md) with
# the values the plugins take. The hand calculations are written out in
# reference_joint_capacities.py beside this file (`python3 -I`), which
# prints every expected value. One load case, strength factor 1; a distance
# check's usage is the minimum over the distance kept (it governs only when
# not kept). Run through the plugins (their first call compiles them).

[[case]]
id = "joints-001"
title = "Bolt shear, one plane (ASCE 10-97 4.3.2): 0.62 f_ub on the root area"
calculation = "structures.joint_groups"
reference = "ASCE 10-97 4.3.2 as the asce10 plugin takes it (root area 0.6 of the gross without a given capacity), by hand"
notes = "M16, f_ub 800 MPa, one plane: F_v = 0.62 x 800 MPa x 0.6 x 201.06 mm2 = 59.84 kN; 30 kN -> 0.50137. Bearing on the 20 mm plate (1.5 x 510 x 16 x 20 = 244.8 kN) far off; no edge sent, no distance checked"
max_seconds = 30.0
inputs.method = "asce10-97"
inputs.groups = [
  { plies = [{ kind = "plate", thickness = "20 mm", fy = "355 MPa", fu = "510 MPa" }],
    bolts = [{ diameter = "16 mm", hole = "17.5 mm", bolt_ultimate = "800 MPa", planes = 1, force = "30 kN" }] },
]
expected.usage_0 = { value = 0.5013701584296097, rel_tol = 1e-9 }

