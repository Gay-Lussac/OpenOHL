[[case]]
id = "joints-005"
title = "Bolt in tension with prying (T-stub, Struik and de Back): the flange's bending governs"
calculation = "structures.joint_groups"
reference = "ASCE 10-97 4.3.3 with the T-stub of Struik and de Back (Kulak, Fisher & Struik, Guide to Design Criteria for Bolted and Riveted Joints, 2nd ed., Eqs. 17.8-17.12, alpha = delta = 1) as the asce10 plugin takes it, by hand"
notes = "M16 in an 18 mm hole pulled by 20 kN through an angle's flange 8 mm, f_y 355 MPa, a 30 mm to the toe (<= 1.25 b), b 25 mm to the other leg, w 50 mm: a' = 38, b' = 17 mm; Q = T b'/(2 a') = 4.474 kN; the bolt (F_u A_s given 100 kN): (20 + 4.474)/(0.6 x 100) = 0.408; the flange: T b' = 340 N m <= (1 + delta) w t2 f_y / 4 with delta = 1 - 18/50 = 0.64: 465.8 N m -> 0.72999"
max_seconds = 30.0
inputs.method = "asce10-97"
inputs.groups = [
  { plies = [{ kind = "plate", thickness = "10 mm", fy = "235 MPa", fu = "360 MPa" }],
    bolts = [{ diameter = "16 mm", hole = "18 mm", shear_capacity = "100 kN", planes = 1, force = "0 kN", pull = "20 kN", tension_capacity = "100 kN",
               tees = [{ thickness = "8 mm", fy = "355 MPa", edge = "30 mm", web = "25 mm", width = "50 mm" }] }] },
]
expected.usage_0 = { value = 0.7299896942631398, rel_tol = 1e-9 }

