[[case]]
id = "sia263-004"
title = "Tension of an angle without bolts or holes in its data: a bolt hole in each leg, the net section (39), until the bolts are known"
calculation = "structures.fe"
reference = "SIA 263:2013, Construction en acier (SIA), formulas (38) and (39) and Table 17 as the sia263 plugin takes them, evaluated by hand; the hole per leg and the 20 mm bolt are the program's assumption until the bolts are known (owner, 2026-11-23), not the code's"
notes = "Invented equal angle 60 x 6 mm, no root radius: A = 6 x (120 - 6) = 684 mm2, fy 355 MPa, fu 490 MPa. No bolts given: the default 20 mm bolt, its hole of Table 17 22 mm, one in each leg: A_net = 684 - 2 x 22 x 6 = 420 mm2, (39) 0.9 x 490 MPa x 420 mm2 / 1.25 = 148.176 kN, below (38) 355 x 684 / 1.05 = 231.2571 kN; 50 kN -> 0.33743656"
max_seconds = 30.0
inputs.sections = '''
format = "ohl-sections"
version = 1
[[material]]
id = "steel"
elasticity = "210 GPa"
yield = "355 MPa"
ultimate = "490 MPa"
[[section]]
id = "L60"
shape = "equal_angle"
material = "steel"
h = "60 mm"
t = "6 mm"
r = "0 mm"
'''
inputs.model = '''
[analysis]
nonlinear = false
capacity = "sia263-2013"
[[node]]
id = "a"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
id = "b"
point = ["1.5 m", "0 m", "0 m"]
support = ["y", "z"]
[[member]]
id = "m"
nodes = ["a", "b"]
section = "L60"
[[load]]
node = "b"
force = ["50 kN", "0 kN", "0 kN"]
'''
expected.usage_m = { value = 0.3374365619263578, rel_tol = 1e-9 }

[[case]]
id = "sia263-005"
title = "Bearing (76) of a built-up member (two plies) at member level: one ply's thickness until the plate between is defined"
calculation = "structures.fe"
reference = "SIA 263:2013, Construction en acier (SIA), formula (76) and Table 17 as the sia263 plugin takes them, evaluated by hand; one ply's thickness until the plate between is defined is the program's assumption (owner, 2026-11-23), not the code's"
notes = "Two plies of 6 mm (plies = 2), 2 M16 bolts on one line (hole of Table 17 18 mm, e1 25 mm, p1 60 mm), f_u 370 MPa: one bolt min(0.85 x 25/18 x 370 MPa x 16 mm x 6 mm, 2.4 x 370 MPa x 16 mm x 6 mm) / 1.25 = 33.54667 kN, x 2 bolts x 1 ply = 67.09333 kN (both plies before; the plate between not defined, said not on the safe side); bolt shear 2 x 2 x 100 kN / 1.25 = 320 kN; (39) 0.9 x 370 MPa x (20 cm2 - 18 mm x 6 mm) / 1.25 = 504.03 kN; (38) 676.19 kN; 30 kN -> 0.44713831"
max_seconds = 30.0
inputs.model = '''
[analysis]
nonlinear = false
capacity = "sia263-2013"
[[material]]
id = "steel"
elasticity = "210 GPa"
yield = "355 MPa"
ultimate = "370 MPa"
[[section]]
id = "s"
material = "steel"
area = "20 cm2"
iy = "50 cm4"
iz = "50 cm4"
i_min = "20 cm4"
[[node]]
id = "a"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
id = "b"
point = ["1 m", "0 m", "0 m"]
support = ["y", "z"]
[[member]]
id = "m"
nodes = ["a", "b"]
section = "s"
[member.design]
end_eccentricity = "none"
length_ratios = [1, 1, 1]
bolts = { diameter = "16 mm", count = 2, shear_planes = 2, shear_capacity = "100 kN", holes = 1 }
thickness = "6 mm"
plies = 2
end_distance = "25 mm"
spacing = "60 mm"
connected_leg = "long"
[[load]]
node = "b"
force = ["30 kN", "0 kN", "0 kN"]
'''
expected.usage_m = { value = 0.4471383147853735, rel_tol = 1e-9 }

[[case]]
id = "sia263-006"
title = "Tension of an angle without bolts in its data: OpenOHL's default bolt, the largest of the structure's library its leg's usual gauge takes by Table 17, its hole in each leg (39)"
calculation = "structures.fe"
reference = "SIA 263:2013, Construction en acier (SIA), formulas (38) and (39) and Table 17 (holes and minimum edge distances e_2) as the sia263 plugin takes them, evaluated by hand; the default bolt (the largest of the library the leg's usual gauge takes, one gauge line at mid-leg) is OpenOHL's assumption until the bolts are known (owner, 2026-11-25), not the code's"
notes = "Invented equal angle 45 x 5 mm, no root radius: A = 5 x (90 - 5) = 425 mm2, fy 355 MPa, fu 490 MPa. Library M12, M16, M20 (no holes given). The usual gauge at mid-leg, 22.5 mm from the heel and from the toe. Table 17's minimum edge distance e_2: M20 25 mm > 22.5 (does not fit), M16 20 mm <= 22.5, its hole clear of the root (5 + 8 = 13 mm <= 22.5): M16, its hole of Table 17 18 mm, one in each leg: A_net = 425 - 2 x 18 x 5 = 245 mm2, (39) 0.9 x 490 MPa x 245 mm2 / 1.25 = 86.436 kN, below (38) 355 x 425 / 1.05 = 143.6905 kN (the 20 mm default bolt before: 425 - 2 x 22 x 5 = 205 mm2, 72.324 kN); 30 kN -> 0.34707761"
max_seconds = 30.0
inputs.sections = '''
format = "ohl-sections"
version = 1
[[material]]
id = "steel"
elasticity = "210 GPa"
yield = "355 MPa"
ultimate = "490 MPa"
[[section]]
id = "L45"
shape = "equal_angle"
material = "steel"
h = "45 mm"
t = "5 mm"
r = "0 mm"
'''
inputs.bolts = '''
