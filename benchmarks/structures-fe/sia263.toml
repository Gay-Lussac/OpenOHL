diameter = "12 mm"
[[bolt]]
id = "M16"
diameter = "16 mm"
[[bolt]]
id = "M20"
diameter = "20 mm"
'''
inputs.model = '''
[analysis]
nonlinear = false
capacity = "sia263-2013"
[[node]]
id = "a"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
id = "b"
point = ["1.5 m", "0 m", "0 m"]
support = ["y", "z"]
[[member]]
id = "m"
nodes = ["a", "b"]
section = "L45"
[[load]]
node = "b"
force = ["30 kN", "0 kN", "0 kN"]
'''
expected.usage_m = { value = 0.3470776065528252, rel_tol = 1e-9 }
