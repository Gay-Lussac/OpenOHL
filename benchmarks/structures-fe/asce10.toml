[[case]]
id = "asce10-011"
title = "Tension of an angle without bolts in its data: OpenOHL's default bolt, the largest of the structure's library its leg's usual gauge takes, its hole in each leg"
calculation = "structures.fe"
reference = "ASCE 10-97, Design of Latticed Steel Transmission Structures (ASCE), 3.10.1, 3.10.2, 4.4, 4.5.1 (Eqs. 4.5-1 to 4.5-3) and 4.5.3 (Eq. 4.5-6) as the asce10 plugin takes them, evaluated by hand; the default bolt (the largest of the library the leg's usual gauge takes, one gauge line at mid-leg) is OpenOHL's assumption until the bolts are known (owner, 2026-11-25), not the code's"
notes = "Invented equal angle 40 x 4 mm, no root radius: A = 4 x (80 - 4) = 304 mm2, fy 355 MPa, fu 490 MPa. Library M12 (hole 13.5 mm), M16 (17.5), M20 (22), each 100 kN a shear plane. The usual gauge at mid-leg, 20 mm from the heel, 20 mm to the toe (rolled). Edge distance without an analysis: the force per bolt the smaller of 100 kN and its bearing cap 1.5 x 490 MPa x d x 4 mm (M12 35.28 kN, M16 47.04, M20 58.8 kN), e_min = max(1.2 P/(Fu t) = 1.8 d, 1.3 d, t + d/2) = 1.8 d, rolled edge 0.85 x 1.8 d = 1.53 d: M20 30.6 mm > 20 (does not fit), M16 24.48 mm > 20 (does not fit), M12 18.36 mm <= 20, its hole clear of the root (4 + 6 = 10 mm <= 20): M12. Its hole 13.5 mm, punched + 1.6 = 15.1 mm, one in each leg: A_net = 304 - 2 x 15.1 x 4 = 183.2 mm2; one leg bolted (assumed): 0.9 x 183.2 mm2 x 355 MPa = 58.5324 kN (the 20 mm default bolt before: 304 - 2 x 23.2 x 4 = 118.4 mm2, 37.8288 kN); 20 kN -> 0.34169110"
max_seconds = 30.0
inputs.sections = '''
format = "ohl-sections"
version = 1
[[material]]
id = "steel"
elasticity = "210 GPa"
yield = "355 MPa"
ultimate = "490 MPa"
[[section]]
id = "L40"
shape = "equal_angle"
material = "steel"
h = "40 mm"
t = "4 mm"
r = "0 mm"
'''
inputs.bolts = '''
format = "ohl-bolts"
version = 1
[[bolt]]
id = "M12"
diameter = "12 mm"
hole = "13.5 mm"
shear_capacity = "100 kN"
[[bolt]]
id = "M16"
diameter = "16 mm"
hole = "17.5 mm"
shear_capacity = "100 kN"
[[bolt]]
id = "M20"
diameter = "20 mm"
hole = "22 mm"
shear_capacity = "100 kN"
'''
inputs.model = '''
[analysis]
nonlinear = false
capacity = "asce10-97"
[[node]]
id = "a"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
id = "b"
point = ["1.5 m", "0 m", "0 m"]
support = ["y", "z"]
[[member]]
id = "m"
nodes = ["a", "b"]
section = "L40"
[[load]]
node = "b"
force = ["20 kN", "0 kN", "0 kN"]
'''
expected.usage_m = { value = 0.34169109758014365, rel_tol = 1e-9 }

