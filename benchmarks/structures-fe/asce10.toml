# ASCE 10-97 member capacities (the default capacity method of the
# structure check, ohl_structures_fe::asce10), on invented single bars
# against values computed by hand from the published formulas of ASCE
# 10-97, Design of Latticed Steel Transmission Structures (American
# Society of Civil Engineers), metric form: effective slenderness curves
# 1-6, local buckling of the legs, the column curve, bolt shear, bearing
# and the net section. Each bar: 10 cm2, iy = iz = 50 cm4 (r = 2.236 cm),
# i_min = 20 cm4 (r_v = 1.414 cm), E = 210 GPa, pinned at a, held across
# at b, loaded along it at b; first order. The usage is the force over
# the capacity (strength factor 1). Values evaluated in double precision
# (scratch script reproduced in the notes).

[[case]]
id = "asce10-001"
title = "Compression, concentric, L/r 212 > 120 (curve 4): Euler stress"
calculation = "structures.fe"
reference = "ASCE 10-97, Design of Latticed Steel Transmission Structures (ASCE), the member formulas evaluated by hand"
notes = "L = 3 m, fy = 355 MPa: L/r = 212.1320, KL/r = 212.1320, Fcr = 355.0000 MPa, P = 46.0582 kN; 20 kN"
max_seconds = 1.0
inputs.model = '''
[analysis]
nonlinear = false
capacity = "asce10-97"
[[material]]
id = "steel"
elasticity = "210 GPa"
yield = "355 MPa"
[[section]]
id = "s"
material = "steel"
area = "10 cm2"
iy = "50 cm4"
iz = "50 cm4"
i_min = "20 cm4"
[[node]]
id = "a"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
id = "b"
point = ["3 m", "0 m", "0 m"]
support = ["y", "z"]
[[member]]
id = "m"
nodes = ["a", "b"]
section = "s"
[member.design]
length_ratios = [1, 1, 1]
end_eccentricity = "none"
end_restraint = "none"
width_thickness = 10
[[load]]
node = "b"
force = ["-20 kN", "0 kN", "0 kN"]
'''
expected.usage_m = { value = 0.43423364418144755, rel_tol = 1e-9 }

