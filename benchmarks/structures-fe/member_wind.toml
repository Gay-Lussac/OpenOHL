[[node]]
id = "N21"
point = ["2 m", "2 m", "4 m"]
[[node]]
id = "N30"
point = ["0 m", "2 m", "0 m"]
support = "pinned"
[[node]]
id = "N31"
point = ["0 m", "2 m", "4 m"]
[[member]]
id = "leg0"
nodes = ["N00", "N01"]
section = "B50"
[[member]]
id = "top0"
nodes = ["N01", "N11"]
