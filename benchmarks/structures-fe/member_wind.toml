expected.fy = { value = 3009.2350425221066, rel_tol = 1e-9 }
expected.fx = { value = 0.0, abs_tol = 1e-9 }
expected.fz = { value = 0.0, abs_tol = 1e-9 }
expected.faces = { value = 5.0, abs_tol = 1e-9 }
