# Member wind on a lattice: the faces OpenOHL finds, their solidity
# ratios, the drag per shape and the shielding of the face behind, with
# wind factors given as data (the [wind] table of the section library).
# Every factor here is INVENTED (no code's values): drag 1.2 for round
# bars, shielding η = 1 − φ between φ = 0 and 0.5. The tower is invented:
# a square panel 2 × 2 m, 4 m high, legs at its corners, a horizontal at
# the top and an X in each face, every member a round bar of d = 50 mm.
#
# Hand derivation, wind q = 1000 Pa along +y (normal to the faces y = 0
# and y = 2):
# - a face (y = 0): 2 legs of 4 m, 1 horizontal of 2 m, 2 diagonals of
#   √20 m: Σ L = 10 + 2√20 = 18.944272 m; members' area d Σ L = 0.947214
#   m² over the outline 2 × 4 = 8 m²: φ = 0.1184017;
# - the face in front (y = 0): q c d Σ L = 1000 · 1.2 · 0.05 · 18.944272
#   = 1136.656 N along y;
# - the front face's solidity with its overlaps once is known only within
#   bounds (since 2026-11-08): its members' strips (d wide round their
#   centre lines, h = d/2) overlap at the joints and where the X crosses;
#   the bound takes, of each member after the first (file order leg0,
#   top0, x0a, x0b, leg1), d × the length of its axis the earlier ones
#   cover: top0 at leg0 h; x0a at leg0 h(2+√5) (its edge t = +h meets
#   leg0's edge x = h at s = h(√5+2)) and at top0 h(1+√5)/2; x0b at
#   leg0/top0 h(2+√5) and through x0a's strip ±h(1+|cos θ|)/sin θ with
#   cos θ = 3/5: 4h; leg1 at x0b and at x0a/top0 h(2+√5) each. In all
#   d h (13.5 + 4.5√5) = 0.0294529 m², so φ ≥ (0.947214 − 0.029453)/8
#   = 0.1147201;
# - the face behind (y = 2), shielded: η falls with φ, so the lower bound
#   governs (on the safe side): η = 1 − 0.1147201 = 0.8852799, 1006.259 N;
# - the 4 diagonals of the faces x = 0 and 2 (in planes along the wind,
#   neither in front nor behind): sin θ = 2/√5, β = 90° − θ = 26.565051°;
#   the force normal to the member q c d L k(β), k the round bars'
#   inclination factor (2026-11-15): the largest of cos β = 0.8944272 and
#   SIA 261:2014 Tab. 74's (p. 112) ratios c_β/c_β(0) interpolated
#   linearly between 15° and 30° — (1.16 − 0.77100·0.12)/1.2 = 0.8895663,
#   (0.58 − 0.77100·0.05)/0.6 = 0.9024164 — so k = 0.9024164; its y part
#   × sin θ: q c d √20 k (2/√5) = 216.5799 N each, 866.3197 N
#   (before 2026-11-15, sin²θ: q c d √20 (4/5)^1.5 = 192 N, 768 N);
# - the top horizontals of the side faces lie along the wind: none;
# Σ Fy = 1136.656 (1 + η) + 866.3197 = 3009.2350 N (2910.9153 N with
# sin²θ; 2906.7306 N before 2026-11-08, with the overlaps counted twice);
# Σ Fx = Σ Fz = 0 (the side diagonals' vertical parts cancel in pairs).
# Faces found: the 4 sides and the top (4 horizontals), 5; shielded: the 5
# members of the face y = 2.
# Without the [wind] table and no [analysis] drag (case 002): the round
# bars' built-in force coefficient 1.2 (SIA 261:2014 Tab. 72, p. 110, the
# largest for bars and tubes), no shielding:
# 2 · 1136.656 + 866.3197 = 3139.6324 N (before 2026-11-15: drag 1 and
# sin²θ, 2 · 947.2136 + 640 = 2534.4272 N).
# Case 003: the comparison law ([wind] member_law = "sin2", version 2)
# with [analysis] drag = 1 reproduces that former value, 2534.4272 N.

[[case]]
id = "structwind-001"
title = "Square lattice panel: the face behind shielded by the one in front (invented factors)"
calculation = "structures.member_wind"
reference = "Hand derivation above (q·c·η·d·L·k(β) per member, k by SIA 261:2014 Tab. 74 p. 112; faces, solidity and the face in front by geometry)"
notes = "Invented tower and factors (see the file's header); wind along +y. 2026-11-15: 2910.915 → 3009.235 N, the side diagonals' inclination factor 0.902 in place of sin²θ = 0.8"
max_seconds = 1.0
inputs.wind_pressure = "1000 Pa"
inputs.wind_direction = 90.0
inputs.sections = '''
[[material]]
id = "steel"
elasticity = "210 GPa"
[[section]]
id = "B50"
shape = "round_bar"
material = "steel"
d = "50 mm"
[wind]
source = "invented test values"
drag = { round_bar = 1.2 }
[wind.shielding]
solidity = [0.0, 0.5]
factor = [1.0, 0.5]
'''
inputs.model = '''
[analysis]
nonlinear = false
self_weight = false
[[node]]
id = "N00"
point = ["0 m", "0 m", "0 m"]
support = "pinned"
[[node]]
