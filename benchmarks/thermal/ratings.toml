# Steady-state thermal ratings of Drake 26/7 ACSR (28.14 mm,
# R(25 °C) = 7.283e-5 Ω/m, R(75 °C) = 8.688e-5 Ω/m, ε = α = 0.8 unless given).
#
# thermal-001 checks against the published worked example of IEEE Std 738
# (Drake at 100 °C: 40 °C air, 0.61 m/s across the line, east-west line at
# 30° N, 11:00 solar time on 10 June, clear air, sea level), whose results
# are q_c ≈ 81.93 W/m, q_r ≈ 39.1 W/m, q_s ≈ 22.44 W/m, I ≈ 1025 A, solar
# altitude ≈ 74.8°, azimuth ≈ 114°. Tolerances allow for the rounding of
# the published values.
#
# The other cases check against an independent implementation of the same
# published formulas (benchmarks/thermal/reference_thermal.py), not against
# published results: they guard the formulas of each method, not the
# methods themselves.

[[case]]
id = "thermal-001"
title = "IEEE 738 worked example: Drake ampacity at 100 °C"
calculation = "thermal.steady"
reference = "IEEE Std 738-2012 (and 738-2006 Annex B) worked example for Drake 26/7 ACSR, published results"
notes = "Outputs in A, W/m, degrees"
[case.inputs]
method = "ieee738"
diameter = "28.14 mm"
ac_resistance = [
    { temperature = "25 °C", resistance = "7.283e-5 Ω/m" },
    { temperature = "75 °C", resistance = "8.688e-5 Ω/m" },
]
emissivity = 0.8
absorptivity = 0.8
max_temperature = "100 °C"
ambient = { name = "example", air_temperature = "40 °C", wind_speed = "0.61 m/s", latitude = "30 °", day_of_year = 161, time = "11:00", line_azimuth = "90 °", atmosphere = "clear" }
[case.expected]
current_a = { value = 1025.0, rel_tol = 0.005 }
convection_w_per_m = { value = 81.93, rel_tol = 0.005 }
radiation_w_per_m = { value = 39.1, rel_tol = 0.005 }
solar_w_per_m = { value = 22.44, rel_tol = 0.01 }
solar_altitude_deg = { value = 74.8, abs_tol = 0.3 }
solar_azimuth_deg = { value = 114.0, abs_tol = 0.5 }

