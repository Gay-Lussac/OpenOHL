expected.h_n = { value = 22887.8758615, rel_tol = 1e-7 }
expected.blowout_deg = { value = 27.7591918406, abs_tol = 1e-6 }
expected.sag_m = { value = 8.87510070465, abs_tol = 1e-6 }

[[case]]
id = "localwind-004"
title = "Factor 0: no wind on the span, as in still air"
calculation = "line.local_wind"
reference = "Independent evaluation (benchmarks/wirefe/reference_broken_wire.py)"
