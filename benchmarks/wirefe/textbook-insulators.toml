[[case]]
id = "tbins-003"
title = "V-string (legs from ±2.5 m, 3 m above the tip, 400 N each) in still air: equal legs"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the tip (benchmarks/reference/textbook_reference.py)"
notes = """Hand: the tip carries half of each span, 4710.15 N (w L0 = 4710.21 N, less 0.06 N as the
tip hangs 0.34 mm below the dead-ends), and half of each leg's weight, 400 N: V = 5110.15 N. Legs at beta from the vertical, cos(beta) = 3 / 3.90512 =
0.768221 as drawn (0.768256 with the tip 0.34 mm lower, the legs stretched):
F = V / (2 cos beta) = 3325.96 N drawn, 3325.81 N stretched."""
max_seconds = 5.0
expected.h_0_n = { value = 25000.0, rel_tol = 1e-7 }
expected.clamp_z_1_m = { value = 29.99966188, abs_tol = 1e-6 }
expected.string_1_0_n = { value = 3325.808256, rel_tol = 1e-7 }
expected.string_1_1_n = { value = 3325.808256, rel_tol = 1e-7 }
expected.string_1_0_slack = { value = 0.0, abs_tol = 0.0 }
expected.string_1_1_slack = { value = 0.0, abs_tol = 0.0 }

