[[case]]
id = "tbins-004"
title = "The same two strings in 300 Pa: both taut, forces from the geometry"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the tip (benchmarks/reference/textbook_reference.py)"
notes = """Hand: the V holds the tip (it moves 0.24 mm), so the spans' pull on it is that of two
fixed-end blown spans: across T = q d L0 k = 300 x 0.028 x 300.192 x 1.00092 = 2523.9 N (the wind
on the stretched wire), down V = 4711.1 + 400 = 5111.1 N. Two legs from (±2.5, +3) m, length
l = 3.90512 m: across (F_R - F_L) 2.5 / l = T, up (F_L + F_R) 3 / l = V:
F_L = (V l / 3 - T l / 2.5) / 2 = 1355.35 N (leg L, top on the +y side the wind blows to),
F_R = (V l / 3 + T l / 2.5) / 2 = 5297.80 N. Slack when T / V > 2.5 / 3 = 0.833; here 0.494.
Before 2026-10-21: 1356.53 N and 5295.23 N."""
max_seconds = 5.0
expected.h_0_n = { value = 27568.80538, rel_tol = 1e-7 }
expected.clamp_y_1_m = { value = 0.0002404980786, abs_tol = 1e-6 }
expected.string_1_0_n = { value = 1355.332513, rel_tol = 1e-7 }
expected.string_1_1_n = { value = 5297.661682, rel_tol = 1e-7 }
expected.string_1_0_slack = { value = 0.0, abs_tol = 0.0 }

