[[case]]
id = "tbins-006"
title = "A pivoting post: a hinged post braced from straight above its base swings along the line until the spans balance"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the clamp (benchmarks/reference/textbook_reference.py pivot)"
notes = """Owner decision 2026-11-15: a hinged post turns freely in every direction its braces leave
free; the wire attached to its top holds it. Two spans clipped in with 300.70 m and 300.40 m of wire
between dead-ends in line with the post's top; the post (450 N, pushing as well as pulling) stands
level 1.5 m out from A1, its brace (200 N) from A2 1.5 m straight above A1: the pair turns about the
vertical through A1 and A2. Hand: the first span, with more wire, pulls less; the post swings
towards the second until the pulls balance along its circle — no part of the wires' pull on the top
along the tangent (cos phi, sin phi, 0); the post can then take along the line only what its swing
turns of the spans' small outward pull (the top moves in towards the structure by
1.5 (1 - cos phi)): the two spans' H end within a fraction of a newton. The vertical load on the top
V (half of each span's weight, 2 x 15.69 x 300.55 / 2 = 4716 N, and half the members' weights,
325 N: 5041 N) is carried by the brace at about 45 degrees: sqrt(2) x 5041 = 7129 N (exact 7131.0 N,
the top 0.58 mm low); the post pushes with about V (exact 5040.2 N: V less the outward pull).
Solved: swung 5.7008 degrees, the top 14.90 cm along the line and 7.6 mm in; H 19295.64 N and
19295.74 N (0.1 N apart; held across the line, as a fixed post holds it, 17756.8 N and
21248.4 N: 3.5 kN apart, which a fixed post would pass to the structure). The reference starts its Newton
iteration where the rigid post balances (a bisection on the swing) with the brace taut."""
max_seconds = 5.0
expected.h_0_n = { value = 19295.63991, rel_tol = 1e-7 }
expected.h_1_n = { value = 19295.73711, rel_tol = 1e-7 }
