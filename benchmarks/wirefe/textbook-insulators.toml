hinged post (450 N) stands level 1.5 m out from A1 (0, 0, 10) to -y, braced (200 N) from A2 1.5 m
straight above A1: it turns about the vertical through A1 and A2. A jumper of 4.0 m of unstressed
wire, no bending stiffness, runs from its top to a point fixed at (3, -2.5, 9). Hand: in still air
the jumper hangs in the vertical plane through its ends, so its pull on the top points in plan
straight at the fixed point; the post settles where that pull has no part along its circle — the
top, the axis and the fixed point in one vertical plane: turned atan(3 / 2.5) = 50.194 degrees.
Solved together: 50.1944 degrees (the top at (1.1523, -0.9603, 10)). The decoupled answer before
(the jumper solved to the top as given and its pull held fixed while the post turned) put it at
