[[case]]
id = "tbins-005"
title = "The same two strings in 1000 Pa: the one on the lee side goes slack, the wire point swings on the other"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the tip (benchmarks/reference/textbook_reference.py)"
notes = """Hand: T / V = 8417 / 5111 = 1.65 > 0.833: leg L would have to push — it goes slack
(tension only) and the tip hangs from leg R alone, a pendulum about (300, -2.5, 33) lined up
with the load on the tip. Swung to y = +0.769 m, z = 30.862 m, the spans' chords pull it back
across by 2 H_x 0.769 / 300 = 221.2 N and down by 2 H_x 0.862 / 300 = 248.1 N (H_x about
43.1 kN): T = 8405.4 k - 221.2 = 8196.0 N (k = 1.0014, the wind on the stretched wire),
V = 4711.1 + 248.1 + 400 = 5359.1 N (the slack leg's half weight still hangs on the tip).
Leg R: tan = (0.769 + 2.5) / (33 - 30.862) = 1.5294 = T / V, force sqrt(T^2 + V^2) = 9792.6 N.
Before 2026-10-21: 9781.96 N, H 43112.27 N."""
max_seconds = 5.0
