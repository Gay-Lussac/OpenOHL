[[case]]
id = "tbins-004"
title = "Same V in 300 Pa: both legs taut, forces from the geometry"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the tip (benchmarks/reference/textbook_reference.py)"
notes = """Hand: the V holds the tip (it moves 0.24 mm), so the spans' pull on it is that of two
fixed-end blown spans: across T = q d L0 = 300 x 0.028 x 300.192 = 2521.6 N, down
V = 4710.1 + 400 = 5110.1 N. Two legs from (±2.5, +3) m, length l = 3.90512 m:
across (F_R - F_L) 2.5 / l = T, up (F_L + F_R) 3 / l = V:
F_L = (V l / 3 - T l / 2.5) / 2 = 1356.55 N (leg L, top on the +y side the wind blows to),
F_R = (V l / 3 + T l / 2.5) / 2 = 5295.37 N. Slack when T / V > 2.5 / 3 = 0.833; here 0.493."""
max_seconds = 5.0
expected.h_0_n = { value = 27565.15865, rel_tol = 1e-7 }
expected.clamp_y_1_m = { value = 0.0002402767857, abs_tol = 1e-6 }
expected.string_1_0_n = { value = 1356.531171, rel_tol = 1e-7 }
expected.string_1_1_n = { value = 5295.232878, rel_tol = 1e-7 }
expected.string_1_0_slack = { value = 0.0, abs_tol = 0.0 }

