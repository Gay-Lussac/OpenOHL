[[case]]
id = "tbins-003"
title = "Two strings to one wire point (tops at ±2.5 m, 3 m above it, 400 N each) in still air: equal forces"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the tip (benchmarks/reference/textbook_reference.py)"
notes = """Hand: the tip carries half of each span, 4711.09 N (w L0 = 15.69378 x 300.192 = 4711.15 N,
less 0.06 N as the tip hangs 0.34 mm below the dead-ends), and half of each leg's weight, 400 N:
V = 5111.09 N. Legs at beta from the vertical, cos(beta) = 3 / 3.90512 = 0.768221 as drawn
(0.768256 with the tip 0.34 mm lower, the legs stretched): F = V / (2 cos beta) = 3326.58 N drawn,
3326.42 N stretched. With the weight at 10 °C (before 2026-10-21): 3325.81 N."""
max_seconds = 5.0
expected.h_0_n = { value = 25000.0, rel_tol = 1e-7 }
expected.clamp_z_1_m = { value = 29.99966182, abs_tol = 1e-6 }
expected.string_1_0_n = { value = 3326.423192, rel_tol = 1e-7 }
expected.string_1_1_n = { value = 3326.423192, rel_tol = 1e-7 }
expected.string_1_0_slack = { value = 0.0, abs_tol = 0.0 }
expected.string_1_1_slack = { value = 0.0, abs_tol = 0.0 }

