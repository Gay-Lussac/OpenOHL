[[case]]
id = "tbins-005"
title = "Same V in 1000 Pa: the leg on the lee side goes slack, the tip swings on the other"
calculation = "line.section"
reference = "Independent 3D quadrature + Newton on the tip (benchmarks/reference/textbook_reference.py)"
notes = """Hand: T / V = 8405 / 5110 = 1.64 > 0.833: leg L would have to push — it goes slack
(tension only) and the tip hangs from leg R alone, a pendulum about (300, -2.5, 33) lined up
with the load on the tip. Swung to y = +0.768 m, z = 30.861 m, the spans' chords pull it back
across by 2 H_x 0.768 / 300 = 220.7 N and down by 2 H_x 0.861 / 300 = 247.3 N (H_x about
43.1 kN): T = 8405.4 - 220.7 = 8184.7 N, V = 4710.1 + 247.3 + 400 = 5357.4 N (the slack leg's
half weight still hangs on the tip). Leg R: tan = (0.768 + 2.5) / (33 - 30.861) = 1.5277
= T / V, force sqrt(T^2 + V^2) = 9782 N."""
max_seconds = 5.0
expected.h_0_n = { value = 43112.27378, rel_tol = 1e-7 }
expected.clamp_y_1_m = { value = 0.7679884191, abs_tol = 1e-6 }
expected.clamp_z_1_m = { value = 30.86079004, abs_tol = 1e-6 }
