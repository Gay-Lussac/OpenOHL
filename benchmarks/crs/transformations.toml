# Coordinate transformations.
# LV95 (EPSG:2056) <-> WGS84 (EPSG:4326): reference values from swisstopo's
# official transformation service REFRAME (https://geodesy.geo.admin.ch/reframe/,
# lv95towgs84, altitude 0), queried 2026-10-03. Tolerance 1e-7 degrees (~1 cm).
# UTM 32N: exact by definition (central meridian 9 deg E -> E 500 000 m; at
# 45 deg N on it, N = 0.9996 x WGS84 meridian arc 4 984 944.378 m).

[[case]]
id = "crs-001"
title = "LV95 E 2600000 N 1200000 to WGS84"
calculation = "crs.transform"
reference = "swisstopo REFRAME lv95towgs84"
inputs = { from = "EPSG:2056", to = "EPSG:4326", x = 2600000.0, y = 1200000.0 }
expected.x = { value = 7.438632420871814, abs_tol = 1e-7 }
expected.y = { value = 46.9510827728495, abs_tol = 1e-7 }

