# Loads on a wire from ice and wind (code-agnostic physics, no design-code factors).
# Hand calculation (Python, standard library):
#   d = 1.108 in, wc = 1.094 lbm/ft * g, t = 0.5 in radial glaze ice (913 kg/m3),
#   q = 4 psf on the iced diameter.
#   A_ice = pi/4 ((d + 2t)^2 - d^2), wv = wc + rho g A_ice, wh = q (d + 2t)

[[case]]
id = "weather-001"
title = "Drake with 0.5 in radial ice and 4 psf wind"
calculation = "weather.wire_load"
reference = "Hand calculation from first principles (see comment in this file)"
inputs = { diameter = "1.108 in", weight = "1.094 lbm/ft", temperature = "0 °F", ice_thickness = "0.5 in", ice_density = "913 kg/m³", wind_pressure = "4 psf" }
expected.vertical_n_per_m = { value = 30.5560495, rel_tol = 1e-9 }
expected.horizontal_n_per_m = { value = 10.25464913, rel_tol = 1e-9 }
expected.resultant_n_per_m = { value = 32.23088565, rel_tol = 1e-9 }
expected.swing_angle_deg = { value = 18.55181821, rel_tol = 1e-9 }
