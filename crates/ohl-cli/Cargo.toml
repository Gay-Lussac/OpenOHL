[package]
name = "ohl-cli"
description = "OpenOHL command-line interface (ohl)"
default-run = "ohl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ohl"
path = "src/main.rs"
# No docs page: the command-line help is its documentation.
doc = false

[dependencies]
ohl-core.workspace = true
ohl-validation.workspace = true
ohl-plugins.workspace = true
ohl-server.workspace = true
ohl-loads.workspace = true
ohl-cables.workspace = true
ohl-sagtension.workspace = true
ohl-weather.workspace = true
ohl-wirefe.workspace = true
ohl-line.workspace = true
ohl-structures.workspace = true
ohl-structures-fe.workspace = true
ohl-sections.workspace = true
ohl-terrain.workspace = true
ohl-clearance.workspace = true
ohl-thermal.workspace = true
ohl-electrical.workspace = true
ohl-lidar.workspace = true
ohl-pointcloud.workspace = true
ohl-session.workspace = true
ohl-drawing.workspace = true
ohl-background.workspace = true
ohl-crs.workspace = true
ohl-io.workspace = true
ohl-bom.workspace = true
ohl-spotting.workspace = true
serde_json.workspace = true
nalgebra.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true

[dev-dependencies]
# An invented orthophoto for the tests of the plan's backgrounds.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
