[package]
name = "ols-app"
description = "OLS CAD (Open Line System Computer Assisted Design) desktop application: 3D, plan and profile views of a line model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ols-cad"
path = "src/main.rs"

[dependencies]
ols-core.workspace = true
ols-cables.workspace = true
ols-line.workspace = true
ols-structures.workspace = true
ols-weather.workspace = true
ols-terrain.workspace = true
ols-lidar.workspace = true
ols-background.workspace = true
ols-crs.workspace = true
ols-pointcloud.workspace = true
ols-session.workspace = true
ols-clearance.workspace = true
ols-io.workspace = true
ols-server.workspace = true
ols-loads.workspace = true
ols-structures-fe.workspace = true
# The edits of a structure file, shared with the structure application.
ols-structure-edit.workspace = true
ols-sections.workspace = true
ols-thermal.workspace = true
ols-bom.workspace = true
ols-spotting.workspace = true
ols-plugins.workspace = true
serde_json.workspace = true
serde.workspace = true
toml_edit = "0.25"
# Native file dialogs (library files anywhere on the computer).
rfd = "0.17"
ols-drawing.workspace = true
ols-render.workspace = true
eframe.workspace = true
egui_dock.workspace = true
clap.workspace = true
png = "0.18"
log = "0.4"
env_logger = "0.11"
# The Python console (Plugins › Python console): an embedded interpreter.
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[features]
default = ["python"]
# The Python console; needs a shared Python 3.10+ (libpython) to build and run.
python = ["dep:pyo3", "dep:pyo3-build-config"]

[build-dependencies]
pyo3-build-config = { version = "0.29", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Writing a small LAZ survey for the point-cloud tests.
las = { version = "0.11", features = ["laz"] }
# Crafting a project file the session would refuse to write (tests).
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true
