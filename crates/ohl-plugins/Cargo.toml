[package]
name = "ohl-plugins"
description = "OpenOHL plugin manifests, discovery and WebAssembly component host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ohl-core.workspace = true
serde.workspace = true
toml.workspace = true
# Renders a plugin's Markdown help pages to HTML (help.rs).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wasmtime = { version = "49.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }

[dev-dependencies]
# The compatibility test compares the interface with its frozen copies.
wit-parser = "0.258"

[lints]
workspace = true
