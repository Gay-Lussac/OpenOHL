[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ols-cad"
description = "Python bindings for OpenOHL (open-source overhead line design)"
requires-python = ">=3.10"
license = "MPL-2.0"
dynamic = ["version"]

[tool.maturin]
module-name = "ols"
features = ["pyo3/extension-module"]
