[package]
name = "ohl-server"
description = "OpenOHL server mode: a project hosted for several users (QUIC, and a web client over WebSocket), the clients' replicas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ohl-session.workspace = true
ohl-line.workspace = true
ohl-core.workspace = true
ohl-cables.workspace = true
ohl-structures.workspace = true
ohl-weather.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "fs", "net"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
getrandom = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# A server on a network (feature `network`): the country server's database.
ohl-store-pg = { workspace = true, optional = true }
# Phase 10: the scoped checks the network's server computes.
ohl-scope = { workspace = true, optional = true }
ohl-clearance = { workspace = true, optional = true }
ohl-loads = { workspace = true, optional = true }
ohl-sections = { workspace = true, optional = true }
# Phase 13: OIDC sign-in on a network (an ID token's signature, issuer,
# audience and times checked; the issuer's keys fetched over HTTPS and
# kept).
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"], optional = true }
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }

[features]
# A server on a country server's database (PostgreSQL, ADR-0013 phase 5):
# the command line enables it; the desktop application does not need it.
network = [
    "offline-checks",
    "dep:ohl-store-pg",
    "dep:jsonwebtoken",
]
# The network's scoped checks run on an offline working set's file
# (2026-11-21: OHL-Design's Offline working set window), without the
# database: what `network` needs of them, alone.
offline-checks = [
    "dep:ohl-scope",
    "dep:ohl-clearance",
    "dep:ohl-loads",
    "dep:ohl-sections",
]

[dev-dependencies]
ohl-pointcloud.workspace = true
ohl-lidar.workspace = true
ohl-store-pg = { workspace = true, features = ["testing"] }
ohl-synth.workspace = true

[lints]
workspace = true
