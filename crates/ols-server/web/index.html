<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLS CAD — web client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <strong>OLS CAD</strong>
  <span id="project"></span>
  <span id="status" class="weak">not connected</span>
</header>
<main>
  <section id="join" class="panel">
    <h1>Join the session</h1>
    <p class="weak">The host gives you a link or an access code. A user of the project joins with
      their personal code; others join with the general one.</p>
    <form id="join-form" autocomplete="off">
      <label>User name <input id="user" maxlength="64" required></label>
      <label>Access code <input id="code" required spellcheck="false"></label>
      <button type="submit">Join</button>
    </form>
    <p id="join-error" class="error"></p>
  </section>
  <section id="views" hidden>
    <nav class="tabs">
      <button data-view="3d" class="active">3D</button>
      <button data-view="plan">Plan</button>
      <button data-view="profile">Profile</button>
      <span id="renderer" class="weak"></span>
      <span id="hint" class="weak"></span>
    </nav>
    <div id="stage">
      <canvas id="gpu"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </section>
  <aside id="side" hidden>
    <h2>Selection</h2>
    <div id="props" class="weak">Click a structure or a wire.</div>
    <form id="move" hidden>
      <div class="row">
        <label>x <input id="mx" type="number" step="0.01"></label>
        <label>y <input id="my" type="number" step="0.01"></label>
        <label>z <input id="mz" type="number" step="0.01"></label>
      </div>
      <button type="submit">Move structure</button>
    </form>
    <h2>People</h2>
    <ul id="people"></ul>
    <h2>Operations</h2>
    <ol id="log" reversed></ol>
    <h2>Notes</h2>
    <ul id="notes" class="weak"></ul>
  </aside>
</main>
<script src="gpu.js"></script>
<script src="app.js"></script>
</body>
</html>
