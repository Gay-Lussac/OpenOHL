[package]
name = "ohl-app"
description = "OHL-Design, the line application of OpenOHL: sag-tension, clearances and line layout in 3D, plan and profile views"
default-run = "ohl-design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ohl-design"
path = "src/main.rs"

# The former name, kept for a transition period: says so and runs the
# program above (`ohl-design`).
[[bin]]
name = "ols-cad"
path = "src/bin/ols-cad.rs"
test = false
doc = false

[dependencies]
ohl-core.workspace = true
ohl-cables.workspace = true
ohl-line.workspace = true
ohl-structures.workspace = true
ohl-weather.workspace = true
ohl-terrain.workspace = true
ohl-lidar.workspace = true
ohl-background.workspace = true
ohl-crs.workspace = true
ohl-pointcloud.workspace = true
ohl-session.workspace = true
ohl-clearance.workspace = true
ohl-io.workspace = true
ohl-server.workspace = true
ohl-loads.workspace = true
ohl-structures-fe.workspace = true
# The edits of a structure file, shared with the structure application.
ohl-structure-edit.workspace = true
# Edit… on a placed structure: its line values handed to the structure
# application (the link is the one place the application meets the core).
ohl-structure-loads.workspace = true
ohl-structure-link.workspace = true
ohl-sections.workspace = true
ohl-thermal.workspace = true
ohl-bom.workspace = true
ohl-spotting.workspace = true
ohl-plugins.workspace = true
serde_json.workspace = true
serde.workspace = true
toml_edit = "0.25"
# Native file dialogs (library files anywhere on the computer).
rfd = "0.17"
ohl-drawing.workspace = true
ohl-render.workspace = true
eframe.workspace = true
egui_dock.workspace = true
clap.workspace = true
png = "0.18"
# The artwork of assets/ (tool icons, the mark, the window icon) drawn
# from its SVG files: already used by ohl-drawing.
resvg = { version = "0.48", default-features = false }
log = "0.4"
env_logger = "0.11"
# The Python console (Plugins › Python console): an embedded interpreter.
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[features]
default = ["python"]
# The Python console; needs a shared Python 3.10+ (libpython) to build and run.
python = ["dep:pyo3", "dep:pyo3-build-config"]

[build-dependencies]
pyo3-build-config = { version = "0.29", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Writing a small LAZ survey for the point-cloud tests.
las = { version = "0.11", features = ["laz"] }
# Crafting a project file the session would refuse to write (tests).
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true
