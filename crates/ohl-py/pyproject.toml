[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "openohl"
description = "Python bindings for OpenOHL (open-source overhead line design)"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dynamic = ["version"]

[tool.maturin]
# `import ohl` (the package in python/ohl, around the compiled `ohl._ohl`).
module-name = "ohl._ohl"
python-source = "python"
features = ["pyo3/extension-module"]
