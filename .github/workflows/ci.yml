name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job has a time limit (timeout-minutes) of about 3x its expected
# duration, so a hang fails fast instead of burning CI minutes for 6 hours.

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15 # expected ~5 min (cold cache)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The desktop app embeds Python (its console).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # expected ~10 min (wasmtime compile on cold cache)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OLS_REQUIRE_PLUGIN_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/examples/hello-wasm
            plugins/examples/geojson
            plugins/examples/esri-grid
            plugins/tests/runaway
      - name: Build test plugins
        shell: bash
        run: |
          (cd plugins/examples/hello-wasm && cargo build --release --target wasm32-wasip2)
          (cd plugins/examples/geojson && cargo build --release --target wasm32-wasip2)
          (cd plugins/examples/esri-grid && cargo build --release --target wasm32-wasip2)
          (cd plugins/tests/runaway && cargo build --release --target wasm32-wasip2)
      - run: cargo test --workspace --exclude ols-py --locked

  msrv:
    name: Minimum Rust version (1.96)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20 # expected ~6 min
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  validate:
    name: Validation cases
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15 # expected ~4 min
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run validation cases
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked -p ols-cli -- validate --report validation-report.md
      - name: Publish report
        if: always()
        shell: bash
        run: test -f validation-report.md && cat validation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation-report.md
          if-no-files-found: ignore

  python:
    name: Python bindings
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15 # expected ~4 min
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest jsonschema
      - name: Wire libraries match the JSON Schema
        run: python .github/scripts/check_wire_schema.py
      - run: pip install ./crates/ols-py
      - run: pytest -q crates/ols-py/tests
      - run: python plugins/examples/hello-python/hello.py

  docs:
    name: Docs (rustdoc + book)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15 # expected ~4 min
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run --locked -p ols-cli -- validate --report docs/validation/report.md
      - run: mdbook build
      - run: cp -r target/doc target/book/api
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/book

  bench:
    name: Benchmarks
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25 # expected ~8 min: two benchmark runs; each benchmark ~3 s
    env:
      # Base commit: the PR base, or the previous head of the pushed branch.
      PARENT: ${{ github.event.pull_request.base.sha || github.event.before }}
      CRITERION_HOME: ${{ github.workspace }}/target/criterion-compare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Timings from different runners are not comparable (different CPUs),
      # so the parent commit is benchmarked on this same machine first.
      - name: Benchmark parent commit
        shell: bash
        run: |
          rm -rf "$CRITERION_HOME"
          if [ -n "$PARENT" ] && git cat-file -e "$PARENT^{commit}" 2>/dev/null; then
            git worktree add -f "$RUNNER_TEMP/parent" "$PARENT"
            (cd "$RUNNER_TEMP/parent" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              cargo bench --workspace --bench '*' -- --save-baseline parent) \
              || echo "::warning::parent commit benchmarks could not run; no comparison"
          else
            echo "::notice::no parent commit to compare with"
          fi
      - name: Benchmark this commit and compare (fail if > 1.5x slower)
        shell: bash
        run: |
          set -o pipefail
          cargo bench --locked --workspace --bench '*' -- --baseline-lenient parent
          python3 .github/scripts/check_bench.py "$CRITERION_HOME" 1.5
